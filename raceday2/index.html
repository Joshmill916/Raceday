/* ============================================================================
   §4  LINEUPS
   v1 stacked every class's every stage in one endless scroll. v2 keeps exactly
   the same content but puts a class filter on top, so on race night you look at
   the class that is about to go out rather than scrolling past four others.
   ========================================================================= */

function discNum(num) {
  /* Vehicle number on the plate; the long modifier shrinks 3+ character numbers
     like 123x or A12B so they stay inside the disc. */
  const s = String(num);
  return '<div class="disc sm' + (s.length >= 3 ? ' long' : '') + '">' + esc(s) + '</div>';
}
function discPill(n) { return '<div class="disc sm pill">' + esc(String(n)) + '</div>'; }

function gridMarkup(racers, single) {
  const sub = r => r.tag || (r.qualTime ? '⏱ ' + r.qualTime : 'Pill #' + r.pill);
  /* Any row that knows its driver opens the driver card — every role, every
     lineup. The TV display builds its own markup and stays non-clickable. */
  const tap = r => r.id ? ' onclick="openDriverCard(' + r.id + ')" style="cursor:pointer"' : '';
  if (single) {
    return '<div class="grid1">' + racers.map((r, i) =>
      '<div class="slot' + (i === 0 ? ' pole' : '') + '"><span class="spot">P' + (i + 1) + '</span>'
      + (i === 0 ? '<span class="poletag">Pole</span>' : '')
      + discNum(r.num) + '<div class="who"' + tap(r) + '><b>' + esc(r.name) + '</b><span>' + esc(sub(r)) + '</span></div></div>'
    ).join('') + '</div>';
  }
  return '<div class="lane-labels"><div>Inside line</div><div>Outside line</div></div><div class="grid2">'
    + racers.map((r, i) => {
        const pos = i + 1, pt = posText(pos);
        return '<div class="slot ' + (pos % 2 ? 'inside' : 'outside') + (pos === 1 ? ' pole' : '') + '">'
          + '<span class="spot">P' + pos + ' · Row ' + pt.row + '</span>'
          + (pos === 1 ? '<span class="poletag">Pole</span>' : '')
          + discNum(r.num) + '<div class="who"' + tap(r) + '><b>' + esc(r.name) + '</b><span>' + esc(sub(r)) + '</span></div></div>';
      }).join('') + '</div>';
}

function renderGrid() {
  if (deviceRole() === 'viewer') return renderFanView();
  // Passive TV board: same full grid layout (it's what the board should show once the
  // TV overlay is closed), just no mutating/operator controls. adminOk() also refuses
  // tv now, so this is belt-and-suspenders, not the only gate — mirrors the same fix
  // ported to raceday/index.html (v1) this session.
  const isTv = deviceRole() === 'tv';
  const el = document.getElementById('gridWrap');
  if (!S.classes.length) { el.innerHTML = '<h2>Lineups</h2>' + emptyState('▦', 'No classes set up yet.', '⚙ Add a class', "nav('admin');admOpen('classes')"); return; }

  const single = S.settings.gridStyle === 'single';
  const shown = S.classes.filter(c => UI.viewClsId == null || c.id === UI.viewClsId);

  let h = '<div class="spread" style="margin-bottom:4px"><h2 style="margin:0">Lineups</h2>'
    + '<span class="push"></span>'
    + (isTv ? '' :
      '<button class="btn btn-sm btn-primary" onclick="openTV()">📺 TV display</button>'
      + '<button class="btn btn-sm" onclick="openPrint()">🖨 Print</button>'
      + '<button class="btn btn-sm" onclick="openImport(\'qual\')">📥 Import timing</button>')
    + '</div>'
    + '<p class="sub">Lowest pill starts up front; set 2 runs inverted. Spots update live as drivers draw. '
    + 'Tap any driver for their card.</p>'
    + '<div class="spread" style="margin-bottom:14px">'
    +   '<div class="tabs" style="padding-bottom:0;flex:1">'
    +     '<button class="tab' + (UI.viewClsId == null ? ' on' : '') + '" onclick="setViewClass(null)">All classes</button>'
    +     S.classes.map(c => '<button class="tab' + (UI.viewClsId === c.id ? ' on' : '')
          + '" onclick="setViewClass(' + c.id + ')">' + esc(c.name) + '</button>').join('')
    +   '</div>'
    +   '<div class="seg"><button class="' + (single ? '' : 'on') + '" onclick="setGridStyle(\'double\')">Double file</button>'
    +   '<button class="' + (single ? 'on' : '') + '" onclick="setGridStyle(\'single\')">Single file</button></div>'
    + '</div>';

  shown.forEach(cls => { h += classGridMarkup(cls, single, isTv); });
  el.innerHTML = h;
}

function classGridMarkup(cls, single, isTv) {
  const racers = classRacers(cls.id);
  let h = '<section style="margin-bottom:30px"><div class="spread" style="margin-bottom:10px">'
    + '<h3 style="margin:0">' + esc(cls.name) + '</h3>'
    + '<span class="badge badge-dim">' + plural(racers.length, 'entered', 'entered') + '</span>'
    + (racers.length && !isTv ? '<button class="btn btn-sm push" onclick="openQualTimes(' + cls.id + ')">⏱ Qualifying times</button>' : '')
    + '</div>';
  if (!racers.length) return h + emptyState('🏁', 'No drivers yet — first to sign up takes the pole.') + '</section>';

  const invN = classInvertN(cls);
  const scope = cls.invertScope || 'field';
  const heats = classHeats(cls);
  const set1 = invertWithinHeats(heatArrays(racers, cls), cls);
  const set2 = set1.map(heat => [...heat].reverse());
  const field = invertField(racers, cls);
  const invNote = invN ? ' · top ' + invN + ' inverted (' + (scope === 'heat' ? 'each heat' : 'whole field') + ')' : '';

  if (heats === 0) {
    h += '<div class="slbl">Qualifying order — seeds the mains directly, no heats</div>' + gridMarkup(racers, single);
  } else if (set1.length === 1) {
    h += '<div class="slbl">Starting grid' + (heats === 1 ? ' — qualifying order' : ' — set 1') + invNote + '</div>' + gridMarkup(set1[0], single);
    if (heats === 2) h += '<div class="slbl">Set 2 — inverted</div>' + gridMarkup(set2[0], single);
  } else {
    h += '<div class="slbl">Full field — ' + (invN && scope === 'field'
        ? 'qualifying order, top ' + invN + ' inverted'
        : (heats === 1 ? 'qualifying order' : 'pill draw order')) + '</div>' + gridMarkup(field, single);
    h += '<div class="slbl">' + (heats === 1 ? 'Qualifying heats' : 'Set 1 heats') + invNote + '</div>';
    set1.forEach((heat, hi) => {
      h += '<p class="heat-cap"><b>Heat ' + (hi + 1) + '</b> · ' + plural(heat.length, 'car') + '</p>' + gridMarkup(heat, single);
    });
    if (heats === 2) {
      h += '<div class="slbl">Set 2 heats — inverted</div>';
      set2.forEach((heat, hi) => {
        h += '<p class="heat-cap"><b>Heat ' + (hi + 1) + '</b> · ' + plural(heat.length, 'car') + ' · inverted</p>' + gridMarkup(heat, single);
      });
    }
  }

  /* Once every heat finish is in, the main-event grids post here too. A 0-heat
     class is complete immediately, so its mains post as soon as drivers enter. */
  if (classComplete(cls.id)) {
    const fd = featureData(cls.id);
    const toRow = heats === 0
      ? s => ({ id: s.id, name: s.name, num: s.num, tag: s.qualTime ? '⏱ ' + s.qualTime : 'Seed P' + s.pill })
      : s => ({ id: s.id, name: s.name, num: s.num, tag: 'Heat total ' + s.pts });
    const bmInvNote = clsBMainInvert(cls) ? ' · top ' + clsBMainInvert(cls) + ' start inverted' : '';
    const ftInvNote = clsFeatInvert(cls) ? ' · top ' + clsFeatInvert(cls) + ' start inverted' : '';
    if (fd.mains.length) {
      fd.mains.forEach(m => {
        h += '<div class="slbl">' + esc(m.label) + ' — top ' + fd.transfers + ' to ' + esc(m.feeds) + bmInvNote + '</div>'
          + gridMarkup(m.drivers.map(toRow), single);
      });
      if (fd.toFeatureSpots > 0 && fd.transferred.length >= fd.toFeatureSpots) {
        h += '<div class="slbl">🏁 Feature lineup' + ftInvNote + '</div>' + gridMarkup(featureGridOrder(fd, cls.id).map(toRow), single);
      } else {
        h += emptyState('🏁', 'The feature grid posts here once the main finishes are entered on the Score tab.');
      }
    } else {
      h += '<div class="slbl">🏁 Feature lineup — ' + (heats === 0 ? 'by qualifying order' : 'by heat total (low wins)') + ftInvNote + '</div>'
        + gridMarkup(featureGridOrder(fd, cls.id).map(toRow), single);
    }
  }
  return h + '</section>';
}

/* --------------------------------------------------------- qualifying times */
function openQualTimes(clsId) {
  if (!adminOk()) return;
  const cls = classById(clsId); if (!cls) return;
  _qtClsId = clsId;
  openSheet(cls.name + ' — qualifying',
    '<div id="qtBody"></div><p class="tiny" id="qtHint" style="margin-top:12px"></p>',
    '<button class="btn" onclick="saveQualTimes()">Save times</button>'
    + '<button class="btn btn-primary" onclick="applyQualGrid()">Set grid from times</button>',
    { wide: true, onClose: () => { _qtClsId = null; } });

}
function closeQualTimes() { closeSheet(); }
function renderQtBody() {
  const el = document.getElementById('qtBody');
  if (!el) return;
  const racers = classRacers(_qtClsId);
  if (!racers.length) { el.innerHTML = emptyState('⏱', 'No drivers in this class yet.'); return; }
  el.innerHTML = '<div class="list">' + racers.map(r =>
    '<div class="lrow qt-row"><div class="pos qt-rank">P' + r.pill + '</div>' + discNum(r.num)

    + '<input class="inline-num" style="width:104px;font-size:16px" inputmode="decimal" placeholder="—" '

function qtPreview() {
  const order = qtOrder();
  const rankOf = {}; order.forEach((r, i) => rankOf[r.id] = i + 1);
  document.querySelectorAll('#qtBody .qt-row').forEach(row => {
    const inp = row.querySelector('input[data-id]');
    const id = parseInt(inp.getAttribute('data-id'), 10);
    const badge = row.querySelector('.qt-rank');
    if (badge) badge.textContent = 'P' + rankOf[id];
    const raw = inp.value.trim();
    inp.style.borderColor = (raw && impTimeUnparsed(raw)) ? 'var(--pit-red)' : '';
  });
  const timed = order.filter(r => r.t !== Infinity).length;
  const hint = document.getElementById('qtHint');
  if (hint) hint.textContent = timed
    ? plural(timed, 'driver') + ' timed. "Set grid" puts the fastest on pole; untimed drivers start at the back.'
    : 'Enter times, then "Set grid" reorders the starting lineup. Or just save to record them.';
}

function closeDriverCard() { closeSheet(); }
function dcStat(n, l) { return '<div class="dc-stat"><div class="n">' + esc(String(n)) + '</div><div class="l">' + esc(l) + '</div></div>'; }
function renderDriverCard() { if (driverCardId) openDriverCard(driverCardId); }
/* ============================================================================
   §5  SCORING
   The biggest time sink on race night. v1 gave every driver a <select>, which
   means reading a name, opening a dropdown, and finding a number — per car, per
   heat, per class. v2 keeps that mode and adds the two ways people who actually
   watch a race score it:

     tap  — tap drivers in the order they crossed the line; positions assign
            themselves. Long-press for DNF/DNS/DQ. Undo the last tap.
     pad  — type the car number, Enter; that car takes the next position.

   All three write the SAME heatResults keys through the same saveResult(), so
   governance, locking, the audit log, versions and duplicate warnings are
   untouched by the choice of entry mode.
   ========================================================================= */

function setScoreMode(m) {
  UI.scoreMode = m;
  try { localStorage.setItem('rd_score_mode', m); } catch (e) {}
  renderClassResults(resTab);
}

function renderResults() {
  const el = document.getElementById('resultsWrap');
  const withRacers = S.classes.filter(c => classRacers(c.id).length);
  if (!withRacers.length) {
    el.innerHTML = '<h2>Score</h2>' + emptyState('⏱', 'No drivers registered yet.', 'Open sign-up', "nav('signup')");
    return;
  }
  if (!resTab || !withRacers.find(c => c.id === resTab)) resTab = withRacers[0].id;

  el.innerHTML = '<div class="spread" style="margin-bottom:4px"><h2 style="margin:0">Score</h2>'
    + '<button class="btn btn-sm push" onclick="openImport(\'heat\')">📥 Import from timing</button></div>'
    + '<p class="sub">Enter finishes and the standings, B-mains and feature lineup build themselves.</p>'
    + '<div class="tabs">' + withRacers.map(c => {
        const p = classProgress(c.id);
        const dot = p && p.featDone ? '✅ ' : p && p.heatsDone ? '◐ ' : '';
        return '<button class="tab' + (c.id === resTab ? ' on' : '') + '" onclick="resTab=' + c.id + ';renderResults()">'
          + dot + esc(c.name) + '</button>';
      }).join('') + '</div><div id="resBody"></div>';
  renderClassResults(resTab);
}

/* Governance strip: official/unofficial, lock, override, versions. */
function resultGovBar(clsId) {
  const g = resGov(clsId), k = resKey(clsId);
  const versions = (S.raceDay.resultVersions && S.raceDay.resultVersions[k]) || [];
  const isAdmin = deviceRole() === 'admin';
  let h = '<div class="gov">'
    + (g.status === 'official' ? '<span class="badge badge-green">✅ Official</span>' : '<span class="badge badge-amber">📝 Unofficial</span>')
    + (g.locked ? '<span class="badge badge-red">' + (resOverride[k] ? '🔓 Locked · override on' : '🔒 Locked') + '</span>' : '')
    + '<span class="tiny push">Official results are decided by the race director — this is an aid only.</span>';
  if (isAdmin) {
    h += '<div class="rowflex" style="width:100%;margin-top:4px">'
      + (g.status === 'official'
          ? '<button class="btn btn-sm" onclick="setResStatus(' + clsId + ',\'unofficial\')">Mark unofficial</button>'
          : '<button class="btn btn-sm btn-primary" onclick="setResStatus(' + clsId + ',\'official\')">Mark official</button>')
      + '<button class="btn btn-sm" onclick="toggleResLock(' + clsId + ')">' + (g.locked ? 'Unlock' : '🔒 Lock results') + '</button>'
      + (g.locked && !resOverride[k] ? '<button class="btn btn-sm btn-danger" onclick="overrideRes(' + clsId + ')">Override</button>' : '')
      + '<button class="btn btn-sm" onclick="saveResVersion(' + clsId + ')" title="Snapshot the current finishes so you can roll back">💾 Save version</button>'
      + (versions.length
          ? '<select class="btn btn-sm" style="width:auto" onchange="if(this.value!==\'\'){restoreResVersion(' + clsId + ',parseInt(this.value));this.value=\'\'}">'
            + '<option value="">↺ Restore version…</option>'
            + versions.map((v, i) => '<option value="' + i + '">' + esc(v.label) + '</option>').join('') + '</select>'
          : '')
      + '</div>';
  }
  return h + '</div>';
}

/* ------------------------------------------------------------ entry widgets */
function finSelect(clsId, rk, n, val) {
  let o = '<option value="">—</option>';
  for (let i = 1; i <= n; i++) o += '<option value="' + i + '"' + (val == i ? ' selected' : '') + '>' + i + '</option>';
  ['DNF', 'DNS', 'DQ'].forEach(c => { o += '<option value="' + c + '"' + (val === c ? ' selected' : '') + '>' + c + '</option>'; });
  return '<select class="fin-sel' + (val != null ? ' set' : '') + '" onchange="saveResult(' + clsId + ',\'' + rk + '\',this.value)">' + o + '</select>';
}

/* One race's worth of entry, in whichever mode this device prefers.
   `group` = {clsId, prefix, drivers:[{id,name,num}], title, sub, headClass} */
function raceEntry(group) {
  const res = getRes(group.clsId);
  const keyOf = id => group.prefix(id);
  const dup = dupFinishWarn(res, group.drivers.map(d => d.id), keyOf);
  const done = group.drivers.filter(d => res[keyOf(d.id)] != null).length;

  let h = '<div class="hb"><div class="hh' + (group.headClass || '') + '"><span>' + esc(group.title) + '</span>'
    + (group.sub ? '<small class="tiny">' + group.sub + '</small>' : '')
    + '<span class="push"></span>'
    + '<span class="badge ' + (done === group.drivers.length ? 'badge-green' : 'badge-dim') + '">'
    + done + '/' + group.drivers.length + '</span>' + dup + '</div>';

  if (UI.scoreMode === 'select') {
    h += group.drivers.map(d =>
      '<div class="lrow">' + discNum(d.num) + '<div class="nm">' + esc(d.name) + (d.sub ? '<small>' + d.sub + '</small>' : '') + '</div>'
      + (d.tag || '') + finSelect(group.clsId, keyOf(d.id), group.drivers.length, res[keyOf(d.id)]) + '</div>').join('');
    return h + '</div>';
  }

  /* tap + pad modes share the same body: a list of cars, each showing its
     assigned position, plus the controls above it. */
  const gid = group.gid;
  const all = done >= group.drivers.length;
  /* Once the field is fully placed there is no "next position" — saying P7 in a
     six-car heat reads like something is still missing. */
  const nextTxt = all
    ? '<b style="color:var(--flag-green)">All ' + group.drivers.length + ' placed</b>'
    : '<b style="color:var(--plate)">P' + scoreNextPos(group) + '</b>';
  if (UI.scoreMode === 'pad') {
    h += '<div class="padin" style="padding:12px 14px 0">'
      + '<input id="pad_' + gid + '" inputmode="numeric" autocomplete="off" placeholder="#"' + (all ? ' disabled' : '') + ' '
      + 'onkeydown="if(event.key===\'Enter\'){padEnter(\'' + gid + '\');event.preventDefault()}">'
      + '<button class="btn" onclick="padEnter(\'' + gid + '\')"' + (all ? ' disabled' : '') + '>Next position →</button>'
      + '<button class="btn btn-sm btn-ghost" onclick="scoreUndo(\'' + gid + '\')">↶ Undo</button>'
      + '<span class="tiny">' + (all ? '' : 'Next: ') + nextTxt + '</span></div>';
  } else {
    h += '<div class="rowflex" style="padding:12px 14px 0">'
      + '<span class="tiny">' + (all ? '' : 'Tap in finishing order. Next: ') + nextTxt + '</span>'
      + '<span class="push"></span>'
      + '<button class="btn btn-sm btn-ghost" onclick="scoreUndo(\'' + gid + '\')">↶ Undo</button>'
      + '<button class="btn btn-sm btn-ghost" onclick="scoreClear(\'' + gid + '\')">Clear</button></div>';
  }

  h += '<div class="tapgrid" style="padding:12px 14px 14px">' + group.drivers.map(d => {
    const v = res[keyOf(d.id)];
    const placed = v != null;
    const lbl = v === 'DNF' || v === 'DNS' || v === 'DQ' ? v : (placed ? 'P' + v : '');
    return '<button class="tapcard' + (placed ? ' placed' : '') + '" '
      + 'onclick="scoreTap(\'' + gid + '\',' + d.id + ')" '
      + 'oncontextmenu="scoreFlag(\'' + gid + '\',' + d.id + ');return false" '
      + 'ontouchstart="scoreLongStart(\'' + gid + '\',' + d.id + ')" ontouchend="scoreLongEnd()" ontouchmove="scoreLongEnd()">'
      + discNum(d.num) + '<span class="nm">' + esc(d.name) + (d.sub ? '<small>' + d.sub + '</small>' : '') + '</span>'
      + '<span class="assigned">' + lbl + '</span></button>';
  }).join('') + '</div>';
  return h + '</div>';
}

/* Groups are rebuilt on every render; this index lets the tap/pad handlers find
   the one a button belongs to without threading state through the markup. */
let _scoreGroups = {};

function scoreNextPos(g) {
  const res = getRes(g.clsId);
  const used = g.drivers.map(d => res[g.prefix(d.id)]).filter(v => typeof v === 'number');
  let n = 1;
  while (used.indexOf(n) >= 0) n++;
  return n;
}
function scoreTap(gid, driverId) {
  const g = _scoreGroups[gid]; if (!g) return;
  const res = getRes(g.clsId), rk = g.prefix(driverId);
  /* Tapping an already-placed car clears it, so a misplaced tap is one tap to fix. */
  saveResult(g.clsId, rk, res[rk] != null ? '' : String(scoreNextPos(g)));
}
function scoreFlag(gid, driverId) {
  const g = _scoreGroups[gid]; if (!g) return;
  const d = g.drivers.find(x => x.id === driverId); if (!d) return;
  openSheet(d.name + ' — #' + d.num, '<p class="sub">Mark this car\'s result.</p>',
    ['DNF', 'DNS', 'DQ'].map(c =>
      '<button class="btn" onclick="closeSheet();saveResult(' + g.clsId + ',\'' + g.prefix(driverId) + '\',\'' + c + '\')">' + c + '</button>').join('')
    + '<button class="btn btn-ghost" onclick="closeSheet();saveResult(' + g.clsId + ',\'' + g.prefix(driverId) + '\',\'\')">Clear</button>');
}
let _longTimer = null;
function scoreLongStart(gid, driverId) {
  clearTimeout(_longTimer);
  _longTimer = setTimeout(() => { _longTimer = null; scoreFlag(gid, driverId); }, 550);
}
function scoreLongEnd() { clearTimeout(_longTimer); _longTimer = null; }
function scoreUndo(gid) {
  const g = _scoreGroups[gid]; if (!g) return;
  const res = getRes(g.clsId);
  let bestId = null, bestPos = 0;
  g.drivers.forEach(d => {
    const v = res[g.prefix(d.id)];
    if (typeof v === 'number' && v > bestPos) { bestPos = v; bestId = d.id; }
  });
  if (bestId == null) { toast('Nothing to undo.'); return; }
  saveResult(g.clsId, g.prefix(bestId), '');
}
function scoreClear(gid) {
  const g = _scoreGroups[gid]; if (!g) return;
  if (!confirm('Clear every finish in ' + g.title + '?')) return;
  const res = getRes(g.clsId);
  g.drivers.forEach(d => { delete res[g.prefix(d.id)]; });
  logAudit('Cleared finishes', g.title, '(blank)', (classById(g.clsId) || {}).name);
  save();
  renderClassResults(g.clsId);
}
function padEnter(gid) {
  const g = _scoreGroups[gid]; if (!g) return;
  const inp = document.getElementById('pad_' + gid);
  const raw = (inp ? inp.value : '').trim();
  if (!raw) return;
  const hits = g.drivers.filter(d => String(d.num).toLowerCase() === raw.toLowerCase());
  if (!hits.length) { toast('No car #' + raw + ' in this race.', 'err'); if (inp) inp.select(); return; }
  const res = getRes(g.clsId), rk = g.prefix(hits[0].id);
  if (res[rk] != null) { toast('#' + raw + ' already has ' + (typeof res[rk] === 'number' ? 'P' + res[rk] : res[rk]) + '.', 'err'); if (inp) inp.select(); return; }
  saveResult(g.clsId, rk, String(scoreNextPos(g)));
  /* saveResult re-renders; put the caret back so the next number can just be typed. */
  const back = document.getElementById('pad_' + gid);
  if (back) { back.value = ''; back.focus(); }
}

/* --------------------------------------------------------------- the class */
function renderClassResults(clsId) {
  const el = document.getElementById('resBody');
  if (!el) return;                      /* score pane not on screen */
  const racers = classRacers(clsId);
  if (!racers.length) { el.innerHTML = emptyState('⏱', 'No drivers in this class.'); return; }

  _scoreGroups = {};
  const cls = classById(clsId);
  const set1 = heatSet(racers, cls);
  const set2 = set1.map(heat => [...heat].reverse());
  const res = getRes(clsId);
  const heats = classHeats(cls);
  const fd = featureData(clsId);
  const locked = resLocked(clsId);

  let h = resultGovBar(clsId);
  h += '<div class="spread" style="margin-bottom:12px">'
    + pointsRaceToggle(clsId, fd, res)
    + '<span class="push"></span>'
    + '<div class="seg seg-plate">'
    +   '<button class="' + (UI.scoreMode === 'tap' ? 'on' : '') + '" onclick="setScoreMode(\'tap\')" title="Tap drivers in the order they finished">Tap order</button>'
    +   '<button class="' + (UI.scoreMode === 'pad' ? 'on' : '') + '" onclick="setScoreMode(\'pad\')" title="Type the car number for each position">Number pad</button>'
    +   '<button class="' + (UI.scoreMode === 'select' ? 'on' : '') + '" onclick="setScoreMode(\'select\')" title="A dropdown per driver">Dropdowns</button>'
    + '</div></div>';

  h += '<div' + (locked ? ' style="opacity:.55;pointer-events:none"' : '') + '>';

  /* --- heats (a straight-to-mains class races none) --- */
  if (heats >= 1) {
    h += '<div class="slbl">' + (heats === 1 ? 'Qualifying heat' : 'Set 1 heats — pill order') + '</div>';
    set1.forEach((heat, hi) => { h += heatGroup(clsId, 'h1', hi, heat, ''); });
    if (heats === 2) {
      h += '<div class="slbl">Set 2 heats — inverted</div>';
      set2.forEach((heat, hi) => { h += heatGroup(clsId, 'h2', hi, heat, ' inv'); });
    }
  }

  /* --- standings / seeding --- */
  const standings = calcStandings(clsId);
  const advMap = {};
  fd.locked.forEach(r => { advMap[r.id] = { label: '→ Feature', feat: true }; });
  fd.mains.forEach(m => { m.drivers.forEach(r => { if (!advMap[r.id]) advMap[r.id] = { label: '→ ' + m.label, feat: false }; }); });

  h += '<div class="slbl">' + (heats === 0 ? 'Seeding — qualifying order' : 'Heat totals — the "race pill"') + '</div>'
    + '<div class="hb"><div class="hh"><span>' + (heats === 0 ? 'Seeds' : 'Standings') + '</span>'
    + '<small class="tiny">' + (heats === 0
        ? 'fastest qualifier is the top seed · mains fill straight from here'
        : 'finishes added up · low wins · ties go to the pill draw') + '</small></div>'
    + standings.map((s, i) => {
        const detail = heats === 0
          ? (s.qualTime ? '⏱ ' + s.qualTime : 'seed P' + s.pill)
          : 'heat' + (heats === 1 ? '' : 's') + ': ' + (heats === 1 ? finLabel(s.f1) : finLabel(s.f1) + ' + ' + finLabel(s.f2));
        const adv = advMap[s.id];
        return '<div class="lrow"><div class="pos' + (i < 3 ? ' p' + (i + 1) : '') + '">' + (i + 1) + '</div>'
          + discNum(s.num)
          + '<div class="nm">' + esc(s.name) + '<small>' + esc(detail) + '</small></div>'
          + (s.scored < heats ? '<span class="badge badge-amber">' + s.scored + ' of ' + heats + '</span>' : '')
          + (adv ? '<span class="' + (adv.feat ? 'badge badge-plate' : 'transfer-tag') + '">' + esc(adv.label) + '</span>' : '')
          + (heats === 0 ? '' : '<span class="pts">' + (s.scored ? s.pts : '—') + '</span>') + '</div>';
      }).join('') + '</div>';

  /* --- B-mains --- */
  const bmInv = clsBMainInvert(clsId);
  fd.mains.forEach(m => {
    const gid = 'bm' + m.key;
    _scoreGroups[gid] = {
      gid, clsId, title: m.label, prefix: id => bmKey(m.key, id),
      drivers: m.drivers.map(r => ({
        id: r.id, name: r.name, num: r.num,
        sub: (heats === 0 ? (r.qualTime ? '⏱ ' + r.qualTime : 'seed P' + r.pill) : 'total ' + r.pts),
        tag: m.made.some(t => t.id === r.id) ? '<span class="transfer-tag">→ ' + esc(m.feeds) + '</span>' : ''
      }))
    };
    h += '<div class="slbl">' + esc(m.label) + '</div>'
      + raceEntry(Object.assign({}, _scoreGroups[gid], {
          headClass: ' bmain',
          sub: 'top ' + fd.transfers + ' → ' + esc(m.feeds) + (bmInv ? ' · top ' + bmInv + ' start inverted' : '')
        }));
  });

  /* --- feature --- */
  const dp = dayPoints(clsId);
  const ftInv = clsFeatInvert(clsId);
  let ftRows = fd.locked.map(s => ({ r: s, tag: heats === 0
    ? '<span class="transfer-tag">' + esc(s.qualTime ? '⏱ ' + s.qualTime : 'seed P' + s.pill) + '</span>'
    : '<span class="pts">' + s.pts + '</span>' }));
  if (fd.mains.length) {
    for (let t = 0; t < fd.toFeatureSpots; t++) {
      const r = fd.transferred[t];
      ftRows.push(r ? { r, tag: '<span class="transfer-tag">' + esc(transferOrigin(fd, clsId, r.id)) + '</span>' } : { tbd: true });
    }
  }
  /* Apply the feature invert to the STARTING order only once every transfer spot is
     known, so placeholder rows never shuffle mid-night. */
  if (ftInv && !ftRows.some(x => x.tbd)) ftRows = invertTop(ftRows, ftInv);

  const ftDrivers = ftRows.filter(x => !x.tbd).map(x => ({
    id: x.r.id, name: x.r.name, num: x.r.num,
    tag: x.tag + (dp && res['ft_' + x.r.id] != null
      ? '<span class="transfer-tag">+' + (typeof res['ft_' + x.r.id] === 'number' ? dp[x.r.id] : S.settings.points.beyond) + ' pts</span>'
      : '')
  }));
  _scoreGroups.ft = { gid:'ft', clsId, title:'Feature', prefix: id => 'ft_' + id, drivers: ftDrivers };

  h += '<div class="slbl">Feature lineup &amp; finish</div>'
    + raceEntry(Object.assign({}, _scoreGroups.ft, {
        title: '🏁 Feature',
        headClass: ' feat',
        sub: (fd.mains.length
              ? fd.locked.length + (heats === 0 ? ' on qualifying' : ' on heat totals') + ' + ' + fd.toFeatureSpots + ' transferring up'
              : (heats === 0 ? 'lined up by qualifying order' : 'lined up by heat totals'))
             + (ftInv ? ' · top ' + ftInv + ' start inverted' : '')
             + (isPointsRace(clsId) ? ' · finishes award series points' : '')
      }));
  const tbd = ftRows.filter(x => x.tbd).length;
  if (tbd) h += '<p class="tiny" style="margin:-8px 0 14px">' + plural(tbd, 'transfer spot')
    + ' still open — score the mains to fill ' + (tbd === 1 ? 'it' : 'them') + '.</p>';

  h += '</div>';
  el.innerHTML = h;
}

function heatGroup(clsId, set, hi, heat, invClass) {
  const gid = set + '_' + hi;
  _scoreGroups[gid] = {
    gid, clsId, title: 'Heat ' + (hi + 1), prefix: id => set + '_' + id,
    drivers: heat.map(r => ({ id: r.id, name: r.name, num: r.num }))
  };
  return raceEntry(Object.assign({}, _scoreGroups[gid], {
    headClass: invClass, sub: invClass ? 'inverted' : ''
  }));
}

/* "Today counts toward the points series" — enabled only once the feature is fully
   entered. A DNF/DNS/DQ is a finished result for that purpose, so any stored value
   counts; otherwise one DNF could permanently lock the toggle. */
function pointsRaceToggle(clsId, fd, res) {
  const field = [...fd.locked, ...fd.transferred];
  const done = field.length > 0 && field.every(r => res['ft_' + r.id] != null);
  return '<label class="check" style="' + (done ? '' : 'opacity:.55') + '">'
    + '<input type="checkbox"' + (isPointsRace(clsId) ? ' checked' : '')
    + (done ? '' : ' disabled title="Enter all feature finishes to enable"')
    + ' onchange="togglePointsRace(' + clsId + ',this.checked)">'
    + '<b>Today counts toward the points series</b></label>';
}

function renderPoints() {
  const el = document.getElementById('pointsWrap');
  UI.ptsNames = seriesClassNames();
  if (!UI.ptsNames.length) {
    el.innerHTML = '<h2>Points series</h2>' + emptyState('🏆', 'No classes yet — set up classes in Admin first.',
      deviceRole() === 'admin' ? '⚙ Add a class' : '', "nav('admin');admOpen('classes')");
    return;
  }
  if (!UI.ptsTab || !UI.ptsNames.includes(UI.ptsTab)) UI.ptsTab = UI.ptsNames[0];

  let h = '<h2>Points series</h2>'
    + '<p class="sub">Season standings by class. Feature finishes earn the points set in Admin — tonight counts live once finishes are in, and past race days count from history.</p>'
    + '<div class="tabs">' + UI.ptsNames.map((n, i) =>
        '<button class="tab' + (n === UI.ptsTab ? ' on' : '') + '" onclick="UI.ptsTab=UI.ptsNames[' + i + '];renderPoints()">'
        + esc(n) + '</button>').join('') + '</div>';

  const cls = S.classes.find(c => c.name.toLowerCase() === UI.ptsTab.toLowerCase());
  if (cls && classRacers(cls.id).length) {
    const state = !isPointsRace(cls.id)
      ? ['badge-dim', 'Tonight is not a points race for this class — toggle it on the Score tab.']
      : dayPoints(cls.id)
        ? ['badge-green', 'Tonight is a points race — the feature finishes below are already counted.']
        : ['badge-amber', 'Tonight is a points race — it counts here once feature finishes are entered.'];
    h += '<div class="note note-info" style="margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">'
      + '<span class="badge ' + state[0] + '">Tonight</span>' + esc(state[1]) + '</div>';
  }

  const rows = seriesStandings(UI.ptsTab);
  if (!rows.length) {
    h += emptyState('🏆', 'No points yet — they appear once feature finishes are entered, and add up as race days are archived.');
  } else {
    h += '<div class="card card-flush"><div class="scroll-x"><table class="tbl">'
      + '<thead><tr><th></th><th>Driver</th><th>#</th><th class="r">Points</th><th class="r">Races</th></tr></thead><tbody>'
      + rows.map((r, i) =>
          '<tr><td class="pos' + (i < 3 ? ' p' + (i + 1) : '') + '" style="width:34px">' + (i + 1) + '</td>'
          + '<td style="font-weight:600">' + esc(r.name) + '</td>'
          + '<td class="muted">#' + esc(r.num) + '</td>'
          + '<td class="r"><span class="pts">' + r.pts + '</span></td>'
          + '<td class="r muted">' + r.days + '</td></tr>').join('')
      + '</tbody></table></div></div>';
  }
  el.innerHTML = h;
}
/* ============================================================================
   §10 TV DISPLAY
   ========================================================================= */
const TV = { on:false, idx:0, locked:false, timer:null, ctlTimer:null };
const TV_SECS = 12;

/* ============================================================================
   §10  TV DISPLAY — broadcast mode
   v1 rotated only lineup/heat/main/feature grids. v2 keeps that engine verbatim
   (tvGridSlides/tvPanelMarkup/tvGridMarkup, renamed but byte-identical logic)
   and appends two new slide kinds: feature RESULTS once a class finishes, and a
   POINTS top-10 once the series has standings — so the screen keeps saying
   something worth watching after the last green flag, instead of looping the
   same grids all night. Header is persistent (track, clock, page count);
   overflow past 16 cars still splits into two columns on the same screen.
   ========================================================================= */

/* Lineup/heat/main/feature slides — verbatim v1 tvSlides(), renamed. */
function tvGridSlides() {
  const slides = [];
  S.classes.forEach(cls => {
    const racers = classRacers(cls.id);
    if (!racers.length) return;
    const heats = classHeats(cls);
    const set1 = heatSet(racers, cls);
    const set2 = set1.map(h => [...h].reverse());
    if (heats === 0) {
      slides.push({ title: cls.name, sub: 'Qualifying order — straight to mains', racers, kind:'grid' });
    } else if (set1.length === 1) {
      slides.push({ title: cls.name, sub: 'Starting grid — Set 1', racers: set1[0], kind:'grid' });
      slides.push({ title: cls.name, sub: 'Set 2 — inverted', racers: set2[0], kind:'grid' });
    } else {
      set1.forEach((h, i) => slides.push({ title: cls.name, sub: 'Heat ' + (i + 1) + ' — Set 1', racers: h, kind:'grid' }));
      set2.forEach((h, i) => slides.push({ title: cls.name, sub: 'Heat ' + (i + 1) + ' — Set 2 · inverted', racers: h, kind:'grid' }));
    }
    if (classComplete(cls.id)) {
      const fd = featureData(cls.id);
      const toRow = s => ({ name: s.name, num: s.num });
      if (fd.mains.length) {
        fd.mains.forEach(m => {
          const feedTxt = m.feeds === 'the feature' ? 'feature' : m.feeds;
          slides.push({ title: cls.name, sub: m.label + ' — top ' + fd.transfers + ' to ' + feedTxt, racers: m.drivers.map(toRow), kind:'grid' });
        });
        if (fd.toFeatureSpots > 0 && fd.transferred.length >= fd.toFeatureSpots) slides.push({ title: cls.name, sub: '🏁 Feature lineup', racers: featureGridOrder(fd, cls.id).map(toRow), kind:'grid' });
      } else {
        slides.push({ title: cls.name, sub: '🏁 Feature lineup', racers: featureGridOrder(fd, cls.id).map(toRow), kind:'grid' });
      }
    }
  });
  return slides;
}
/* New: once a feature is fully scored, a results slide — the payoff of the night. */
function tvResultSlides() {
  const out = [];
  S.classes.forEach(cls => {
    const finish = featureFinish(cls.id);
    if (!finish.length) return;
    const dp = isPointsRace(cls.id) ? dayPoints(cls.id) : null;
    out.push({ title: cls.name, sub: '🏁 Feature results', kind:'results',
      rows: finish.slice(0, 10).map(f => ({ pos:f.fin, name:f.name, num:f.num, pts: dp ? dp[f.id] : null })) });
  });
  return out;
}
/* New: season points, once there is a series to show. */
function tvPointsSlides() {
  const out = [];
  seriesClassNames().forEach(name => {
    const rows = seriesStandings(name);
    if (!rows.length) return;
    out.push({ title: name, sub: 'Season points — top 10', kind:'points',
      rows: rows.slice(0, 10).map((r, i) => ({ pos:i + 1, name:r.name, num:r.num, pts:r.pts })) });
  });
  return out;
}
function tvSlides() { return [...tvGridSlides(), ...tvResultSlides(), ...tvPointsSlides()]; }

/* Lineup/grid rendering — verbatim v1. */
function tvPanelMarkup(racers, single, offset, fs, disc) {
  let h = single ? '' : '<div class="tv-lanes"><span>Inside</span><span>Outside</span></div>';
  h += '<div class="' + (single ? 'tv-list' : 'tv-grid2') + '">';
  racers.forEach((r, i) => {
    const pos = offset + i + 1;
    const rowNum = Math.floor((offset + i) / (single ? 1 : 2)) + 1;
    const len = String(r.num).length;
    const df = len <= 2 ? 0.42 : len === 3 ? 0.33 : len === 4 ? 0.26 : 0.21;
    const rowLbl = !single ? '<span class="tv-row">R' + rowNum + '</span>' : '';
    h += '<div class="tv-slot' + (pos === 1 ? ' pole' : '') + '" style="font-size:' + fs.toFixed(2) + 'vh">'
      + '<span class="tv-pos">P' + pos + '</span>'
      + rowLbl
      + '<span class="tv-disc" style="width:' + disc.toFixed(2) + 'vh;height:' + disc.toFixed(2) + 'vh;font-size:' + (disc * df).toFixed(2) + 'vh">' + esc(String(r.num)) + '</span>'
      + '<span class="tv-nm">' + esc(r.name) + '</span>' + (r.tag ? '<span class="tv-num">' + esc(r.tag) + '</span>' : '') + '</div>';
  });
  return h + '</div>';
}
function tvGridMarkup(racers, single) {
  const SPLIT = 16;
  if (racers.length > SPLIT) {
    const a = racers.slice(0, SPLIT), b = racers.slice(SPLIT);
    const splitRows = single ? SPLIT : Math.ceil(SPLIT / 2);
    const fs = Math.min(5.2, 70 / splitRows * 0.42);
    const disc = Math.min(8.5, 70 / splitRows * 0.6);
    return '<div class="tv-split">'
      + '<div>' + tvPanelMarkup(a, single, 0, fs, disc) + '</div>'
      + '<div class="tv-split-rule"></div>'
      + '<div>' + tvPanelMarkup(b, single, SPLIT, fs, disc) + '</div></div>';
  }
  const rows = single ? Math.max(racers.length, 1) : Math.max(Math.ceil(racers.length / 2), 1);
  const fs = Math.min(5.2, 70 / rows * 0.42);
  const disc = Math.min(8.5, 70 / rows * 0.6);
  return tvPanelMarkup(racers, single, 0, fs, disc);
}
/* New: results/points table slides — same font-scaling approach as the grid. */
function tvTableMarkup(rows, ptsCol) {
  const n = Math.max(rows.length, 1);
  const fs = Math.min(4.6, 62 / n * 0.9);
  return '<div class="tv-table" style="font-size:' + fs.toFixed(2) + 'vh">' + rows.map(r =>
    '<div class="tv-trow' + (r.pos === 1 ? ' pole' : '') + '">'
    + '<span class="tv-pos">P' + r.pos + '</span>'
    + '<span class="tv-disc" style="width:' + (fs * 1.3).toFixed(2) + 'vh;height:' + (fs * 1.3).toFixed(2) + 'vh">' + esc(String(r.num)) + '</span>'
    + '<span class="tv-nm">' + esc(r.name) + '</span>'
    + (ptsCol && r.pts != null ? '<span class="tv-num">' + r.pts + ' pts</span>' : '') + '</div>'
  ).join('') + '</div>';
}

function tvRender() {
  if (!TV.on) return;
  document.getElementById('tvTrack').textContent = S.track.name || 'RaceDay';
  const logo = document.getElementById('tvLogo');
  if (S.track.logo) { logo.src = S.track.logo; logo.style.display = ''; } else { logo.style.display = 'none'; }
  document.getElementById('tvClock').textContent = new Date().toLocaleTimeString([], { hour:'numeric', minute:'2-digit' });
  document.getElementById('tvLockTag').style.display = TV.locked ? '' : 'none';
  const sl = document.getElementById('tvSlide');
  const slides = tvSlides();
  if (!slides.length) {
    sl.innerHTML = '<div class="tv-empty">🏁 Lineups appear here as drivers sign up</div>';
    document.getElementById('tvPage').textContent = '';
    return;
  }
  TV.idx = ((TV.idx % slides.length) + slides.length) % slides.length;
  const s = slides[TV.idx];
  const body = s.kind === 'grid'
    ? tvGridMarkup(s.racers, S.settings.gridStyle === 'single')
    : tvTableMarkup(s.rows, s.kind === 'points' || s.rows.some(r => r.pts != null));
  sl.innerHTML = '<div class="tv-h"><span>' + esc(s.title) + '</span><span class="tv-sub">' + esc(s.sub) + '</span></div>' + body;
  document.getElementById('tvPage').textContent = (TV.idx + 1) + ' / ' + slides.length;
}
function tvTick() { if (!TV.locked) TV.idx++; tvRender(); }
function openTV() {
  TV.on = true; TV.idx = 0; TV.locked = false;
  document.getElementById('tvOverlay').innerHTML = tvShellMarkup();
  document.getElementById('tvOverlay').style.display = '';
  if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
  tvRender();
  clearInterval(TV.timer);
  TV.timer = setInterval(tvTick, TV_SECS * 1000);
}
function closeTV(ev) {
  if (ev) ev.stopPropagation();
  TV.on = false;
  clearInterval(TV.timer);
  document.getElementById('tvOverlay').style.display = 'none';
  document.getElementById('tvOverlay').innerHTML = '';
  if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
}
function tvShowCtl() {
  const c = document.getElementById('tvCtl');
  if (!c) return;
  c.classList.add('show');
  clearTimeout(TV.ctlTimer);
  TV.ctlTimer = setTimeout(() => c.classList.remove('show'), 4000);
}
function tvPrev(ev) { ev.stopPropagation(); TV.idx--; tvRender(); tvShowCtl(); }
function tvNext(ev) { ev.stopPropagation(); TV.idx++; tvRender(); tvShowCtl(); }
function tvToggleLock(ev) {
  ev.stopPropagation();
  TV.locked = !TV.locked;
  const b = document.getElementById('tvLockBtn'); if (b) b.textContent = TV.locked ? '🔓 Unlock rotation' : '🔒 Lock screen';
  tvRender(); tvShowCtl();
}
function tvShellMarkup() {
  return '<div class="tv-hd"><img id="tvLogo" alt="" style="display:none">'
    + '<span id="tvTrack" class="tv-brand"></span>'
    + '<span class="tv-lock-tag" id="tvLockTag" style="display:none">🔒 LOCKED</span>'
    + '<span class="tv-clock" id="tvClock"></span></div>'
    + '<div class="tv-body" id="tvSlide" onclick="tvShowCtl()"></div>'
    + '<div class="tv-ctl" id="tvCtl" onclick="tvShowCtl()">'
    + '<button onclick="tvPrev(event)">◀</button>'
    + '<span id="tvPage" class="tv-page"></span>'
    + '<button onclick="tvNext(event)">▶</button>'
    + '<button id="tvLockBtn" onclick="tvToggleLock(event)">🔒 Lock screen</button>'
    + '<button onclick="closeTV(event)">✕ Exit</button></div>';
}
document.addEventListener('keydown', e => { if (TV.on && e.key === 'Escape') closeTV(); });

/* ============================================================================
   §11  PRINT SYSTEM
   v1 had one output (a heat-assignment sheet) hardcoded to the Lineups tab's
   print button. v2 opens a sheet of outputs — lineup sheets (the same content,
   kept close to verbatim), a results sheet, and season points standings —
   each self-contained (own <style>, opened in a new window), so printing never
   depends on the app's own stylesheet or theme. Always ink-on-white; the track
   logo heads every sheet.

function printShellOpen(title, bodyHtml) {

    + 'h3{font-size:13px;margin:12px 0 4px}p{color:#555;font-size:11px;margin-bottom:8px}'
    + 'table{width:100%;border-collapse:collapse;margin-bottom:12px}'
    + 'th,td{border:1px solid #bbb;padding:6px 8px;text-align:left}th{background:#eee;font-weight:700}'
    + '.inv td{background:#fffbe8}.inv th{background:#f3e6bd}'
    + '.phead{display:flex;align-items:center;gap:14px;margin-bottom:4px}'
    + '.phead img{height:54px;max-width:140px;object-fit:contain;border:1px solid #ccc;border-radius:6px;padding:4px;background:#fff}'
    + '.foot{margin-top:24px;font-size:10px;color:#888;border-top:1px solid #ccc;padding-top:8px}'
    + '@media print{body{padding:0}}'
    + '</style></head><body>'
    + '<div class="phead">' + (S.track.logo ? '<img src="' + S.track.logo + '" alt="">' : '')
    + '<h1>' + (S.track.name ? esc(S.track.name) + ' — ' : '') + esc(title) + '</h1></div>'
    + '<p>' + esc(S.raceDay.date) + ' · Generated ' + new Date().toLocaleString() + '</p>'
    + bodyHtml
    + '<p class="foot">Unofficial — administrative aid only. Verify before posting. Official results are determined by the race director, track management, or sanctioning body.</p>'
    + '</body></html>';
  const w = window.open('', '_blank');
  if (w) { w.document.write(html); w.document.close(); setTimeout(() => w.print(), 400); }
  else toast('Allow pop-ups to print.', 'err');
}

function printLineupSheet() {
  let h = '';
  S.classes.forEach(cls => {
    const racers = classRacers(cls.id);
    if (!racers.length) return;
    const set1 = heatSet(racers, cls), set2 = set1.map(heat => [...heat].reverse());
    const heats = classHeats(cls);
    h += '<h2>' + esc(cls.name) + ' — ' + racers.length + ' drivers</h2>';
    const sets = heats === 0 ? [['Qualifying order — straight to mains', [racers], '']]
      : heats === 1 ? [['Qualifying heat', set1, '']]
      : [['Set 1 — pill order', set1, ''], ['Set 2 — inverted', set2, ' class="inv"']];
    sets.forEach(([title, set, cl]) => {
      h += '<h3>' + title + '</h3>';
      set.forEach((heat, hi) => {

/* ============================================================================
   §12  SPECTATOR / FAN VIEW
   v1's `role=viewer` was a stripped Lineups tab: a class picker, five stage
   tabs (Qualifying/Heats/B-Mains/Feature/Results), read-only. This is the
   free wedge against MyRacePass — fans pay $8-55/yr there for exactly this.
   v2 keeps the same security boundary (ROLE_PAGES.viewer is unchanged: grid +
   help only, still enforced by adminOk()/canWrite()/nav()) and, within that
   one allowed page, makes it worth opening:
     - a "now on track" hero instead of a bare class picker
     - follow a driver — their card and next race pin above the fold
     - a Points stage added to the existing per-class stage tabs
     - a shareable result-card image (canvas → PNG) fans can post themselves
   Nothing here can write to S — every path is read-only, same as v1.
   ========================================================================= */

function followDriver(id) {
  UI.followId = id;
  try { localStorage.setItem('rd_follow', id ? String(id) : ''); } catch (e) {}
  renderGrid();
}
function unfollowDriver() { followDriver(null); }

function fanNowNext() {
  const ph = nightPhase();
  const withEntries = S.classes.filter(c => classRacers(c.id).length);
  const cur = withEntries.find(c => !classComplete(c.id)) || withEntries.find(c => {
    const fd = classComplete(c.id) ? featureData(c.id) : null;
    return fd && !(fd.toFeatureSpots ? fd.transferred.length >= fd.toFeatureSpots : true);
  });
  return { phase: ph, cls: cur || withEntries[0] || null };
}

function fanHero() {
  const t = S.track;
  const { phase, cls } = fanNowNext();
  return '<div class="fan-hero">'
    + '<div class="eyebrow">' + esc(t.name || 'RaceDay') + (t.length || t.surface ? ' · ' + [t.surface, t.length].filter(Boolean).join(' · ') : '') + '</div>'
    + '<h3>' + esc(phase.note) + '</h3>'
    + (cls ? '<p class="sub" style="margin:0">Now up: <b style="color:var(--ink)">' + esc(cls.name) + '</b></p>' : '')
    + '<div class="rowflex" style="margin-top:10px">'
    +   '<button class="btn btn-sm" onclick="showTrackCard()">🏟 About this track</button>'
    + '</div></div>';
}

function fanFollowStrip() {
  if (!UI.followId) {
    return '<button class="follow-strip" style="width:100%;background:none;border:1px dashed var(--line);cursor:pointer;text-align:left" onclick="openFollowPicker()">'
      + '<span style="font-size:20px">⭐</span><span><b>Follow a driver</b><br><span class="tiny">Their card and next race pin to the top</span></span></button>';
  }
  const d = driverById(UI.followId);
  if (!d) { UI.followId = null; return ''; }
  const entries = S.raceDay.entries.filter(e => e.driverId === d.id);
  const next = entries.map(e => classById(e.classId)).filter(Boolean).map(c => c.name);
  return '<div class="follow-strip">' + discNum(d.num)
    + '<div style="flex:1;min-width:0"><b>' + esc(d.name) + '</b>'
    + '<div class="tiny">' + (next.length ? 'Racing: ' + esc(next.join(' · ')) : 'Not entered tonight') + '</div></div>'
    + '<button class="btn btn-sm" onclick="openDriverCard(' + d.id + ')">Card</button>'
    + '<button class="btn btn-sm btn-ghost" onclick="unfollowDriver()">✕</button></div>';
}
function openFollowPicker() {
  const list = [...S.roster].sort((a, b) => a.name.localeCompare(b.name));
  openSheet('Follow a driver',
    '<input type="text" placeholder="Search name or car #" oninput="fanFilterFollow(this.value)" style="margin-bottom:10px">'
    + '<div id="followList" class="stack">' + list.map(fanFollowRow).join('') + '</div>');
}
function fanFollowRow(d) {
  return '<button class="tapcard" style="width:100%" onclick="followDriver(' + d.id + ');closeSheet()">'
    + discNum(d.num) + '<span class="nm">' + esc(d.name) + '</span></button>';
}
function fanFilterFollow(q) {
  q = q.trim().toLowerCase();
  const list = [...S.roster].filter(d => !q || d.name.toLowerCase().includes(q) || String(d.num).toLowerCase().includes(q))
    .sort((a, b) => a.name.localeCompare(b.name));
  document.getElementById('followList').innerHTML = list.map(fanFollowRow).join('');

function renderFanView() {
  const el = document.getElementById('gridWrap');
  if (!S.classes.length) { el.innerHTML = fanHero() + emptyState('🏁', 'Lineups will appear here once the race day starts.'); return; }
  if (!UI.viewClsId || !classById(UI.viewClsId)) UI.viewClsId = S.classes[0].id;
  const cls = classById(UI.viewClsId);
  const racers = classRacers(cls.id);
  const single = S.settings.gridStyle === 'single';
  const heats = classHeats(cls);
  const toRow = heats === 0
    ? s => ({ id:s.id, name:s.name, num:s.num, tag: s.qualTime ? '⏱ ' + s.qualTime : 'Seed P' + s.pill })
    : s => ({ id:s.id, name:s.name, num:s.num, tag: 'Heat total ' + s.pts });

  if (heats === 0 && UI.viewStage === 'heats') UI.viewStage = 'qual';
  const stages = [['qual', 'Qualifying']]
    .concat(heats === 0 ? [] : [['heats', 'Heats']])
    .concat([['bmain', 'B-Mains'], ['feat', 'Feature'], ['results', 'Results'], ['points', 'Points']]);

  let h = fanHero() + fanFollowStrip()
    + '<div class="spread" style="margin:18px 0 4px">'
    +   '<select onchange="setViewClass(this.value)" style="flex:1;min-width:160px">'
    +     S.classes.map(c => '<option value="' + c.id + '"' + (c.id === UI.viewClsId ? ' selected' : '') + '>' + esc(c.name) + '</option>').join('')
    +   '</select>'
    +   '<button class="btn btn-sm" onclick="showClassCard(' + UI.viewClsId + ')">ℹ About</button></div>'
    + '<div class="tabs">' + stages.map(([k, lbl]) => '<button class="tab' + (UI.viewStage === k ? ' on' : '') + '" onclick="setViewStage(\'' + k + '\')">' + lbl + '</button>').join('') + '</div>';

  if (!racers.length && UI.viewStage !== 'points') {
    h += emptyState('🏁', 'No drivers in this class yet.');
  } else if (UI.viewStage === 'qual') {
    h += heats === 0
      ? '<div class="slbl">Qualifying order — seeds the mains directly, no heats</div>' + gridMarkup(racers, single)
      : '<div class="slbl">Qualifying order</div>' + gridMarkup(invertField(racers, cls), single);
  } else if (UI.viewStage === 'heats') {
    const set1 = invertWithinHeats(heatArrays(racers, cls), cls);
    h += '<div class="slbl">' + (heats === 1 ? 'Heat lineups' : 'Set 1 heats') + '</div>';
    set1.forEach((heat, hi) => { h += '<p class="heat-cap"><b>Heat ' + (hi + 1) + '</b> · ' + plural(heat.length, 'car') + '</p>' + gridMarkup(heat, single); });
    if (heats === 2) {
      h += '<div class="slbl">Set 2 — inverted</div>';
      set1.map(ht => [...ht].reverse()).forEach((heat, hi) => { h += '<p class="heat-cap"><b>Heat ' + (hi + 1) + '</b></p>' + gridMarkup(heat, single); });
    }
  } else if (UI.viewStage === 'bmain') {
    if (!classComplete(cls.id)) h += emptyState('🏁', 'B-main lineups post once the heats are scored.');
    else {
      const fd = featureData(cls.id);
      h += fd.mains.length
        ? fd.mains.map(mn => '<div class="slbl">' + esc(mn.label) + '</div>' + gridMarkup(mn.drivers.map(toRow), single)).join('')
        : emptyState('🏁', 'This class runs straight to the feature — no B-mains.');
    }
  } else if (UI.viewStage === 'feat') {
    if (!classComplete(cls.id)) h += emptyState('🏁', 'The feature lineup posts once the heats are scored.');
    else {
      const fd = featureData(cls.id);
      const complete = !fd.mains.length || (fd.toFeatureSpots > 0 && fd.transferred.length >= fd.toFeatureSpots);
      h += complete ? '<div class="slbl">🏁 Feature lineup</div>' + gridMarkup(featureGridOrder(fd, cls.id).map(toRow), single)
                    : emptyState('🏁', 'The feature lineup posts once the B-main finishes are entered.');
    }
  } else if (UI.viewStage === 'points') {
    const rows = seriesStandings(cls.name);
    h += !rows.length ? emptyState('🏆', 'No season points yet for this class.')
      : '<div class="card card-flush"><div class="scroll-x"><table class="tbl"><thead><tr><th></th><th>Driver</th><th>#</th><th class="r">Points</th></tr></thead><tbody>'
        + rows.map((r, i) => '<tr><td class="pos' + (i < 3 ? ' p' + (i + 1) : '') + '">' + (i + 1) + '</td><td style="font-weight:600">' + esc(r.name) + '</td><td class="muted">#' + esc(r.num) + '</td><td class="r"><span class="pts">' + r.pts + '</span></td></tr>').join('')
        + '</tbody></table></div></div>';
  } else {   // results
    const ff = featureFinish(cls.id);
    if (!ff.length) h += emptyState('🏆', 'Results will appear here once the feature is scored.');
    else {
      h += '<div class="slbl">🏆 ' + esc(cls.name) + ' results</div><div class="list">'
        + ff.map((r, i) => '<div class="lrow"><div class="pos' + (i < 3 ? ' p' + (i + 1) : '') + '">' + (i + 1) + '</div>'
            + discNum(r.num) + '<div class="nm" style="cursor:pointer" onclick="openDriverCard(' + r.id + ')">' + esc(r.name) + '</div>'
            + '<button class="btn btn-sm btn-ghost" onclick="event.stopPropagation();shareResultCard(' + cls.id + ',' + (i + 1) + ',' + r.id + ')" title="Share">📤</button></div>').join('')
        + '</div>';
    }
  }

  /* Safe exit from the spectator view — a plain link out, not a role switch. Cannot
     change rd_role, so it never re-opens the removed viewer→admin escape hatch. */
  h += '<div style="text-align:center;margin-top:26px;padding-top:16px;border-top:1px solid var(--line)">'
    + '<a href="/?home=1" class="tiny" style="text-decoration:underline">← Leave spectator view</a></div>';
  el.innerHTML = h;
}

/* ---------------------------------------------------------------- share card */
/* A shareable PNG for a result — free marketing in local racing Facebook groups.
   Rendered on an off-screen canvas, no server round-trip. */
function shareResultCard(clsId, pos, driverId) {
  const cls = classById(clsId), d = driverById(driverId);
  if (!cls || !d) return;
  const W = 1080, H = 1080;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  const grad = ctx.createLinearGradient(0, 0, W, H);
  grad.addColorStop(0, '#1b1e24'); grad.addColorStop(1, '#0b0c0f');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(255,212,73,.06)';
  for (let i = -2; i < 30; i++) { ctx.fillRect(i * 76, 0, 38, H); }
  ctx.fillStyle = '#ffd449'; ctx.font = '700 34px Arial'; ctx.fillText((S.track.name || 'RaceDay').toUpperCase(), 70, 110);
  ctx.fillStyle = '#8b909b'; ctx.font = '600 28px Arial'; ctx.fillText(esc(cls.name) + ' · ' + fmtDate(S.raceDay.date), 70, 150);
  ctx.fillStyle = '#ffd449'; ctx.font = '800 220px Arial'; ctx.fillText('P' + pos, 70, 460);
  ctx.fillStyle = '#f2f2ee'; ctx.font = '800 78px Arial'; ctx.fillText(d.name, 70, 600);
  ctx.fillStyle = '#8b909b'; ctx.font = '700 44px Arial'; ctx.fillText('#' + d.num, 70, 665);
  ctx.strokeStyle = '#2e333c'; ctx.lineWidth = 2; ctx.strokeRect(60, 720, W - 120, 240);
  ctx.fillStyle = '#f2f2ee'; ctx.font = '700 30px Arial'; ctx.fillText('🏁 raceday', 90, 800);
  ctx.font = '400 26px Arial'; ctx.fillStyle = '#8b909b';
  wrapText(ctx, 'Live lineups, results and points — free for fans.', 90, 850, W - 180, 34);
  const url = c.toDataURL('image/png');
  openSheet('Share this result',
    '<img src="' + url + '" style="width:100%;border-radius:12px;margin-bottom:14px" alt="">',
    '<a class="btn btn-primary btn-block" href="' + url + '" download="raceday-' + esc(cls.name).replace(/\W+/g, '-') + '-p' + pos + '.png">⬇ Save image</a>');
}
function wrapText(ctx, text, x, y, maxW, lh) {
  const words = text.split(' ');
  let line = '';
  words.forEach(w => {
    const test = line + w + ' ';
    if (ctx.measureText(test).width > maxW && line) { ctx.fillText(line, x, y); line = w + ' '; y += lh; }
    else line = test;
  });
  ctx.fillText(line, x, y);
}

/* ============================================================================
   §13  DRIVER CARD — edit + Driven link pipeline
   Logic ported close to verbatim from v1 (linkProfile/refreshProfile/unlinkProfile/
   photo downscale-to-128px-so-sync-stays-small); only the surrounding markup moved
   from a fixed modal to the sheet the read-only card already uses (§4, 41-lineups.js).

function linkProfilePrompt() {
  const d = driverById(driverCardId); if (!d || deviceRole() !== 'admin') return;
  const code = prompt("Driver's Driven link code (from their Driven app):");
  if (!code || !code.trim()) return;
  linkProfile(d.id, code.trim())
    .then(renderDriverCard)
    .catch(err => {
      renderDriverCard();
      toast(err && err.pending ? 'Linked — the card loads when this device is online.'
        : "That code didn't match a published card — check it and try again.", err && err.pending ? 'ok' : 'err');
    });
}
function refreshProfile() {
  const d = driverById(driverCardId); if (!d || !(d.profileId || d.profileCode)) return;
  if (d.profile && d.profile.demoOnly) { toast('This is demo data — nothing to refresh.'); return; }
  linkProfile(d.id, d.profileId || d.profileCode)
    .then(renderDriverCard)
    .catch(() => { renderDriverCard(); toast("Couldn't refresh — check the connection.", 'err'); });
}
function unlinkProfile() {
  const d = driverById(driverCardId); if (!d) return;
  if (!confirm("Unlink this driver's Driven card? The profile returns to local control.")) return;
  delete d.profileId; delete d.profileCode;
  if (d.profile) { delete d.profile.pendingFetch; delete d.profile.source; }
  save();
  renderDriverCard();
}

function editDriverCard() {
  const d = driverById(driverCardId); if (!d) return;
  const p = d.profile || {};
  const linked = d.profileId || (d.profile && d.profile.source === 'profiles');
  if (linked) { toast('This card is linked to Driven and managed there — unlink to edit it locally.'); return; }
  const body = '<div class="field"><label>Age</label><input id="dcAge" type="text" value="' + esc(p.age || '') + '"></div>'
    + '<div class="field"><label>Hometown</label><input id="dcHome" type="text" value="' + esc(p.hometown || '') + '"></div>'
    + '<div class="field"><label>Sponsors</label><input id="dcSpon" type="text" placeholder="e.g. Smith Tire, NAPA" value="' + esc(p.sponsors || '') + '"></div>'
    + '<label class="check" style="margin-bottom:16px"><input id="dcPrem" type="checkbox"' + (p.premium ? ' checked' : '') + '><b>Premium broadcast card</b></label>'
    + '<div class="field"><label>Team color</label><input id="dcColor" type="color" value="' + esc(/^#[0-9a-fA-F]{6}$/.test(p.teamColor || '') ? p.teamColor : '#ffd449') + '" style="height:44px;padding:3px"></div>'
    + '<div class="field"><label>Driver photo</label><div class="rowflex">'
    + (profPhotoOK(p.photo) ? '<img src="' + p.photo + '" style="width:48px;height:48px;border-radius:50%;object-fit:cover">' : '')
    + '<button class="btn btn-sm" type="button" onclick="document.getElementById(\'dcPhotoFile\').click()">📷 ' + (p.photo ? 'Replace' : 'Upload') + '</button>'
    + (p.photo ? '<button class="btn btn-sm btn-danger" type="button" onclick="dcRemovePhoto()">Remove</button>' : '')
    + '<input id="dcPhotoFile" type="file" accept="image/*" style="display:none" onchange="dcUploadPhoto(this)"></div></div>';
  openSheet('Edit ' + d.name, body,
    '<button class="btn" onclick="renderDriverCard()">Cancel</button><button class="btn btn-primary" onclick="saveDriverProfile()">Save</button>');
}
function saveDriverProfile() {
  const d = driverById(driverCardId); if (!d) return;
  if (d.profileId || (d.profile && d.profile.source === 'profiles')) { renderDriverCard(); return; }
  const prev = d.profile || {};
  d.profile = {
    age: document.getElementById('dcAge').value.trim(),
    hometown: document.getElementById('dcHome').value.trim(),
    sponsors: document.getElementById('dcSpon').value.trim(),
    premium: document.getElementById('dcPrem').checked,
    teamColor: document.getElementById('dcColor').value,
    photo: prev.photo || ''
  };
  save();
  renderDriverCard();
}
/* Center-crop square, downscale to 128px — same cap as the track logo, so a roster
   full of photos stays small enough to sync. */
function dcUploadPhoto(input) {
  const d = driverById(driverCardId);
  const f = input.files && input.files[0];
  input.value = '';
  if (!f || !d) return;
  const img = new Image();
  const url = URL.createObjectURL(f);
  img.onload = () => {
    URL.revokeObjectURL(url);
    const side = Math.min(img.width, img.height);
    const scale = Math.min(1, 128 / side);
    const c = document.createElement('canvas');
    c.width = c.height = Math.max(1, Math.round(side * scale));
    c.getContext('2d').drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, c.width, c.height);
    const data = c.toDataURL('image/jpeg', 0.82);
    if (data.length > 60000) { toast('That photo is too heavy to store — try a smaller or simpler image.', 'err'); return; }
    d.profile = d.profile || {};
    d.profile.photo = data;
    save();
    editDriverCard();
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast("Couldn't read that file as an image.", 'err'); };
  img.src = url;
}
function dcRemovePhoto() {
  const d = driverById(driverCardId); if (!d || !d.profile) return;
  d.profile.photo = '';
  save();
  editDriverCard();
}

const IMP_SYN = {

   table. The matching/preview/apply engine above (impComputePreview, impApply,
   impMatchDriver, impClsResolve, vendor/column detection) is copied verbatim —
   it is the part that is actually hard to get right (transponder/number/name
   matching, new-class and new-driver review gates, the license/trial guard on
   paths that create entries) and a v2 rewrite would just reintroduce its bugs.
   What's new is the surrounding flow: one CSV pick → a stepper (Qualifying /
   Heat 1 / Heat 2 / Feature) → a scannable match-status list → Apply, in a
   sheet instead of a fixed overlay. Folder-watch auto-apply (desktop-only,
   the smallest slice of use) is dropped to keep the surface reviewable.
   ========================================================================= */

function openImport(target) {
  Imp = { rows:[], header:[], cols:{trans:-1,num:-1,name:-1,name2:-1,cls:-1,pos:-1,time:-1},
          target: target || 'heat', clsId: (S.classes[0] && S.classes[0].id) || null,
          useClsCol:false, heatSet:'h1', step:0, vendor:null, preamble:0, unknownClasses:[], emptyClass:0,
          newCls: !S.classes.length, newClsName:'', makeClasses:false, userPickedMode:false, lastFile:'',
          div:null, pendingCls:{}, _tmpCls:{}, watchDir:null };
  impPreview = [];
  const steps = impPipeline();
  const want = target || 'heat';
  let startIdx = steps.findIndex(s => s.target === want);
  if (startIdx < 0) startIdx = 0;
  impSetStep(startIdx);
  openSheet('Import from timing', impBodyMarkup(),
    '<button class="btn" onclick="closeImport()">Cancel</button><button class="btn btn-primary push" onclick="impApplyClick()">Import ✓</button>',
    { wide:true, onClose: () => { Imp = null; impPreview = []; } });
  impRenderStepper();
}
function closeImport() { closeSheet(); }

function impBodyMarkup() {
  return '<div id="impStepper" class="tabs"></div>'
    + '<div class="card">'
    + '<div class="rowflex"><button class="btn btn-primary" onclick="document.getElementById(\'impFile\').click()">📄 Choose CSV file</button>'
    + '<input id="impFile" type="file" accept=".csv,text/csv" style="display:none" onchange="impLoadCsv(this)">'
    + '<span class="tiny" id="impCsvInfo" style="display:none"></span></div>'
    + '<div id="impClsMode" style="display:none;margin-top:14px">'
    +   '<div class="seg"><button class="on" id="impCmOne" onclick="impSetClsMode(false,true)">One class for this file</button>'
    +   '<button id="impCmCol" onclick="impSetClsMode(true,true)">Use the file\'s Class column</button></div>'
    +   '<div id="impClsPick" style="margin-top:10px"><label>Class</label>'
    +     '<select id="impClsSel" onchange="impClsSelChange(this.value)"></select>'
    +     '<div id="impNewClsRow" style="display:none;margin-top:8px"><label>New class name</label>'
    +       '<input id="impNewClsName" type="text" oninput="if(Imp){Imp.newClsName=this.value;impRenderPreview()}"></div></div>'

    +   '<div id="impPrevList" class="list"></div>'
    + '</div>';
}

function impLoadCsv(input) {
  const f = input.files && input.files[0];
  input.value = '';
  if (!f || !Imp) return;
  const fr = new FileReader();
  fr.onload = () => impIngestText(String(fr.result || ''), f.name);
  fr.readAsText(f);
}
/* Rewritten for v2's markup (v1's version hard-coded fixed-overlay DOM ids);
   the parsing/detection calls it makes are the same engine functions. */
function impIngestText(text, filename) {
  if (!Imp) return false;
  const rows = impParseCSV(String(text || ''));
  if (rows.length < 2) { toast("That file doesn't look like a results CSV (no data rows).", 'err'); return false; }
  const hi = impPickHeader(rows);
  Imp.preamble = hi;
  Imp.header = rows[hi];
  Imp.rows = rows.slice(hi + 1);
  Imp.cols = impGuessColumns(Imp.header);
  Imp.vendor = impDetectVendor(Imp.header);
  Imp.lastFile = filename || '';
  Imp.div = impHeatFromFilename(filename);

  if (Imp.cols.cls >= 0 && !Imp.userPickedMode) {
    Imp.useClsCol = true;
    Imp.makeClasses = true;
  }
  if (!Imp.useClsCol) {
    const guess = impClassFromFilename(Imp.lastFile);
    if (guess) {
      const match = (S.classes || []).find(c => c.name.toLowerCase() === guess.toLowerCase());
      if (match) { Imp.newCls = false; Imp.clsId = match.id; }
      else if (Imp.target !== 'heat') { Imp.newCls = true; Imp.newClsName = guess; }
    }
  }

  const info = document.getElementById('impCsvInfo');
  info.style.display = '';
  info.innerHTML = plural(Imp.rows.length, 'row') + (filename ? ' from <b>' + esc(filename) + '</b>' : ' loaded')
    + (Imp.vendor ? ' · <span style="color:var(--flag-green)">' + esc(Imp.vendor.name) + ' format detected</span>' : '')
    + (hi > 0 ? ' · skipped ' + hi + ' title line' + (hi > 1 ? 's' : '') + ' above the header' : '') + '.';
  document.getElementById('impClsMode').style.display = '';
  impSetClsMode(Imp.useClsCol, false);
  document.getElementById('impPrevWrap').style.display = '';
  impRenderPreview();
  return true;
}
function impSetClsMode(useCol, userPicked) {
  if (!Imp) return;
  if (userPicked) Imp.userPickedMode = true;
  Imp.useClsCol = useCol;
  if (useCol) Imp.makeClasses = true;
  document.getElementById('impCmOne').classList.toggle('on', !useCol);
  document.getElementById('impCmCol').classList.toggle('on', useCol);
  document.getElementById('impClsPick').style.display = useCol ? 'none' : '';
  document.getElementById('impMakeClsRow').style.display = useCol ? '' : 'none';
  const mk = document.getElementById('impMakeClasses'); if (mk) mk.checked = !!Imp.makeClasses;
  if (!useCol) {
    impFillClsSel();
    document.getElementById('impNewClsRow').style.display = Imp.newCls ? '' : 'none';
  }
  if (Imp.rows.length) impRenderPreview();
}
function impFillClsSel() {
  const sel = document.getElementById('impClsSel');
  if (!sel) return;
  if (!S.classes.length) Imp.newCls = true;
  sel.innerHTML = S.classes.map(c => '<option value="' + c.id + '">' + esc(c.name) + '</option>').join('')
    + '<option value="__new__">➕ New class…</option>';
  sel.value = (Imp.newCls || !S.classes.length) ? '__new__' : String(Imp.clsId || (S.classes[0] && S.classes[0].id) || '');
}
function impClsSelChange(val) {
  if (!Imp) return;
  if (val === '__new__') {
    Imp.newCls = true;
    if (!((Imp.newClsName || '').trim())) Imp.newClsName = impClassFromFilename(Imp.lastFile || '');
  } else { Imp.newCls = false; Imp.clsId = parseInt(val) || null; }
  const nameEl = document.getElementById('impNewClsName');
  if (nameEl) nameEl.value = Imp.newClsName || '';
  document.getElementById('impNewClsRow').style.display = Imp.newCls ? '' : 'none';
  impRenderPreview();
}

/* Stepper — same pipeline (Qualifying → Heat 1 → [Heat 2] → Feature) as v1. */
function impSetStep(i) {
  if (!Imp) return;
  const steps = impPipeline();
  Imp.step = Math.max(0, Math.min(i, steps.length - 1));
  const s = steps[Imp.step];
  Imp.target = s.target;
  if (s.heatSet) Imp.heatSet = s.heatSet;
  impRenderStepper();
  if (Imp.rows.length) impRenderPreview();
}
function impRenderStepper() {
  if (!Imp) return;
  const steps = impPipeline();
  if (Imp.step >= steps.length) Imp.step = steps.length - 1;
  const el = document.getElementById('impStepper');
  if (el) el.innerHTML = steps.map((s, i) =>
    '<button class="tab' + (i === Imp.step ? ' on' : '') + '" onclick="impSetStep(' + i + ')">'
    + (i < Imp.step ? '✓ ' : '') + esc(s.label) + '</button>').join('');
}

const STATUS_BADGE = { match:['badge-green','✓ Matched'], new:['badge-plate','+ New'], conflict:['badge-amber','⚠ Conflict'], skip:['badge-dim','— Skip'] };
function impRenderPreview() {
  const wrap = document.getElementById('impPrevList'), count = document.getElementById('impPrevCount');
  if (!wrap) return;
  if (!Imp || !Imp.rows.length) { wrap.innerHTML = ''; if (count) count.textContent = ''; return; }
  impComputePreview();
  const acted = impPreview.filter(r => r.status !== 'skip').length;
  if (count) count.textContent = acted + ' of ' + impPreview.length + ' rows will import';
  wrap.innerHTML = impPreview.slice(0, 300).map(r => {
    const badge = STATUS_BADGE[r.status] || STATUS_BADGE.skip;
    const cls = classById(r.clsId) || { name: Imp.pendingCls[r.clsId] ? Imp.pendingCls[r.clsId] + ' (new)' : '?' };
    const label = r.driver ? r.driver.name : (r.name || (r.num ? 'Car #' + r.num : 'Trans ' + r.trans));
    return '<div class="lrow"><span class="badge ' + badge[0] + '" style="flex:none">' + badge[1] + '</span>'
      + '<div class="nm">' + esc(label) + (r.num ? '<small>#' + esc(r.num) + ' · ' + esc(cls.name) + (r.note ? ' · ' + esc(r.note) : '') + '</small>' : (r.note ? '<small>' + esc(r.note) + '</small>' : '')) + '</div>'
      + (typeof r.finish === 'number' ? '<span class="pts">P' + r.finish + '</span>' : (typeof r.rank === 'number' ? '<span class="pts">P' + r.rank + '</span>' : '')) + '</div>';
  }).join('') + (impPreview.length > 300 ? '<div class="lrow"><span class="tiny">…and ' + (impPreview.length - 300) + ' more rows</span></div>' : '');
}

function applyPointsPreset(key) {
  const q = POINT_PRESETS[key];
  if (!q) return;   // 'custom' (empty value): leave current settings as-is
  S.settings.points = { mode: q.mode, table: q.table.slice(), beyond: q.beyond };
  save(); renderPointsInputs();
}
function savePoints() {
  // Hand-editing the table always means a fixed custom table from now on.
  const t = document.getElementById('ptsTable').value.split(/[\s,]+/).map(x => parseInt(x)).filter(n => !isNaN(n) && n >= 0);
  if (t.length) { S.settings.points.table = t; S.settings.points.mode = 'fixed'; }
  S.settings.points.beyond = Math.max(0, parseInt(document.getElementById('ptsBeyond').value) || 0);
  save(); renderPointsInputs();
}
function addImpRowDriver(id) {
  const d = driverById(id); if (!d) return;
  if (_impRows.some(r => r.driverId === id)) return;
  _impRows.push({ driverId: id, name: d.name, num: d.num, pts: 0 });
  document.getElementById('impDriverSearch').value = '';
  document.getElementById('impSearchResults').innerHTML = '';
  renderImpRows();
}
function addImpRow() {
  const q = (document.getElementById('impDriverSearch').value || '').trim();
  if (!q) { alert('Type a driver name or car # to search, then click their name. Or type a new name to add them.'); return; }
  // Try to find in roster first
  const match = S.roster.find(d => d.name.toLowerCase() === q.toLowerCase());
  if (match) { addImpRowDriver(match.id); return; }
  // Create a new roster entry
  const num = prompt('Car number for ' + q + '?', ''); if (num == null) return;
  if (!/^[A-Za-z0-9]{1,5}$/.test(num.trim())) { alert('Car number must be 1–5 letters or digits.'); return; }
  const d = { id: genDriverId(), name: q.trim(), num: num.trim(), noPoints: false };
  S.roster.push(d); save();
  _impRows.push({ driverId: d.id, name: d.name, num: d.num, pts: 0 });
  document.getElementById('impDriverSearch').value = '';
  document.getElementById('impSearchResults').innerHTML = '';
  renderImpRows();
}
function addImpWholeClass() {
  const clsEl = document.getElementById('impClass');
  const cls = clsEl ? classById(parseInt(clsEl.value, 10)) : null;

function uploadLogo(input) {
  const f = input.files && input.files[0];
  input.value = '';
  if (!f) return;
  const img = new Image();
  const url = URL.createObjectURL(f);
  img.onload = () => {
    URL.revokeObjectURL(url);
    const scale = Math.min(1, 256 / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(img.width * scale));
    c.height = Math.max(1, Math.round(img.height * scale));
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const data = c.toDataURL('image/png');
    if (data.length > 400000) { alert('That image is too heavy to store in the browser — try a simpler or smaller logo.'); return; }
    S.track.logo = data;
    save();
    renderHeader();
    renderAdmin();
  };
  img.onerror = () => { URL.revokeObjectURL(url); alert("Couldn't read that file as an image."); };
  img.src = url;
}

function wizSaveClasses() {
  const warnings = [];
  for (let i = 0; i < S.classes.length; i++) {
    const c = S.classes[i];
    const el = document.getElementById('wizCls' + i);
    if (!el) continue;
    const v = el.value.trim();
    if (!v) { alert('Class ' + (i + 1) + ' name is blank. Every class needs a name.'); return false; }
    if (v.toLowerCase() !== c.name.toLowerCase()) {
      const count = S.history.filter(h => h.classes.some(hc => hc.name.toLowerCase() === c.name.toLowerCase())).length;
      if (count > 0) warnings.push('"' + c.name + '" → "' + v + '" (' + count + ' archived race' + (count === 1 ? '' : 's') + ')');
    }
  }
  if (warnings.length && !confirm('Renaming these classes will split their points series — past results won\'t merge with the new name.\n\n' + warnings.join('\n') + '\n\nRename anyway?')) return false;
  S.classes.forEach((c, i) => {
    const el = document.getElementById('wizCls' + i);
    if (el) { const v = el.value.trim(); if (v) c.name = v; }
  });
  return true;
}

function renderCloudBackupCard() {
  const chk = document.getElementById('cloudBackupChk');
  if (chk) chk.checked = cloudBackupOn();
  const el = document.getElementById('cloudBackupStatus');
  if (!el) return;
  if (!cloudBackupOn()) { el.textContent = 'Off — this track\'s data stays on its own devices.'; return; }
  if (!S.lastCloudBackupAt) { el.textContent = 'On — no backup has reached the server yet.'; return; }
  const mins = Math.floor((Date.now() - S.lastCloudBackupAt) / 60000);
  el.textContent = 'On — last backed up ' + (mins < 1 ? 'just now'
    : mins < 60 ? mins + ' min ago'
    : mins < 1440 ? Math.floor(mins / 60) + ' hr ago'
    : Math.floor(mins / 1440) + ' days ago') + '.';
}

      + '<div class="rowflex" style="flex-wrap:nowrap">'
      + '<button class="btn btn-sm" onclick="toggleHist(' + i + ')">' + (UI.histOpen === i ? 'Hide' : 'View') + '</button>'
      + '<button class="btn btn-sm" onclick="histCSV(' + i + ')">CSV</button>'
      + (hd.imported && hd.classes.length === 1 ? '<button class="btn btn-sm" onclick="editImportedRace(' + i + ')">Edit</button>' : '')
      + '<button class="btn btn-sm btn-danger" onclick="delHist(' + i + ')">Delete</button></div></div>';

        h += '<div class="slbl" style="margin:10px 0 6px">' + esc(c.name) + (isImported ? ' <span class="tiny">(imported)</span>' : '') + '</div>';
        h += '<div class="scroll-x"><table class="tbl">' + (isImported
          ? '<thead><tr><th>Driver</th><th>#</th><th class="r">Points</th></tr></thead><tbody>'
            + (c.points || []).map(p => '<tr><td style="font-weight:600">' + esc(p.name) + '</td><td>#' + esc(p.num) + '</td><td class="r">' + p.pts + '</td></tr>').join('')
          : '<thead><tr><th>Pos</th><th>Driver</th><th>#</th><th>Pill</th><th>H1</th><th>H2</th><th class="r">Total</th></tr></thead><tbody>'
            + c.standings.map(s => '<tr><td>' + s.pos + '</td><td style="font-weight:600">' + esc(s.name) + '</td><td>#' + esc(s.num) + '</td><td>' + s.pill + '</td>'

          ) + '</tbody></table></div>';

}

function wizShow(n) {
  for (let i = 1; i <= WIZ_STEPS; i++) { const el = document.getElementById('wizS' + i); if (el) el.style.display = i === n ? '' : 'none'; }
  document.getElementById('wizStepNum').textContent = n;
  document.getElementById('wizBackBtn').style.display = n === 1 ? 'none' : '';
  const nextBtn = document.getElementById('wizNextBtn');
  nextBtn.textContent = n === WIZ_STEPS ? 'Done' : 'Next';
  nextBtn.disabled = false;
  if (n === 2) {
    document.getElementById('wizTrackName').value = S.track.name || '';
    document.getElementById('wizTrackLength').value = S.track.length || '';
    document.getElementById('wizTrackSurface').value = S.track.surface || '';
    document.getElementById('wizTrackConfig').value = S.track.configuration || '';
    document.getElementById('wizTrackHistory').value = S.track.history || '';
    nextBtn.disabled = !S.track.name;
    const lp = document.getElementById('wizLogoPrev'), lr = document.getElementById('wizLogoRemove');
    if (S.track.logo) { lp.src = S.track.logo; lp.style.display = ''; lr.style.display = ''; }
    else { lp.style.display = 'none'; lr.style.display = 'none'; }
  }
  if (n === 3) renderWizClasses();
  if (n === 4) { document.getElementById('wizPin1').value = ''; document.getElementById('wizPin2').value = ''; }
}
function wizBack() { if (UI.wizStep > 1) { UI.wizStep--; wizShow(UI.wizStep); } }
function wizNext() {
  if (UI.wizStep === 2) {
    const name = (document.getElementById('wizTrackName').value || '').trim();
    if (!name) { alert('Please enter your track name.'); return; }
    S.track.name = name;
    S.track.length = document.getElementById('wizTrackLength').value.trim();
    S.track.surface = document.getElementById('wizTrackSurface').value;
    S.track.configuration = document.getElementById('wizTrackConfig').value;
    S.track.history = document.getElementById('wizTrackHistory').value.trim();
    save(); renderHeader();
  }
  if (UI.wizStep === 3) { if (!wizSaveClasses()) return; save(); renderHeader(); }
  if (UI.wizStep === 4) {
    const p1 = document.getElementById('wizPin1').value.trim();
    const p2 = document.getElementById('wizPin2').value.trim();
    if (p1 || p2) {
      if (p1 !== p2) { alert('PINs do not match.'); return; }
      if (!/^\d{4,8}$/.test(p1)) { alert('PIN must be 4–8 digits.'); return; }
      S.adminPin = pinHash(p1); save();
    }
  }
  if (UI.wizStep === WIZ_STEPS) { closeSheet(); renderAll(); return; }
  UI.wizStep++; wizShow(UI.wizStep);
}
