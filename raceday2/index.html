  renderRosterPick();
}

/* The "raced here before?" list, shown until the name field has something in it. */
function rosterPickMarkup() {
  return '<div id="rosterPick" style="display:none"><div class="slbl">Raced here before? Tap your name — no typing</div>'
    + '<div class="sugg" id="rosterPickList" style="max-height:280px;overflow-y:auto"></div></div>';
}
function renderRosterPick() {
  const wrap = document.getElementById('rosterPick');

function rosterBtn(d) {
  return '<button onclick="pickRoster(' + d.id + ')">' + discNum(d.num)
    + '<span class="nm">' + esc(d.name) + (d.noPoints ? '<small>Does not score points</small>' : '') + '</span></button>';
}

/* Typing again means the previous explicit "this is me" tap no longer holds. */
function suggest() {
  pickedRosterId = null;
  const q = document.getElementById('dName').value.trim().toLowerCase();
  const box = document.getElementById('suggBox');
  renderRosterPick();
  renderChips();
  if (q.length < 1) { box.innerHTML = ''; return; }
  box.innerHTML = S.roster
    .filter(d => d.name.toLowerCase().includes(q) || String(d.num) === q)
    .slice(0, 5).map(rosterBtn).join('');

function signupTyped() { pickedRosterId = null; renderChips(); }

function pickRoster(id) {
  const d = driverById(id);
  if (!d) return;
  document.getElementById('dName').value = d.name;
  document.getElementById('dNum').value = d.num;
  document.getElementById('suggBox').innerHTML = '';
  pickedRosterId = id;                 /* explicit "this is me" — register() may trust it */
  renderRosterPick();
  renderChips(true);                   /* pre-tick the classes they ran last time */
  const btn = document.getElementById('drawBtn');
  if (btn) btn.scrollIntoView({ block:'nearest', behavior:'smooth' });
}

function signupVals() {
  const n = document.getElementById('dName'), v = document.getElementById('dNum');
  return { name: n ? n.value.trim() : '', num: v ? v.value.trim() : '' };
}

/* Chips are live: they re-render as the name/number change, so "already entered"
   shows the moment we can tell who this is — v1 only knew at step 2. */
function renderChips(prefill) {
  const el = document.getElementById('chips');
  if (!el) return;
  const vals = signupVals();
  const match = vals.name ? findRosterMatch(vals.name, vals.num) : undefined;
  const trusted = match && pickedRosterId === match.id;
  const enteredIds = match ? S.raceDay.entries.filter(e => e.driverId === match.id).map(e => e.classId) : [];
  const lastRun = (prefill && match) ? lastClassesFor(match.id) : null;
  const wasOn = {};
  if (!prefill) S.classes.forEach(c => {
    const n = document.getElementById('ch' + c.id);
    if (n) wasOn[c.id] = n.classList.contains('on');
  });

  el.innerHTML = S.classes.map(c => {
    const already = enteredIds.includes(c.id);
    /* A CONFIRMED match already entered here is genuinely blocked. An UNCONFIRMED
       match might be a different person who happens to share a name and number, so
       the chip stays selectable — register()'s confirm() resolves who they are. */
    if (already && trusted)
      return '<span class="chip" style="opacity:.45;cursor:default" title="Already entered today">' + esc(c.name) + ' — entered</span>';
    const on = prefill ? (lastRun && lastRun.includes(c.id)) : wasOn[c.id];
    const title = (already && !trusted)
      ? ' title="A driver with this exact name and number is already entered today — you\'ll be asked to confirm"' : '';
    return '<button type="button" class="chip' + (on ? ' on' : '') + '"' + title + ' id="ch' + c.id
      + '" onclick="this.classList.toggle(\'on\')">' + esc(c.name) + '</button>';
  }).join('');

  const row = document.getElementById('consentRow'), chk = document.getElementById('consentChk');
  if (row && chk) {
    if (S.settings && S.settings.requireConsent) {
      row.style.display = '';
      /* Only clear the tick when starting a fresh driver — not on every keystroke,
         which is what made v1's checkbox untick itself on Back/Next. */
      if (prefill) chk.checked = false;
    } else row.style.display = 'none';
  }
}

/* Classes this driver ran the last time they were on a board here. Archived days
   store raw driver/class pairs (buildSnapshot's `pairs`), so this survives class
   renames and re-creations by matching on name, exactly as the points series does. */
function lastClassesFor(driverId) {
  const todayIds = S.raceDay.entries.filter(e => e.driverId === driverId).map(e => e.classId);
  if (todayIds.length) return todayIds;
  for (const hd of (S.history || [])) {
    const mine = (hd.pairs || []).filter(p => p.driverId === driverId);
    if (!mine.length) continue;
    const ids = [];
    mine.forEach(p => {
      const live = S.classes.find(c => c.id === p.classId)
        || S.classes.find(c => c.name.toLowerCase() === String(p.className || '').toLowerCase());
      if (live && ids.indexOf(live.id) < 0) ids.push(live.id);
    });
    if (ids.length) return ids;
  }
  return [];
}

function signupErr(which, msg) {
  const el = document.getElementById(which);
  if (!el) return;
  el.style.display = ''; el.textContent = msg;
  el.scrollIntoView({ block:'nearest', behavior:'smooth' });
}

function register() {
  const vals = signupVals();
  document.getElementById('e1').style.display = 'none';
  document.getElementById('e2').style.display = 'none';

  if (!vals.name || !vals.num) return signupErr('e1', 'Please enter both a name and a vehicle number.');
  if (!/^[A-Za-z0-9]{1,5}$/.test(vals.num))
    return signupErr('e1', 'Vehicle number can be 1–5 letters or numbers (e.g. 47, 7A, or A12).');

  cur = { name: vals.name, num: vals.num, pickedId: pickedRosterId };

  const sel = S.classes.filter(c => {
    const e = document.getElementById('ch' + c.id);
    return e && e.classList.contains('on');
  });
  if (!sel.length) return signupErr('e2', 'Tap at least one class to race in.');

  if (S.settings && S.settings.requireConsent) {
    const chk = document.getElementById('consentChk');
    if (!chk || !chk.checked) return signupErr('e2', 'Please accept the Terms of Service and Privacy Policy to continue.');
  }
  if (!canEnter()) return signupErr('e2', entryBlockedMsg());

  /* Resolve the roster match, but auto-trust it ONLY if the driver explicitly tapped
     their name moments ago (cur.pickedId). Any other match came from typed-from-scratch
     input — a coincidence risk, since two different real people can share a name and
     car number — so a human confirms before merging into someone else's permanent
     identity and history. Decline == different person == no match. */
  let match = findRosterMatch(cur.name, cur.num);
  if (match && cur.pickedId !== match.id) {
    const merge = confirm(
      'A driver already on file is named ' + match.name + ' with #' + match.num + '.\n\n'
      + 'Is this the SAME person signing up right now?\n\n'
      + 'OK = yes — use their existing driver record and history.\n'
      + 'Cancel = no, this is a different person — create a new, separate driver record.'
    );
    if (!merge) match = undefined;
  }

  /* Once merged, drop any selected class they are ALREADY entered in — reachable
     because an unconfirmed match's chips stay clickable. Without this we would push a
     second entry for the same driver and class: a duplicate pill and a double-counted
     finisher in that class's standings and points. */
  let toEnter = sel;
  if (match) {
    const already = new Set(S.raceDay.entries.filter(e => e.driverId === match.id).map(e => e.classId));
    toEnter = sel.filter(c => !already.has(c.id));
    if (!toEnter.length)
      return signupErr('e2', match.name + ' is already entered in ' + (sel.length === 1 ? 'that class' : 'every class you selected') + '.');
  }

  /* Vehicle number must be unique within each selected class. */
  for (const c of toEnter) {
    const clash = S.raceDay.entries.find(e => {
      if (e.classId !== c.id) return false;
      const d = driverById(e.driverId);
      return d && String(d.num).toLowerCase() === cur.num.toLowerCase() && (!match || e.driverId !== match.id);
    });
    if (clash) return signupErr('e2', 'Number #' + cur.num + ' is already racing in ' + classById(c.id).name + '. Pick a different number for that class.');
  }
  /* A returning driver changing their number rewrites it in EVERY class they already
     race today — so validate against those classes too, or we would silently create a
     duplicate car number elsewhere on the board. */
  if (match && String(match.num).toLowerCase() !== cur.num.toLowerCase()) {
    const myClassIds = [...new Set(S.raceDay.entries.filter(e => e.driverId === match.id).map(e => e.classId))];
    for (const cid of myClassIds) {
      const clash = S.raceDay.entries.find(e => e.classId === cid && e.driverId !== match.id
        && String((driverById(e.driverId) || {}).num).toLowerCase() === cur.num.toLowerCase());
      if (clash) return signupErr('e2', 'Number #' + cur.num + ' is already racing in ' + classById(cid).name + ', where you\'re also entered. Pick a different number.');
    }
  }
  /* Every selected class must still have a pill left. */
  for (const c of toEnter) {
    if (drawPill(c.id) === null)
      return signupErr('e2', 'All pills are taken in ' + c.name + '. The admin can raise that class\'s pill count.');
  }

  /* Save / update the driver book. */
  let driver = match;
  if (driver) { driver.num = cur.num; driver.name = cur.name; }
  else { driver = { id: genDriverId(), name: cur.name, num: cur.num, noPoints: false }; S.roster.push(driver); }

  /* Driven link (optional): pull the driver's published card in the background. */
  const profCodeEl = document.getElementById('dProfCode');
  const profCode = profCodeEl ? profCodeEl.value.trim() : '';
  if (profCode && !driver.profileId) linkProfile(driver.id, profCode).then(() => render(curPage)).catch(() => {});

  /* Record the Terms/Privacy acceptance once per driver per day — not once per class,
     which is what inflated v1's acceptance log. */
  if (S.settings && S.settings.requireConsent) {
    const day = today();
    const alreadyConsented = (S.consents || []).some(c =>
      c.date === day && c.driver === driver.name && String(c.num) === String(driver.num));
    if (!alreadyConsented) recordConsent(driver.name, driver.num);
  }

  consumeTrialDay();
  const drawn = [];
  toEnter.forEach(c => {
    const pill = drawPill(c.id);
    S.raceDay.entries.push({ driverId: driver.id, classId: c.id, pill });
    drawn.push({ cls: c, pill });
  });
  save();
  signupDone = { driver, drawn };
  renderSignup();
  renderRaceControl();
  window.scrollTo(0, 0);
}

function discNum(num) {

     like 123x or A12B so they stay inside the disc. */
  const s = String(num);
  return '<div class="disc sm' + (s.length >= 3 ? ' long' : '') + '">' + esc(s) + '</div>';
}
function discPill(n) { return '<div class="disc sm pill">' + esc(String(n)) + '</div>'; }

function gridMarkup(racers, single) {
  const sub = r => r.tag || (r.qualTime ? '⏱ ' + r.qualTime : 'Pill #' + r.pill);
  /* Any row that knows its driver opens the driver card — every role, every
     lineup. The TV display builds its own markup and stays non-clickable. */
  const tap = r => r.id ? ' onclick="openDriverCard(' + r.id + ')" style="cursor:pointer"' : '';
  if (single) {
    return '<div class="grid1">' + racers.map((r, i) =>
      '<div class="slot' + (i === 0 ? ' pole' : '') + '"><span class="spot">P' + (i + 1) + '</span>'
      + (i === 0 ? '<span class="poletag">Pole</span>' : '')
      + discNum(r.num) + '<div class="who"' + tap(r) + '><b>' + esc(r.name) + '</b><span>' + esc(sub(r)) + '</span></div></div>'
    ).join('') + '</div>';
  }
  return '<div class="lane-labels"><div>Inside line</div><div>Outside line</div></div><div class="grid2">'
    + racers.map((r, i) => {
        const pos = i + 1, pt = posText(pos);

          + '<span class="spot">P' + pos + ' · Row ' + pt.row + '</span>'

function classGridMarkup(cls, single) {
  const racers = classRacers(cls.id);
  let h = '<section style="margin-bottom:30px"><div class="spread" style="margin-bottom:10px">'
    + '<h3 style="margin:0">' + esc(cls.name) + '</h3>'
    + '<span class="badge badge-dim">' + plural(racers.length, 'entered', 'entered') + '</span>'
    + (racers.length ? '<button class="btn btn-sm push" onclick="openQualTimes(' + cls.id + ')">⏱ Qualifying times</button>' : '')
    + '</div>';
  if (!racers.length) return h + emptyState('🏁', 'No drivers yet — first to sign up takes the pole.') + '</section>';

  const invN = classInvertN(cls);
  const scope = cls.invertScope || 'field';
  const heats = classHeats(cls);
  const set1 = invertWithinHeats(heatArrays(racers, cls), cls);
  const set2 = set1.map(heat => [...heat].reverse());
  const field = invertField(racers, cls);
  const invNote = invN ? ' · top ' + invN + ' inverted (' + (scope === 'heat' ? 'each heat' : 'whole field') + ')' : '';

  if (heats === 0) {
    h += '<div class="slbl">Qualifying order — seeds the mains directly, no heats</div>' + gridMarkup(racers, single);
  } else if (set1.length === 1) {
    h += '<div class="slbl">Starting grid' + (heats === 1 ? ' — qualifying order' : ' — set 1') + invNote + '</div>' + gridMarkup(set1[0], single);
    if (heats === 2) h += '<div class="slbl">Set 2 — inverted</div>' + gridMarkup(set2[0], single);
  } else {
    h += '<div class="slbl">Full field — ' + (invN && scope === 'field'
        ? 'qualifying order, top ' + invN + ' inverted'
        : (heats === 1 ? 'qualifying order' : 'pill draw order')) + '</div>' + gridMarkup(field, single);
    h += '<div class="slbl">' + (heats === 1 ? 'Qualifying heats' : 'Set 1 heats') + invNote + '</div>';
    set1.forEach((heat, hi) => {
      h += '<p class="heat-cap"><b>Heat ' + (hi + 1) + '</b> · ' + plural(heat.length, 'car') + '</p>' + gridMarkup(heat, single);
    });
    if (heats === 2) {
      h += '<div class="slbl">Set 2 heats — inverted</div>';
      set2.forEach((heat, hi) => {
        h += '<p class="heat-cap"><b>Heat ' + (hi + 1) + '</b> · ' + plural(heat.length, 'car') + ' · inverted</p>' + gridMarkup(heat, single);
      });
    }
  }

  /* Once every heat finish is in, the main-event grids post here too. A 0-heat
     class is complete immediately, so its mains post as soon as drivers enter. */
  if (classComplete(cls.id)) {
    const fd = featureData(cls.id);
    const toRow = heats === 0
      ? s => ({ id: s.id, name: s.name, num: s.num, tag: s.qualTime ? '⏱ ' + s.qualTime : 'Seed P' + s.pill })
      : s => ({ id: s.id, name: s.name, num: s.num, tag: 'Heat total ' + s.pts });
    const bmInvNote = clsBMainInvert(cls) ? ' · top ' + clsBMainInvert(cls) + ' start inverted' : '';
    const ftInvNote = clsFeatInvert(cls) ? ' · top ' + clsFeatInvert(cls) + ' start inverted' : '';
    if (fd.mains.length) {
      fd.mains.forEach(m => {
        h += '<div class="slbl">' + esc(m.label) + ' — top ' + fd.transfers + ' to ' + esc(m.feeds) + bmInvNote + '</div>'
          + gridMarkup(m.drivers.map(toRow), single);
      });
      if (fd.toFeatureSpots > 0 && fd.transferred.length >= fd.toFeatureSpots) {
        h += '<div class="slbl">🏁 Feature lineup' + ftInvNote + '</div>' + gridMarkup(featureGridOrder(fd, cls.id).map(toRow), single);
      } else {
        h += emptyState('🏁', 'The feature grid posts here once the main finishes are entered on the Score tab.');
      }
    } else {
      h += '<div class="slbl">🏁 Feature lineup — ' + (heats === 0 ? 'by qualifying order' : 'by heat total (low wins)') + ftInvNote + '</div>'
        + gridMarkup(featureGridOrder(fd, cls.id).map(toRow), single);
    }
  }
  return h + '</section>';
}

/* ============================================================================
   §5  SCORING
   The biggest time sink on race night. v1 gave every driver a <select>, which
   means reading a name, opening a dropdown, and finding a number — per car, per
   heat, per class. v2 keeps that mode and adds the two ways people who actually
   watch a race score it:

     tap  — tap drivers in the order they crossed the line; positions assign
            themselves. Long-press for DNF/DNS/DQ. Undo the last tap.
     pad  — type the car number, Enter; that car takes the next position.

   All three write the SAME heatResults keys through the same saveResult(), so
   governance, locking, the audit log, versions and duplicate warnings are
   untouched by the choice of entry mode.
   ========================================================================= */

function setScoreMode(m) {
  UI.scoreMode = m;
  try { localStorage.setItem('rd_score_mode', m); } catch (e) {}

}

/* Governance strip: official/unofficial, lock, override, versions. */

}

/* ------------------------------------------------------------ entry widgets */
function finSelect(clsId, rk, n, val) {
  let o = '<option value="">—</option>';
  for (let i = 1; i <= n; i++) o += '<option value="' + i + '"' + (val == i ? ' selected' : '') + '>' + i + '</option>';
  ['DNF', 'DNS', 'DQ'].forEach(c => { o += '<option value="' + c + '"' + (val === c ? ' selected' : '') + '>' + c + '</option>'; });
  return '<select class="fin-sel' + (val != null ? ' set' : '') + '" onchange="saveResult(' + clsId + ',\'' + rk + '\',this.value)">' + o + '</select>';
}

/* One race's worth of entry, in whichever mode this device prefers.
   `group` = {clsId, prefix, drivers:[{id,name,num}], title, sub, headClass} */
function raceEntry(group) {
  const res = getRes(group.clsId);
  const keyOf = id => group.prefix(id);
  const dup = dupFinishWarn(res, group.drivers.map(d => d.id), keyOf);
  const done = group.drivers.filter(d => res[keyOf(d.id)] != null).length;

  let h = '<div class="hb"><div class="hh' + (group.headClass || '') + '"><span>' + esc(group.title) + '</span>'
    + (group.sub ? '<small class="tiny">' + group.sub + '</small>' : '')
    + '<span class="push"></span>'
    + '<span class="badge ' + (done === group.drivers.length ? 'badge-green' : 'badge-dim') + '">'
    + done + '/' + group.drivers.length + '</span>' + dup + '</div>';

  if (UI.scoreMode === 'select') {
    h += group.drivers.map(d =>
      '<div class="lrow">' + discNum(d.num) + '<div class="nm">' + esc(d.name) + (d.sub ? '<small>' + d.sub + '</small>' : '') + '</div>'
      + (d.tag || '') + finSelect(group.clsId, keyOf(d.id), group.drivers.length, res[keyOf(d.id)]) + '</div>').join('');
    return h + '</div>';
  }

  /* tap + pad modes share the same body: a list of cars, each showing its
     assigned position, plus the controls above it. */
  const gid = group.gid;
  const all = done >= group.drivers.length;
  /* Once the field is fully placed there is no "next position" — saying P7 in a
     six-car heat reads like something is still missing. */
  const nextTxt = all
    ? '<b style="color:var(--flag-green)">All ' + group.drivers.length + ' placed</b>'
    : '<b style="color:var(--plate)">P' + scoreNextPos(group) + '</b>';
  if (UI.scoreMode === 'pad') {
    h += '<div class="padin" style="padding:12px 14px 0">'
      + '<input id="pad_' + gid + '" inputmode="numeric" autocomplete="off" placeholder="#"' + (all ? ' disabled' : '') + ' '
      + 'onkeydown="if(event.key===\'Enter\'){padEnter(\'' + gid + '\');event.preventDefault()}">'
      + '<button class="btn" onclick="padEnter(\'' + gid + '\')"' + (all ? ' disabled' : '') + '>Next position →</button>'
      + '<button class="btn btn-sm btn-ghost" onclick="scoreUndo(\'' + gid + '\')">↶ Undo</button>'
      + '<span class="tiny">' + (all ? '' : 'Next: ') + nextTxt + '</span></div>';
  } else {
    h += '<div class="rowflex" style="padding:12px 14px 0">'
      + '<span class="tiny">' + (all ? '' : 'Tap in finishing order. Next: ') + nextTxt + '</span>'
      + '<span class="push"></span>'
      + '<button class="btn btn-sm btn-ghost" onclick="scoreUndo(\'' + gid + '\')">↶ Undo</button>'
      + '<button class="btn btn-sm btn-ghost" onclick="scoreClear(\'' + gid + '\')">Clear</button></div>';
  }

  h += '<div class="tapgrid" style="padding:12px 14px 14px">' + group.drivers.map(d => {
    const v = res[keyOf(d.id)];
    const placed = v != null;
    const lbl = v === 'DNF' || v === 'DNS' || v === 'DQ' ? v : (placed ? 'P' + v : '');
    return '<button class="tapcard' + (placed ? ' placed' : '') + '" '
      + 'onclick="scoreTap(\'' + gid + '\',' + d.id + ')" '
      + 'oncontextmenu="scoreFlag(\'' + gid + '\',' + d.id + ');return false" '
      + 'ontouchstart="scoreLongStart(\'' + gid + '\',' + d.id + ')" ontouchend="scoreLongEnd()" ontouchmove="scoreLongEnd()">'
      + discNum(d.num) + '<span class="nm">' + esc(d.name) + (d.sub ? '<small>' + d.sub + '</small>' : '') + '</span>'
      + '<span class="assigned">' + lbl + '</span></button>';
  }).join('') + '</div>';
  return h + '</div>';
}

/* Groups are rebuilt on every render; this index lets the tap/pad handlers find
   the one a button belongs to without threading state through the markup. */
let _scoreGroups = {};

function scoreNextPos(g) {
  const res = getRes(g.clsId);
  const used = g.drivers.map(d => res[g.prefix(d.id)]).filter(v => typeof v === 'number');
  let n = 1;
  while (used.indexOf(n) >= 0) n++;
  return n;
}
function scoreTap(gid, driverId) {
  const g = _scoreGroups[gid]; if (!g) return;
  const res = getRes(g.clsId), rk = g.prefix(driverId);
  /* Tapping an already-placed car clears it, so a misplaced tap is one tap to fix. */
  saveResult(g.clsId, rk, res[rk] != null ? '' : String(scoreNextPos(g)));
}
function scoreFlag(gid, driverId) {
  const g = _scoreGroups[gid]; if (!g) return;
  const d = g.drivers.find(x => x.id === driverId); if (!d) return;
  openSheet(d.name + ' — #' + d.num, '<p class="sub">Mark this car\'s result.</p>',
    ['DNF', 'DNS', 'DQ'].map(c =>
      '<button class="btn" onclick="closeSheet();saveResult(' + g.clsId + ',\'' + g.prefix(driverId) + '\',\'' + c + '\')">' + c + '</button>').join('')
    + '<button class="btn btn-ghost" onclick="closeSheet();saveResult(' + g.clsId + ',\'' + g.prefix(driverId) + '\',\'\')">Clear</button>');
}
let _longTimer = null;
function scoreLongStart(gid, driverId) {
  clearTimeout(_longTimer);
  _longTimer = setTimeout(() => { _longTimer = null; scoreFlag(gid, driverId); }, 550);
}
function scoreLongEnd() { clearTimeout(_longTimer); _longTimer = null; }
function scoreUndo(gid) {
  const g = _scoreGroups[gid]; if (!g) return;
  const res = getRes(g.clsId);
  let bestId = null, bestPos = 0;
  g.drivers.forEach(d => {
    const v = res[g.prefix(d.id)];
    if (typeof v === 'number' && v > bestPos) { bestPos = v; bestId = d.id; }
  });
  if (bestId == null) { toast('Nothing to undo.'); return; }
  saveResult(g.clsId, g.prefix(bestId), '');
}
function scoreClear(gid) {
  const g = _scoreGroups[gid]; if (!g) return;
  if (!confirm('Clear every finish in ' + g.title + '?')) return;
  const res = getRes(g.clsId);
  g.drivers.forEach(d => { delete res[g.prefix(d.id)]; });
  logAudit('Cleared finishes', g.title, '(blank)', (classById(g.clsId) || {}).name);
  save();
  renderClassResults(g.clsId);
}
function padEnter(gid) {
  const g = _scoreGroups[gid]; if (!g) return;
  const inp = document.getElementById('pad_' + gid);
  const raw = (inp ? inp.value : '').trim();
  if (!raw) return;
  const hits = g.drivers.filter(d => String(d.num).toLowerCase() === raw.toLowerCase());
  if (!hits.length) { toast('No car #' + raw + ' in this race.', 'err'); if (inp) inp.select(); return; }
  const res = getRes(g.clsId), rk = g.prefix(hits[0].id);
  if (res[rk] != null) { toast('#' + raw + ' already has ' + (typeof res[rk] === 'number' ? 'P' + res[rk] : res[rk]) + '.', 'err'); if (inp) inp.select(); return; }
  saveResult(g.clsId, rk, String(scoreNextPos(g)));
  /* saveResult re-renders; put the caret back so the next number can just be typed. */
  const back = document.getElementById('pad_' + gid);
  if (back) { back.value = ''; back.focus(); }
}

/* --------------------------------------------------------------- the class */
function renderClassResults(clsId) {
  const el = document.getElementById('resBody');
  if (!el) return;                      /* score pane not on screen */
  const racers = classRacers(clsId);
  if (!racers.length) { el.innerHTML = emptyState('⏱', 'No drivers in this class.'); return; }

  _scoreGroups = {};
  const cls = classById(clsId);
  const set1 = heatSet(racers, cls);
  const set2 = set1.map(heat => [...heat].reverse());
  const res = getRes(clsId);
  const heats = classHeats(cls);
  const fd = featureData(clsId);
  const locked = resLocked(clsId);

  let h = resultGovBar(clsId);
  h += '<div class="spread" style="margin-bottom:12px">'
    + pointsRaceToggle(clsId, fd, res)
    + '<span class="push"></span>'
    + '<div class="seg seg-plate">'
    +   '<button class="' + (UI.scoreMode === 'tap' ? 'on' : '') + '" onclick="setScoreMode(\'tap\')" title="Tap drivers in the order they finished">Tap order</button>'
    +   '<button class="' + (UI.scoreMode === 'pad' ? 'on' : '') + '" onclick="setScoreMode(\'pad\')" title="Type the car number for each position">Number pad</button>'
    +   '<button class="' + (UI.scoreMode === 'select' ? 'on' : '') + '" onclick="setScoreMode(\'select\')" title="A dropdown per driver">Dropdowns</button>'
    + '</div></div>';

  h += '<div' + (locked ? ' style="opacity:.55;pointer-events:none"' : '') + '>';

  /* --- heats (a straight-to-mains class races none) --- */
  if (heats >= 1) {
    h += '<div class="slbl">' + (heats === 1 ? 'Qualifying heat' : 'Set 1 heats — pill order') + '</div>';
    set1.forEach((heat, hi) => { h += heatGroup(clsId, 'h1', hi, heat, ''); });
    if (heats === 2) {
      h += '<div class="slbl">Set 2 heats — inverted</div>';
      set2.forEach((heat, hi) => { h += heatGroup(clsId, 'h2', hi, heat, ' inv'); });
    }
  }

  /* --- standings / seeding --- */
  const standings = calcStandings(clsId);
  const advMap = {};
  fd.locked.forEach(r => { advMap[r.id] = { label: '→ Feature', feat: true }; });
  fd.mains.forEach(m => { m.drivers.forEach(r => { if (!advMap[r.id]) advMap[r.id] = { label: '→ ' + m.label, feat: false }; }); });

  h += '<div class="slbl">' + (heats === 0 ? 'Seeding — qualifying order' : 'Heat totals — the "race pill"') + '</div>'
    + '<div class="hb"><div class="hh"><span>' + (heats === 0 ? 'Seeds' : 'Standings') + '</span>'
    + '<small class="tiny">' + (heats === 0
        ? 'fastest qualifier is the top seed · mains fill straight from here'
        : 'finishes added up · low wins · ties go to the pill draw') + '</small></div>'
    + standings.map((s, i) => {
        const detail = heats === 0
          ? (s.qualTime ? '⏱ ' + s.qualTime : 'seed P' + s.pill)
          : 'heat' + (heats === 1 ? '' : 's') + ': ' + (heats === 1 ? finLabel(s.f1) : finLabel(s.f1) + ' + ' + finLabel(s.f2));
        const adv = advMap[s.id];
        return '<div class="lrow"><div class="pos' + (i < 3 ? ' p' + (i + 1) : '') + '">' + (i + 1) + '</div>'
          + discNum(s.num)
          + '<div class="nm">' + esc(s.name) + '<small>' + esc(detail) + '</small></div>'
          + (s.scored < heats ? '<span class="badge badge-amber">' + s.scored + ' of ' + heats + '</span>' : '')
          + (adv ? '<span class="' + (adv.feat ? 'badge badge-plate' : 'transfer-tag') + '">' + esc(adv.label) + '</span>' : '')
          + (heats === 0 ? '' : '<span class="pts">' + (s.scored ? s.pts : '—') + '</span>') + '</div>';
      }).join('') + '</div>';

  /* --- B-mains --- */
  const bmInv = clsBMainInvert(clsId);
  fd.mains.forEach(m => {
    const gid = 'bm' + m.key;
    _scoreGroups[gid] = {
      gid, clsId, title: m.label, prefix: id => bmKey(m.key, id),
      drivers: m.drivers.map(r => ({
        id: r.id, name: r.name, num: r.num,
        sub: (heats === 0 ? (r.qualTime ? '⏱ ' + r.qualTime : 'seed P' + r.pill) : 'total ' + r.pts),
        tag: m.made.some(t => t.id === r.id) ? '<span class="transfer-tag">→ ' + esc(m.feeds) + '</span>' : ''
      }))
    };
    h += '<div class="slbl">' + esc(m.label) + '</div>'
      + raceEntry(Object.assign({}, _scoreGroups[gid], {
          headClass: ' bmain',
          sub: 'top ' + fd.transfers + ' → ' + esc(m.feeds) + (bmInv ? ' · top ' + bmInv + ' start inverted' : '')
        }));
  });

  /* --- feature --- */
  const dp = dayPoints(clsId);
  const ftInv = clsFeatInvert(clsId);
  let ftRows = fd.locked.map(s => ({ r: s, tag: heats === 0
    ? '<span class="transfer-tag">' + esc(s.qualTime ? '⏱ ' + s.qualTime : 'seed P' + s.pill) + '</span>'
    : '<span class="pts">' + s.pts + '</span>' }));
  if (fd.mains.length) {
    for (let t = 0; t < fd.toFeatureSpots; t++) {
      const r = fd.transferred[t];
      ftRows.push(r ? { r, tag: '<span class="transfer-tag">' + esc(transferOrigin(fd, clsId, r.id)) + '</span>' } : { tbd: true });
    }
  }
  /* Apply the feature invert to the STARTING order only once every transfer spot is
     known, so placeholder rows never shuffle mid-night. */
  if (ftInv && !ftRows.some(x => x.tbd)) ftRows = invertTop(ftRows, ftInv);

  const ftDrivers = ftRows.filter(x => !x.tbd).map(x => ({
    id: x.r.id, name: x.r.name, num: x.r.num,
    tag: x.tag + (dp && res['ft_' + x.r.id] != null
      ? '<span class="transfer-tag">+' + (typeof res['ft_' + x.r.id] === 'number' ? dp[x.r.id] : S.settings.points.beyond) + ' pts</span>'
      : '')
  }));
  _scoreGroups.ft = { gid:'ft', clsId, title:'Feature', prefix: id => 'ft_' + id, drivers: ftDrivers };

  h += '<div class="slbl">Feature lineup &amp; finish</div>'
    + raceEntry(Object.assign({}, _scoreGroups.ft, {
        title: '🏁 Feature',
        headClass: ' feat',
        sub: (fd.mains.length
              ? fd.locked.length + (heats === 0 ? ' on qualifying' : ' on heat totals') + ' + ' + fd.toFeatureSpots + ' transferring up'
              : (heats === 0 ? 'lined up by qualifying order' : 'lined up by heat totals'))
             + (ftInv ? ' · top ' + ftInv + ' start inverted' : '')
             + (isPointsRace(clsId) ? ' · finishes award series points' : '')
      }));
  const tbd = ftRows.filter(x => x.tbd).length;
  if (tbd) h += '<p class="tiny" style="margin:-8px 0 14px">' + plural(tbd, 'transfer spot')
    + ' still open — score the mains to fill ' + (tbd === 1 ? 'it' : 'them') + '.</p>';

  h += '</div>';
  el.innerHTML = h;
}

function heatGroup(clsId, set, hi, heat, invClass) {
  const gid = set + '_' + hi;
  _scoreGroups[gid] = {
    gid, clsId, title: 'Heat ' + (hi + 1), prefix: id => set + '_' + id,
    drivers: heat.map(r => ({ id: r.id, name: r.name, num: r.num }))
  };
  return raceEntry(Object.assign({}, _scoreGroups[gid], {
    headClass: invClass, sub: invClass ? 'inverted' : ''
  }));
}

/* "Today counts toward the points series" — enabled only once the feature is fully
   entered. A DNF/DNS/DQ is a finished result for that purpose, so any stored value
   counts; otherwise one DNF could permanently lock the toggle. */
function pointsRaceToggle(clsId, fd, res) {
  const field = [...fd.locked, ...fd.transferred];
  const done = field.length > 0 && field.every(r => res['ft_' + r.id] != null);
  return '<label class="check" style="' + (done ? '' : 'opacity:.55') + '">'
    + '<input type="checkbox"' + (isPointsRace(clsId) ? ' checked' : '')
    + (done ? '' : ' disabled title="Enter all feature finishes to enable"')
    + ' onchange="togglePointsRace(' + clsId + ',this.checked)">'
    + '<b>Today counts toward the points series</b></label>';
}

/* ============================================================================
   §6  POINTS
   ========================================================================= */
function renderPoints() {
  const el = document.getElementById('pointsWrap');
  UI.ptsNames = seriesClassNames();
  if (!UI.ptsNames.length) {
    el.innerHTML = '<h2>Points series</h2>' + emptyState('🏆', 'No classes yet — set up classes in Admin first.',
      deviceRole() === 'admin' ? '⚙ Add a class' : '', "nav('admin');admOpen('classes')");
    return;
  }
  if (!UI.ptsTab || !UI.ptsNames.includes(UI.ptsTab)) UI.ptsTab = UI.ptsNames[0];

  let h = '<h2>Points series</h2>'
    + '<p class="sub">Season standings by class. Feature finishes earn the points set in Admin — tonight counts live once finishes are in, and past race days count from history.</p>'
    + '<div class="tabs">' + UI.ptsNames.map((n, i) =>
        '<button class="tab' + (n === UI.ptsTab ? ' on' : '') + '" onclick="UI.ptsTab=UI.ptsNames[' + i + '];renderPoints()">'
        + esc(n) + '</button>').join('') + '</div>';

  const cls = S.classes.find(c => c.name.toLowerCase() === UI.ptsTab.toLowerCase());
  if (cls && classRacers(cls.id).length) {
    const state = !isPointsRace(cls.id)
      ? ['badge-dim', 'Tonight is not a points race for this class — toggle it on the Score tab.']
      : dayPoints(cls.id)
        ? ['badge-green', 'Tonight is a points race — the feature finishes below are already counted.']
        : ['badge-amber', 'Tonight is a points race — it counts here once feature finishes are entered.'];
    h += '<div class="note note-info" style="margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">'
      + '<span class="badge ' + state[0] + '">Tonight</span>' + esc(state[1]) + '</div>';
  }

  const rows = seriesStandings(UI.ptsTab);
  if (!rows.length) {
    h += emptyState('🏆', 'No points yet — they appear once feature finishes are entered, and add up as race days are archived.');
  } else {
    h += '<div class="card card-flush"><div class="scroll-x"><table class="tbl">'
      + '<thead><tr><th></th><th>Driver</th><th>#</th><th class="r">Points</th><th class="r">Races</th></tr></thead><tbody>'
      + rows.map((r, i) =>
          '<tr><td class="pos' + (i < 3 ? ' p' + (i + 1) : '') + '" style="width:34px">' + (i + 1) + '</td>'
          + '<td style="font-weight:600">' + esc(r.name) + '</td>'
          + '<td class="muted">#' + esc(r.num) + '</td>'
          + '<td class="r"><span class="pts">' + r.pts + '</span></td>'
          + '<td class="r muted">' + r.days + '</td></tr>').join('')
      + '</tbody></table></div></div>';
  }
  el.innerHTML = h;
}
/* ============================================================================
   §7  NOT YET PORTED — placeholders replaced as each build phase lands.
   Every name here exists in v1 and is called by ported §1 engine code or by the
   views above, so it must be defined for the app to boot. Each one is replaced,
   not deleted.
   ========================================================================= */
const TV = { on:false, idx:0, locked:false, timer:null, ctlTimer:null };
function tvRender() {}
function openTV()  { toast('TV display lands in the next build phase.'); }
function closeTV() {}
function openPrint() { toast('The print system lands in the next build phase.'); }
function openImport() { toast('Timing import lands in the next build phase.'); }
function openDoc() { toast('The legal documents land in the next build phase.'); }
function renderFanView() { document.getElementById('gridWrap').innerHTML = todoPanel('Lineups', 'The spectator view lands in the next build phase.'); }
function editDriverCard() { toast('Card editing lands in the next build phase.'); }
function linkProfilePrompt() { toast('Driven linking lands in the next build phase.'); }
function refreshProfile() { toast('Driven linking lands in the next build phase.'); }
function unlinkProfile() { toast('Driven linking lands in the next build phase.'); }

function todoPanel(title, note) {
  return '<h2>' + esc(title) + '</h2><div class="card"><p class="muted">' + esc(note) + '</p></div>';
}
function renderAdmin()   { document.getElementById('adminWrap').innerHTML = todoPanel('Admin', 'Coming in phase 3.'); }
function renderHelp()    { document.getElementById('helpWrap').innerHTML  = todoPanel('Guide', 'Coming in phase 3.'); }
function renderFooter()  {}
function renderSyncCard() {}
function renderLicCard() {}

function openSetupWizard() {}
function seedFullDemoNight() {}
/* ============================================================================
   §8  ROLES ON SCREEN  +  §9  BOOT
   ========================================================================= */

/* v1's applyRole hand-toggled a dozen element display styles. In v2 the nav is
   derived from ROLE_PAGES every render, so this only has to handle the modes
   that change the shape of the app: kiosk, TV, and the operator bar. */
function applyRole() {
  const role = deviceRole();
  const allowed = ROLE_PAGES[role] || ROLE_PAGES.admin;
  const kiosk = role === 'register' && S.settings && S.settings.kioskReg;
  document.body.classList.toggle('kiosk', !!kiosk);
  document.body.classList.toggle('op-watch', operatorWatching());
  renderOpBar();
  renderHeader();
  renderNav();
  if (allowed.indexOf(curPage) < 0) nav(allowed[0]);
  else renderRaceControl();
  if (role === 'tv' && !TV.on && typeof openTV === 'function') openTV();
}

/* Operator bar — the owner's monitoring device: watch read-only, or take control. */
function renderOpBar() {
  let bar = document.getElementById('opBar');
  if (deviceRole() !== 'operator') { if (bar) bar.remove(); return; }
  if (!bar) {
    bar = document.createElement('div');
    bar.id = 'opBar';
    bar.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:90;display:flex;align-items:center;gap:12px;'
      + 'flex-wrap:wrap;padding:11px 16px calc(11px + env(safe-area-inset-bottom));background:var(--asphalt-3);'
      + 'border-top:2px solid var(--plate);font-size:13.5px';
    document.body.appendChild(bar);
  }
  const watching = operatorWatching();
  bar.innerHTML = '<span class="badge ' + (watching ? 'badge-dim' : 'badge-plate') + '">'
      + (watching ? '👁 Watching' : '✎ Controlling') + '</span>'
    + '<span class="muted">' + esc(S.track.name || 'Track') + ' · ' + esc(syncKey() || 'no code') + '</span>'
    + '<span style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap">'
    + (watching
        ? '<button class="btn btn-sm btn-primary" onclick="opTakeControl()">Take control</button>'
        : '<button class="btn btn-sm" onclick="opBackToWatch()">Back to watching</button>')
    + '<button class="btn btn-sm btn-ghost" onclick="opStop()">Exit</button></span>';
}

/* ---------------------------------------------------------------- recovery */
/* localStorage held something we could not parse. Never overwrite it silently:
   offer the raw bytes as a download first, and make "start fresh" deliberate. */
function checkLoadFailure() {
  if (!LOAD_FAILURE) return;
  openSheet('Saved data could not be read',
    '<div class="note note-err" style="margin-bottom:14px">This device has ' + LOAD_FAILURE.raw.length
      + ' characters of saved RaceDay data that could not be opened. It has <b>not</b> been deleted.</div>'
      + '<p class="sub">Download it first — the app owner may be able to recover the season from it. '
      + 'Starting fresh permanently overwrites it.</p>',
    '<button class="btn btn-primary" onclick="downloadRecoveryFile()">⬇ Download the unreadable data</button>'
      + '<button class="btn btn-danger" onclick="confirmStartFresh()">Start fresh</button>',
    { cls:'sheet' });
}
function downloadRecoveryFile() {
  if (!LOAD_FAILURE) return;
  downloadFile('raceday-unreadable-' + Date.now() + '.json', LOAD_FAILURE.raw, 'application/json');
}
function confirmStartFresh() {
  if (!confirm('Start fresh on this device? The saved data that could not be read will be permanently overwritten. Make sure you already downloaded it if you might need it.')) return;
  LOAD_FAILURE = null;
  save();                 /* persists the already-active defaults() S over the bad key */
  closeSheet();
  renderAll();
}

/* -------------------------------------------------------------------- boot */
/* Order matters and mirrors v1: URL params (which may set role + sync) before
   anything reads the role, sync last because it is async. */
window.addEventListener('storage', e => {
  if (e.key !== KEY) return;
  S = load();
  renderAll();
  checkLoadFailure();
  if (TV.on) tvRender();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && sheetOpen()) closeSheet();
});

applyTheme();
handleUrlParams();
applyRole();
nav(curPage);
renderAll();
initSync();

/* Pick up any Driven cards linked while offline (no-op when none are pending). */
if (navigator.onLine && (S.roster || []).some(d => d.profile && d.profile.pendingFetch)) retryPendingProfiles();

/* First-run setup ONLY for a genuinely new, standalone admin device — never for a
   device JOINING an existing track. initSync() above is async, so on ANY fresh device
   S.track.name is still empty right here regardless of role while the real cloud data
   is in flight; without this guard a spectator's phone that just scanned the QR code
   (role viewer, sync enabled) would be handed the full setup wizard — track name,
   classes, and a NEW ADMIN PIN — all editable and all synced live into the shared room.
   Also never fires on LOAD_FAILURE: S.track.name is empty on the defaults() fallback
   exactly like a fresh install, but this device is not fresh, and offering "set up a new
   track" there would bury the fact that real data exists. */
if (!LOAD_FAILURE && !S.track.name && deviceRole() === 'admin' && !(S.sync && S.sync.enabled)) openSetupWizard();
checkLoadFailure();

</script>
