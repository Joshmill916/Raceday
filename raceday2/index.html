/* ============================================================================
   TOKENS
   Dark is the identity. Light exists for two functional reasons only: the
   daylight sign-up tablet, and print (which is always ink-on-white). Both are
   the same token names with swapped values — there is never a second stylesheet.
   ========================================================================= */
:root {
  /* surfaces, dark ground up */
  --asphalt-0:#0b0c0f;      /* page ground */
  --asphalt-1:#131519;      /* card surface */
  --asphalt-2:#1b1e24;      /* raised: inputs, rows */
  --asphalt-3:#262a32;      /* fills, hover */
  --line:#2e333c;           /* borders */
  --line-soft:#21252c;      /* internal hairlines */

  /* text */
  --ink:#f2f2ee;
  --ink-dim:#c3c7cf;
  --muted:#8b909b;

  /* the one accent */
  --plate:#ffd449;          /* number-plate yellow */
  --plate-ink:#161408;
  --plate-dim:#7a6320;

  /* status only — never chrome */
  --flag-green:#22c55e;  --flag-green-bg:#0f2a1b;  --flag-green-ink:#7ee2a8;
  --flag-amber:#f0a92a;  --flag-amber-bg:#2c2110;  --flag-amber-ink:#f5c977;
  --pit-red:#e2483b;     --pit-red-bg:#2c1414;     --pit-red-ink:#f39a91;
  --info-bg:#101c2b;     --info-ink:#8ec1f0;

  /* type */
  --display:'Saira Condensed','Arial Narrow',system-ui,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;

  /* geometry */
  --r-xs:6px; --r-sm:9px; --r:13px; --r-lg:18px; --r-xl:24px;
  --tap:44px;                       /* minimum touch target, everywhere */
  --rail:232px;
  --pad:clamp(14px,3vw,26px);
  --shadow:0 18px 50px rgba(0,0,0,.55);
  --shadow-sm:0 4px 16px rgba(0,0,0,.4);
  --focus:0 0 0 3px rgba(255,212,73,.42);
  color-scheme: dark;
}

:root[data-theme="light"] {
  --asphalt-0:#eeeeea;
  --asphalt-1:#ffffff;
  --asphalt-2:#f7f7f4;
  --asphalt-3:#ebebe6;
  --line:#dcdcd6;
  --line-soft:#e9e9e3;
  --ink:#16171a;
  --ink-dim:#3a3d44;
  --muted:#6b6e76;
  --plate:#ffd449;
  --plate-ink:#161408;
  --plate-dim:#8a6f1e;
  --flag-green:#0e8a4d; --flag-green-bg:#e7f6ee; --flag-green-ink:#1f7a3d;
  --flag-amber:#b8791a; --flag-amber-bg:#fdf3d7; --flag-amber-ink:#7a5a10;
  --pit-red:#c8372d;    --pit-red-bg:#fdeeec;    --pit-red-ink:#9a3030;
  --info-bg:#e9f2fb;    --info-ink:#1f5c94;
  --shadow:0 18px 50px rgba(0,0,0,.16);
  --shadow-sm:0 4px 16px rgba(0,0,0,.09);
  color-scheme: light;
}

/* ============================================================================
   RESET / BASE
   ========================================================================= */
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html { -webkit-text-size-adjust:100%; }
body {
  font-family:var(--body); font-size:15px; line-height:1.5;
  background:var(--asphalt-0); color:var(--ink);
  min-height:100dvh; overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
}
/* Every number in a scoring app is read at a glance and compared down a column. */
.num,.disc,.pos,.pts,input[type="number"],table,.tabnum { font-variant-numeric:tabular-nums; }

h1,h2,h3,h4 { font-family:var(--display); font-weight:800; text-transform:uppercase; letter-spacing:.02em; line-height:1.1; }
h2 { font-size:clamp(24px,4vw,32px); }
h3 { font-size:clamp(17px,2.4vw,21px); font-weight:700; letter-spacing:.035em; }
h4 { font-size:14px; font-weight:700; letter-spacing:.06em; color:var(--muted); }
a { color:var(--plate); }
img { max-width:100%; }
:focus-visible { outline:none; box-shadow:var(--focus); border-radius:var(--r-xs); }
::selection { background:var(--plate); color:var(--plate-ink); }
.sub { color:var(--muted); font-size:14px; margin-bottom:18px; max-width:68ch; }
.muted { color:var(--muted); }
.tiny { font-size:12px; color:var(--muted); }
.hide { display:none !important; }
.sr { position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap; }
.checker { background-image:repeating-conic-gradient(currentColor 0% 25%, transparent 0% 50%); background-size:14px 14px; }

/* ============================================================================
   APP SHELL
   Wide: a fixed left rail, content takes the rest of the screen (v1's 860px
   column wasted half a 12" scoring tablet). Narrow: bottom tab bar, thumb reach.
   ========================================================================= */
.app { min-height:100dvh; display:grid; grid-template-columns:1fr; }
@media (min-width:900px) { .app { grid-template-columns:var(--rail) 1fr; } }

.rail { display:none; }
@media (min-width:900px) {
  .rail {
    display:flex; flex-direction:column; gap:2px;
    background:var(--asphalt-1); border-right:1px solid var(--line);
    padding:18px 12px; position:sticky; top:0; height:100dvh; overflow-y:auto;
  }
}
.brand { font-family:var(--display); font-weight:800; font-size:25px; letter-spacing:.045em; text-transform:uppercase; color:var(--ink); line-height:1; }
.brand em { font-style:normal; color:var(--plate); }
.brand-sub { font-size:11px; color:var(--muted); letter-spacing:.09em; text-transform:uppercase; margin-top:5px; }
.rail-brand { padding:6px 10px 18px; }
.rail-grp { font-size:10.5px; font-weight:700; letter-spacing:.11em; text-transform:uppercase; color:var(--muted); padding:16px 10px 6px; }
.rail-btn {
  display:flex; align-items:center; gap:11px; width:100%; min-height:var(--tap);
  padding:9px 11px; border:none; border-radius:var(--r-sm); background:transparent;
  color:var(--ink-dim); font:inherit; font-size:14.5px; font-weight:600; cursor:pointer; text-align:left;
  position:relative; transition:background .12s,color .12s;
}
.rail-btn:hover { background:var(--asphalt-2); color:var(--ink); }
.rail-btn.on { background:var(--asphalt-3); color:var(--ink); }
.rail-btn.on::before { content:''; position:absolute; left:0; top:8px; bottom:8px; width:3px; border-radius:3px; background:var(--plate); }
.rail-btn.on { padding-left:15px; }
.rail-ico { width:22px; text-align:center; font-size:16px; flex:none; }
.rail-foot { margin-top:auto; padding:14px 10px 4px; border-top:1px solid var(--line-soft); display:grid; gap:8px; }

.tabbar {
  position:fixed; bottom:0; left:0; right:0; z-index:40;
  display:flex; background:var(--asphalt-1); border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
@media (min-width:900px) { .tabbar { display:none; } }
.tabbar button {
  flex:1; min-height:56px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  border:none; background:none; color:var(--muted); font:inherit; font-size:10.5px; font-weight:700;
  letter-spacing:.05em; text-transform:uppercase; cursor:pointer; padding:6px 2px 8px; position:relative;
}
.tabbar button .rail-ico { font-size:19px; width:auto; }
.tabbar button.on { color:var(--ink); }
.tabbar button.on::after { content:''; position:absolute; top:0; left:22%; right:22%; height:3px; border-radius:0 0 3px 3px; background:var(--plate); }

.main { display:flex; flex-direction:column; min-width:0; padding-bottom:calc(64px + env(safe-area-inset-bottom)); }
@media (min-width:900px) { .main { padding-bottom:0; } }

/* Top bar — track identity, live state, and the admin lock. */
.topbar {
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  padding:12px var(--pad); background:var(--asphalt-1); border-bottom:1px solid var(--line);
  position:sticky; top:0; z-index:30;
}
.topbar .mob-brand { display:flex; align-items:center; gap:10px; }
@media (min-width:900px) { .topbar .mob-brand { display:none; } }
.topbar-track { display:flex; align-items:center; gap:10px; min-width:0; }
.topbar-track img { height:32px; max-width:120px; object-fit:contain; border-radius:var(--r-xs); background:#fff; padding:3px 5px; }
.topbar-name { font-family:var(--display); font-weight:700; font-size:17px; letter-spacing:.03em; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.topbar-right { margin-left:auto; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }

.views { padding:var(--pad); flex:1; min-width:0; }
.view { display:none; }
.view.on { display:block; animation:fade .16s ease-out; }
@keyframes fade { from { opacity:0; transform:translateY(3px); } to { opacity:1; transform:none; } }
.wrap { max-width:1180px; }
.wrap-narrow { max-width:680px; }
.wrap-mid { max-width:900px; }

/* ============================================================================
   RACE CONTROL — the spine
   v1 had no idea what part of the night it was in; you inferred it from which
   tab you were on. This bar names the phase, and names the one next action.
   ========================================================================= */
.rc { background:var(--asphalt-1); border-bottom:1px solid var(--line); padding:10px var(--pad) 12px; }
.rc-steps { display:flex; gap:4px; overflow-x:auto; scrollbar-width:none; padding-bottom:2px; }
.rc-steps::-webkit-scrollbar { display:none; }
.rc-step {
  flex:1 1 0; min-width:78px; border:none; background:none; cursor:default; padding:0; text-align:left;
  display:flex; flex-direction:column; gap:5px;
}
.rc-step .bar { height:4px; border-radius:99px; background:var(--asphalt-3); transition:background .2s; }
.rc-step .lbl { font-family:var(--display); font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); white-space:nowrap; }
.rc-step.done .bar { background:var(--flag-green); }
.rc-step.done .lbl { color:var(--ink-dim); }
.rc-step.now .bar { background:var(--plate); box-shadow:0 0 14px rgba(255,212,73,.4); }
.rc-step.now .lbl { color:var(--plate); }
.rc-next { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-top:11px; }
.rc-next .txt { font-size:13.5px; color:var(--ink-dim); }
.rc-next .txt b { color:var(--ink); font-weight:700; }
.rc-next .btn { margin-left:auto; }

/* ============================================================================
   SURFACES
   ========================================================================= */
.card { background:var(--asphalt-1); border:1px solid var(--line); border-radius:var(--r); padding:18px 20px; margin-bottom:14px; }
.card-tight { padding:13px 15px; }
.card-flush { padding:0; overflow:hidden; }
.card > h3:first-child { margin-bottom:10px; }
.slbl { font-family:var(--display); font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.1em; margin:22px 0 8px; }
.slbl:first-child { margin-top:0; }
.hr { height:1px; background:var(--line); border:0; margin:16px 0; }
.stack { display:grid; gap:14px; }
.cols { display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); }
.rowflex { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.spread { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
.spread > .push { margin-left:auto; }

.note { border-radius:var(--r-sm); padding:11px 14px; font-size:13.5px; line-height:1.55; border:1px solid; }
.note-info  { background:var(--info-bg);       border-color:#1d3247; color:var(--info-ink); }
.note-warn  { background:var(--flag-amber-bg); border-color:#4a3a15; color:var(--flag-amber-ink); }
.note-err   { background:var(--pit-red-bg);    border-color:#4d2320; color:var(--pit-red-ink); }
.note-ok    { background:var(--flag-green-bg); border-color:#1d4630; color:var(--flag-green-ink); }
.banner { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin:0 0 14px; }
.banner .btn { margin-left:auto; }

/* ============================================================================
   BUTTONS
   ========================================================================= */
.btn {
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  min-height:var(--tap); padding:11px 18px; border-radius:var(--r-sm);
  border:1px solid var(--line); background:var(--asphalt-2); color:var(--ink);
  font:inherit; font-size:14.5px; font-weight:600; cursor:pointer;
  transition:background .13s,border-color .13s,transform .06s; white-space:nowrap;
}
.btn:hover { background:var(--asphalt-3); }
.btn:active { transform:translateY(1px); }
.btn:disabled { opacity:.38; cursor:not-allowed; transform:none; }
.btn-primary { background:var(--plate); border-color:var(--plate); color:var(--plate-ink); font-weight:700; }
.btn-primary:hover { background:#ffdf74; }
.btn-go {
  background:var(--plate); border-color:var(--plate); color:var(--plate-ink);
  font-family:var(--display); font-weight:800; font-size:clamp(17px,2.6vw,21px);
  text-transform:uppercase; letter-spacing:.05em; min-height:58px; padding:14px 26px; border-radius:var(--r);
}
.btn-go:hover { background:#ffdf74; }
.btn-ghost { background:transparent; }
.btn-sm { min-height:34px; padding:6px 12px; font-size:13px; border-radius:var(--r-xs); }
.btn-danger { border-color:#4d2320; background:var(--pit-red-bg); color:var(--pit-red-ink); }
.btn-danger:hover { background:#3a1a18; }
.btn-block { width:100%; }
.btn-ico { padding:9px; min-width:var(--tap); }

/* Segmented control — replaces a dozen ad-hoc toggle pairs in v1. */
.seg { display:inline-flex; background:var(--asphalt-2); border:1px solid var(--line); border-radius:var(--r-sm); padding:3px; gap:3px; }
.seg button {
  min-height:36px; padding:6px 14px; border:none; border-radius:var(--r-xs); background:none;
  color:var(--muted); font:inherit; font-size:13.5px; font-weight:600; cursor:pointer; transition:background .12s,color .12s;
}
.seg button.on { background:var(--asphalt-0); color:var(--ink); box-shadow:var(--shadow-sm); }
.seg-plate button.on { background:var(--plate); color:var(--plate-ink); font-weight:700; }

/* Scrolling pill tabs — classes, points, results. */
.tabs { display:flex; gap:7px; overflow-x:auto; padding:2px 0 12px; scrollbar-width:none; }
.tabs::-webkit-scrollbar { display:none; }
.tab {
  min-height:38px; padding:7px 15px; border:1px solid var(--line); border-radius:99px;
  background:var(--asphalt-1); color:var(--muted); font:inherit; font-size:13.5px; font-weight:600;
  cursor:pointer; white-space:nowrap; transition:background .12s,color .12s,border-color .12s;
}
.tab:hover { color:var(--ink); }
.tab.on { background:var(--plate); border-color:var(--plate); color:var(--plate-ink); font-weight:700; }

.chip {
  display:inline-flex; align-items:center; gap:8px; min-height:var(--tap); padding:10px 16px;
  border:1.5px solid var(--line); border-radius:99px; background:var(--asphalt-2); color:var(--ink-dim);
  font:inherit; font-size:14.5px; font-weight:600; cursor:pointer; transition:all .13s;
}
.chip:hover { border-color:var(--muted); color:var(--ink); }
.chip.on { background:var(--plate); border-color:var(--plate); color:var(--plate-ink); font-weight:700; }
.chip.on::before { content:'✓'; font-weight:800; }

.badge { display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:99px; font-size:11.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; font-family:var(--display); }
.badge-green { background:var(--flag-green-bg); color:var(--flag-green-ink); }
.badge-amber { background:var(--flag-amber-bg); color:var(--flag-amber-ink); }
.badge-red   { background:var(--pit-red-bg);    color:var(--pit-red-ink); }
.badge-plate { background:var(--plate); color:var(--plate-ink); }
.badge-dim   { background:var(--asphalt-3); color:var(--muted); }

/* ============================================================================
   FORMS
   ========================================================================= */
label { display:block; font-size:12.5px; font-weight:600; color:var(--ink-dim); margin:0 0 6px; }
.field { margin-bottom:16px; }
.field > .tiny { margin-top:5px; }
input[type="text"],input[type="number"],input[type="date"],input[type="password"],select,textarea {
  width:100%; min-height:var(--tap); padding:11px 13px; border-radius:var(--r-sm);
  border:1.5px solid var(--line); background:var(--asphalt-2); color:var(--ink);
  font-family:inherit; font-size:16px; outline:none; transition:border-color .13s,background .13s;
}
textarea { resize:vertical; min-height:80px; line-height:1.5; }
input::placeholder,textarea::placeholder { color:var(--muted); opacity:.75; }
input:focus,select:focus,textarea:focus { border-color:var(--plate); background:var(--asphalt-1); }
input:disabled,select:disabled { opacity:.5; }
select { appearance:none; background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%); background-position:calc(100% - 17px) 52%,calc(100% - 12px) 52%; background-size:5px 5px,5px 5px; background-repeat:no-repeat; padding-right:34px; }
.input-lg { font-size:19px; min-height:56px; font-weight:600; }
.check { display:flex; align-items:flex-start; gap:10px; font-size:13.5px; line-height:1.5; color:var(--ink-dim); cursor:pointer; margin:0; font-weight:500; }
.check input[type="checkbox"] { width:20px; height:20px; min-height:0; flex:none; margin-top:1px; accent-color:var(--plate); cursor:pointer; }
.check b { color:var(--ink); }
.inline-num { width:74px; min-height:36px; padding:6px 8px; font-size:14px; text-align:center; }

/* ============================================================================
   THE DISC — the number plate. The app's signature element and its atom.
   Yellow = vehicle number. White = drawn pill. They are never mixed.
   ========================================================================= */
.disc {
  display:inline-flex; align-items:center; justify-content:center; flex:none;
  width:46px; height:46px; border-radius:50%;
  background:var(--plate); color:var(--plate-ink);
  font-family:var(--display); font-weight:800; font-size:21px; letter-spacing:-.01em;
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.22), inset 0 0 0 5px var(--plate), 0 2px 10px rgba(0,0,0,.4);
}
.disc.pill { background:#f7f7f2; color:#16171a; box-shadow:inset 0 0 0 2px rgba(0,0,0,.16), inset 0 0 0 5px #f7f7f2, 0 2px 10px rgba(0,0,0,.4); }
.disc.xs  { width:30px; height:30px; font-size:14px; box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.22), inset 0 0 0 3.5px currentColor; }
.disc.xs.pill,.disc.sm.pill { box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.16), inset 0 0 0 3.5px #f7f7f2; }
.disc.sm  { width:37px; height:37px; font-size:17px; }
.disc.big { width:104px; height:104px; font-size:47px; }
.disc.huge{ width:150px; height:150px; font-size:66px; }
.disc.long { font-size:.72em; letter-spacing:-.02em; }
@keyframes pop { 0% { transform:scale(.3) rotate(-14deg); opacity:0; } 62% { transform:scale(1.12) rotate(3deg); } 100% { transform:scale(1) rotate(0); opacity:1; } }
.disc.pop { animation:pop .42s cubic-bezier(.3,1.5,.5,1) both; }

/* ============================================================================
   LISTS & ROWS — the workhorse for entries, roster, results, standings
   ========================================================================= */
.list { border:1px solid var(--line); border-radius:var(--r); overflow:hidden; background:var(--asphalt-1); }
.lrow { display:flex; align-items:center; gap:12px; padding:10px 14px; border-bottom:1px solid var(--line-soft); min-height:56px; }
.lrow:last-child { border-bottom:none; }
.lrow:nth-child(even) { background:rgba(255,255,255,.014); }
.lrow .nm { flex:1; min-width:0; font-size:14.5px; font-weight:600; line-height:1.25; }
.lrow .nm small { display:block; font-size:12px; font-weight:500; color:var(--muted); margin-top:2px; }
.lrow .acts { display:flex; gap:6px; flex:none; align-items:center; }
.pos { font-family:var(--display); font-weight:800; font-size:19px; color:var(--muted); width:34px; text-align:center; flex:none; }
.pos.p1 { color:var(--plate); }
.pos.p2,.pos.p3 { color:var(--ink); }
.pts { font-family:var(--display); font-weight:800; font-size:19px; color:var(--plate); min-width:44px; text-align:right; }
.empty { padding:34px 20px; text-align:center; color:var(--muted); font-size:14px; }
.empty .big { font-size:34px; display:block; margin-bottom:10px; opacity:.5; }

table.tbl { width:100%; border-collapse:collapse; font-size:14px; }
table.tbl th { font-family:var(--display); font-size:11.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); text-align:left; padding:9px 12px; border-bottom:1px solid var(--line); white-space:nowrap; }
table.tbl td { padding:10px 12px; border-bottom:1px solid var(--line-soft); }
table.tbl tr:last-child td { border-bottom:none; }
table.tbl .r { text-align:right; }
.scroll-x { overflow-x:auto; -webkit-overflow-scrolling:touch; }

/* ============================================================================
   LINEUP GRID — double file, staggered like the real thing
   ========================================================================= */
.lane-labels { display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-bottom:7px; }
.lane-labels div { font-family:var(--display); font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); text-align:center; }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:9px; }
.grid1 { display:grid; grid-template-columns:1fr; gap:9px; max-width:440px; }
.slot {
  display:flex; align-items:center; gap:11px; min-height:62px; padding:9px 12px;
  background:var(--asphalt-1); border:1.5px solid var(--line); border-radius:var(--r-sm); position:relative;
}
.grid2 .slot.outside { margin-top:20px; }
.slot.pole { border-color:var(--plate); box-shadow:0 0 0 1px var(--plate), 0 0 22px rgba(255,212,73,.13); }
.slot .who { min-width:0; flex:1; }
.slot .who b { display:block; font-size:14px; font-weight:650; line-height:1.2; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.slot .who span { font-size:11.5px; color:var(--muted); font-family:var(--display); font-weight:600; letter-spacing:.06em; text-transform:uppercase; }
.slot .spot { position:absolute; top:-8px; left:9px; background:var(--asphalt-0); color:var(--muted); font-family:var(--display); font-size:10.5px; font-weight:700; letter-spacing:.09em; padding:0 6px; border-radius:99px; text-transform:uppercase; }
.poletag { position:absolute; top:-9px; right:9px; background:var(--plate); color:var(--plate-ink); font-family:var(--display); font-size:10px; font-weight:800; letter-spacing:.09em; padding:2px 8px; border-radius:99px; text-transform:uppercase; }
.heat-cap { font-size:12px; color:var(--muted); margin:9px 0 0; }

/* Race blocks — heats, mains, feature */
.hb { border:1px solid var(--line); border-radius:var(--r); overflow:hidden; margin-bottom:14px; background:var(--asphalt-1); }
.hh {
  display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:11px 15px;
  background:var(--asphalt-2); border-bottom:1px solid var(--line);
  font-family:var(--display); font-size:15px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
}
.hh .push { margin-left:auto; }
/* Sub-labels inside a display-font header drop back to body type. */
.hh small { font-family:var(--body); font-weight:500; text-transform:none; letter-spacing:0; color:var(--muted); }
.hh.feat small { color:rgba(22,20,8,.72); }
.hh.bmain small,.hh.inv small { color:inherit; opacity:.8; }
.hh.inv   { background:var(--flag-amber-bg); color:var(--flag-amber-ink); }
.hh.bmain { background:var(--flag-green-bg); color:var(--flag-green-ink); }
.hh.feat  { background:var(--plate); color:var(--plate-ink); }
.hb .lrow { padding:8px 14px; min-height:52px; }
.transfer-tag { font-family:var(--display); font-size:10.5px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--flag-green-ink); background:var(--flag-green-bg); padding:2px 7px; border-radius:99px; }
.dnf-tag { font-family:var(--display); font-size:10.5px; font-weight:800; letter-spacing:.08em; color:var(--pit-red-ink); background:var(--pit-red-bg); padding:2px 7px; border-radius:99px; }

/* Governance strip */
.gov { display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:10px 14px; border:1px solid var(--line); border-radius:var(--r-sm); background:var(--asphalt-1); margin-bottom:14px; }

/* ============================================================================
   SHEETS / MODALS — one mechanism, bottom sheet on phones, centred on desktop
   ========================================================================= */
.ovl { position:fixed; inset:0; z-index:120; background:rgba(0,0,0,.72); backdrop-filter:blur(4px); display:none; align-items:flex-end; justify-content:center; padding:0; }
.ovl.on { display:flex; }
@media (min-width:700px) { .ovl { align-items:center; padding:24px; } }
.sheet {
  background:var(--asphalt-1); width:100%; max-width:560px; max-height:92dvh; overflow-y:auto;
  border:1px solid var(--line); border-radius:var(--r-xl) var(--r-xl) 0 0; box-shadow:var(--shadow);
  animation:sheetup .22s cubic-bezier(.2,.9,.3,1); padding-bottom:env(safe-area-inset-bottom);
}
@media (min-width:700px) { .sheet { border-radius:var(--r-lg); animation:sheetin .18s ease-out; } }
@keyframes sheetup { from { transform:translateY(28px); opacity:0; } }
@keyframes sheetin { from { transform:scale(.97); opacity:0; } }
.sheet-hd { display:flex; align-items:center; gap:12px; padding:16px 20px 12px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--asphalt-1); z-index:2; }
.sheet-hd h3 { flex:1; margin:0; }
.sheet-bd { padding:18px 20px; }
.sheet-ft { padding:14px 20px 20px; display:flex; gap:10px; flex-wrap:wrap; }
.sheet-ft .btn { flex:1; min-width:120px; }
.sheet-wide { max-width:880px; }
.x { background:none; border:none; color:var(--muted); font-size:26px; line-height:1; cursor:pointer; padding:4px 8px; border-radius:var(--r-xs); }
.x:hover { color:var(--ink); background:var(--asphalt-3); }

/* Toast */
.toast { position:fixed; left:50%; bottom:calc(78px + env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:200; background:var(--asphalt-3); color:var(--ink); border:1px solid var(--line); border-radius:99px; padding:11px 20px; font-size:14px; font-weight:600; box-shadow:var(--shadow); display:flex; align-items:center; gap:12px; animation:sheetup .2s; max-width:calc(100vw - 32px); }
@media (min-width:900px) { .toast { bottom:26px; } }
.toast.ok { border-color:var(--flag-green); }
.toast.err { border-color:var(--pit-red); }
.toast button { background:var(--plate); color:var(--plate-ink); border:none; border-radius:99px; padding:5px 13px; font:inherit; font-size:13px; font-weight:700; cursor:pointer; }

/* ============================================================================
   SIGN-UP
   ========================================================================= */
.sugg { display:flex; flex-direction:column; gap:6px; margin-top:8px; }
.sugg button { display:flex; align-items:center; gap:11px; width:100%; min-height:54px; padding:8px 12px; border:1px solid var(--line); border-radius:var(--r-sm); background:var(--asphalt-2); color:var(--ink); font:inherit; text-align:left; cursor:pointer; }
.sugg button:hover { border-color:var(--plate); background:var(--asphalt-3); }
.sugg .nm { flex:1; font-size:15px; font-weight:600; }
.sugg .nm small { display:block; font-size:12px; color:var(--muted); font-weight:500; }
.chips { display:flex; flex-wrap:wrap; gap:9px; }
.reveal { text-align:center; padding:12px 0 4px; }
.reveal-grid { display:flex; flex-wrap:wrap; gap:22px; justify-content:center; margin:20px 0 6px; }
.reveal-one { display:flex; flex-direction:column; align-items:center; gap:9px; }
.reveal-one .cls { font-family:var(--display); font-size:13px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); }

/* Kiosk — self-serve sign-up on a spare tablet */
body.kiosk .rail,body.kiosk .tabbar,body.kiosk .rc { display:none !important; }
body.kiosk .views { display:flex; align-items:flex-start; justify-content:center; padding-top:clamp(16px,4vh,54px); }
body.kiosk .wrap-narrow { max-width:600px; width:100%; }

/* ============================================================================
   SCORING — tap-order entry
   ========================================================================= */
.score-modes { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
.tapcard {
  display:flex; align-items:center; gap:11px; width:100%; min-height:60px; padding:9px 13px;
  border:1.5px solid var(--line); border-radius:var(--r-sm); background:var(--asphalt-2);
  color:var(--ink); font:inherit; text-align:left; cursor:pointer; transition:all .12s;
}
.tapcard:hover { border-color:var(--muted); }
.tapcard:active { transform:scale(.985); }
.tapcard.placed { background:var(--asphalt-1); border-color:var(--flag-green); }
.tapcard.placed .nm { color:var(--muted); }
.tapcard .nm { flex:1; min-width:0; font-size:14.5px; font-weight:600; }
.tapcard .nm small { display:block; font-size:11.5px; color:var(--muted); font-weight:500; }
.tapcard .assigned { font-family:var(--display); font-weight:800; font-size:20px; color:var(--flag-green); min-width:38px; text-align:center; }
.tapgrid { display:grid; gap:8px; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); }
.padin { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
.padin input { max-width:150px; font-family:var(--display); font-size:26px; font-weight:800; text-align:center; letter-spacing:.06em; min-height:58px; }
.fin-sel { min-height:38px; width:auto; min-width:82px; padding:6px 26px 6px 10px; font-size:14px; }
.fin-sel.set { border-color:var(--flag-green); color:var(--flag-green-ink); }

/* ============================================================================
   ADMIN — two doors and a search box, not a tile maze
   ========================================================================= */
.adm-search { position:relative; margin-bottom:18px; }
.adm-search input { padding-left:40px; }
.adm-search::before { content:'⌕'; position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:19px; pointer-events:none; }
.adm-results { display:grid; gap:7px; margin-top:10px; }
.adm-hit { display:flex; align-items:center; gap:11px; width:100%; padding:11px 14px; min-height:var(--tap); border:1px solid var(--line); border-radius:var(--r-sm); background:var(--asphalt-1); color:var(--ink); font:inherit; text-align:left; cursor:pointer; }
.adm-hit:hover { border-color:var(--plate); background:var(--asphalt-2); }
.adm-hit .nm { flex:1; font-size:14.5px; font-weight:600; }
.adm-hit .nm small { display:block; font-size:12px; color:var(--muted); font-weight:500; margin-top:1px; }
.adm-hit .where { font-family:var(--display); font-size:11px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); }
.secs { display:grid; gap:9px; grid-template-columns:repeat(auto-fill,minmax(238px,1fr)); }
.sec-btn { display:flex; align-items:flex-start; gap:12px; padding:15px 16px; min-height:78px; border:1px solid var(--line); border-radius:var(--r); background:var(--asphalt-1); color:var(--ink); font:inherit; text-align:left; cursor:pointer; transition:border-color .13s,background .13s; }
.sec-btn:hover { border-color:var(--plate); background:var(--asphalt-2); }
.sec-btn .ico { font-size:21px; line-height:1.1; flex:none; }
.sec-btn .nm { font-size:14.5px; font-weight:700; }
.sec-btn .nm small { display:block; font-size:12px; font-weight:500; color:var(--muted); margin-top:3px; line-height:1.4; }
.sec-btn.danger { border-color:#4d2320; }
.sec-btn.danger:hover { border-color:var(--pit-red); background:var(--pit-red-bg); }
.crumb { display:flex; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
.adm-sec { display:none; }
.adm-sec.on { display:block; }

/* ============================================================================
   SPECTATOR / FAN VIEW
   ========================================================================= */
.fan-hero { background:linear-gradient(150deg,var(--asphalt-2),var(--asphalt-1)); border:1px solid var(--line); border-radius:var(--r-lg); padding:20px; margin-bottom:16px; position:relative; overflow:hidden; }
.fan-hero::after { content:''; position:absolute; top:0; right:0; bottom:0; width:64px; opacity:.05; color:var(--ink); background-image:repeating-conic-gradient(currentColor 0% 25%, transparent 0% 50%); background-size:16px 16px; }
.fan-hero .eyebrow { font-family:var(--display); font-size:11.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--plate); margin-bottom:7px; }
.fan-hero h3 { font-size:clamp(21px,4.6vw,30px); margin-bottom:5px; }
.follow-strip { display:flex; align-items:center; gap:12px; padding:13px 16px; border:1px solid var(--plate); border-radius:var(--r); background:linear-gradient(100deg,rgba(255,212,73,.10),transparent 70%); margin-bottom:16px; }

/* ============================================================================
   DRIVER CARD
   ========================================================================= */
.dc { max-width:430px; }
.dc-hero { display:flex; align-items:center; gap:16px; padding:20px; border-bottom:1px solid var(--line); }
.dc-photo { width:76px; height:76px; border-radius:var(--r); object-fit:cover; background:var(--asphalt-3); flex:none; }
.dc-stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(72px,1fr)); gap:8px; padding:16px 20px; }
.dc-stat { background:var(--asphalt-2); border-radius:var(--r-sm); padding:11px 8px; text-align:center; }
.dc-stat .n { font-family:var(--display); font-weight:800; font-size:23px; color:var(--plate); line-height:1; }
.dc-stat .l { font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.07em; margin-top:5px; font-weight:600; }
.dc-rows { padding:2px 20px 18px; }
.dc-row { display:flex; gap:12px; padding:9px 0; border-bottom:1px solid var(--line-soft); font-size:13.5px; }
.dc-row:last-child { border-bottom:none; }
.dc-row b { color:var(--muted); font-weight:600; min-width:92px; }
.dc.prem .dc-hero { background:linear-gradient(115deg,var(--dc-team,var(--plate)) -30%,var(--asphalt-1) 62%); position:relative; overflow:hidden; }
.dc.prem .dc-hero::after { content:''; position:absolute; inset:0; background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.22) 50%,transparent 62%); animation:shine 3.4s ease-in-out infinite; }
@keyframes shine { 0%,72% { transform:translateX(-110%); } 100% { transform:translateX(110%); } }

/* ============================================================================
   MOTION
   ========================================================================= */
@media (prefers-reduced-motion:reduce) {
  *,*::before,*::after { animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
}
</style>
</head>
<body>

<div class="app" id="app">

  <!-- ===== LEFT RAIL (>=900px) ================================================= -->
  <aside class="rail" id="rail">
    <div class="rail-brand">
      <div class="brand">Race<em>Day</em></div>
      <div class="brand-sub" id="railSub">Race night</div>
    </div>
    <div id="railNav"></div>
    <div class="rail-foot">
      <div id="railState"></div>
      <button class="btn btn-sm btn-ghost" onclick="toggleTheme()" id="themeBtn" title="Switch between the dark race-night look and the daylight sign-up look">◐ Daylight</button>
    </div>
  </aside>

  <!-- ===== MAIN ================================================================ -->
  <div class="main">

    <header class="topbar">
      <div class="mob-brand">
        <div class="brand" style="font-size:20px">Race<em>Day</em></div>
      </div>
      <div class="topbar-track" id="topTrack"></div>
      <div class="topbar-right" id="topRight"></div>
    </header>

    <!-- Race Control: the spine. Phase, and the one next action. -->
    <div class="rc" id="raceControl" style="display:none">
      <div class="rc-steps" id="rcSteps"></div>
      <div class="rc-next" id="rcNext"></div>
    </div>

    <div id="banners" style="padding:0 var(--pad)"></div>

    <main class="views" id="views">

      <!-- ===== SIGN UP ===== -->
      <section class="view on" id="view-signup">
        <div class="wrap-narrow" id="signupWrap"></div>
      </section>

      <!-- ===== LINEUPS ===== -->
      <section class="view" id="view-grid">
        <div class="wrap" id="gridWrap"></div>
      </section>

      <!-- ===== RESULTS ===== -->
      <section class="view" id="view-results">
        <div class="wrap" id="resultsWrap"></div>
      </section>

      <!-- ===== POINTS ===== -->
      <section class="view" id="view-points">
        <div class="wrap-mid" id="pointsWrap"></div>
      </section>

      <!-- ===== ADMIN ===== -->
      <section class="view" id="view-admin">
        <div class="wrap" id="adminWrap"></div>
      </section>

      <!-- ===== GUIDE ===== -->
      <section class="view" id="view-help">
        <div class="wrap-mid" id="helpWrap"></div>
      </section>

      <!-- ===== LEGAL DOCS (reached from the footer, not the nav) ===== -->
      <section class="view" id="view-doc">
        <div class="wrap-mid" id="docWrap"></div>
      </section>

      <footer id="appFooter"></footer>
    </main>
  </div>

  <!-- ===== BOTTOM TAB BAR (<900px) ============================================ -->
  <nav class="tabbar" id="tabbar"></nav>
</div>

<!-- ===== ONE SHEET MECHANISM ==================================================
     v1 had a dozen hardcoded modal divs, each with its own show/hide helper.
     v2 renders every sheet through openSheet()/closeSheet() into this host.
     ========================================================================= -->
<div class="ovl" id="sheetHost" onclick="sheetBackdrop(event)">
  <div class="sheet" id="sheetBox" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-hd">
      <h3 id="sheetTitle"></h3>
      <button class="x" onclick="closeSheet()" aria-label="Close">×</button>
    </div>
    <div class="sheet-bd" id="sheetBody"></div>
    <div class="sheet-ft" id="sheetFoot"></div>
  </div>
</div>

<div id="toastHost"></div>

<!-- ===== TV DISPLAY ========================================================== -->
<div class="tv" id="tvOverlay" style="display:none"></div>

      const clean = sanitizeProfileCard(id, snap.val());
      if (!clean) { const e = new Error('no published card'); e.known = true; throw e; }
      d.profileId = id;
      d.profileCode = raw.toUpperCase();
      d.profile = clean;
      save();
      // Fire-and-forget: lets a driver's Driven app show "linked track: X" right away,
      // before any results exist. Never blocks/fails the link itself on a hiccup here —
      // shareResultsWithDriven() writes this same path again at publish time regardless.
      firebase.database().ref('profileTracks/' + id + '/' + S.track.id).set({ trackName: S.track.name || '', lastSeen: Date.now() }).catch(() => {});
      return d;
    })
  ).catch(err => {
    if (err && err.known) throw err;                    // bad/unknown code: don't pend
    d.profileCode = raw.toUpperCase();                  // network/SDK failure: retry later
    if (/^prof_[a-z0-9]{6,20}$/i.test(raw)) d.profileId = raw.toLowerCase();
    d.profile = Object.assign({ age: '', hometown: '', sponsors: '', teamColor: '', photo: '', premium: false },
                              d.profile, { source: 'profiles', pendingFetch: true });
    save();
    const e2 = new Error('pending'); e2.pending = true; throw e2;
  });
}
function retryPendingProfiles() {
  (S.roster || []).forEach(d => {
    if (d.profile && d.profile.pendingFetch && (d.profileId || d.profileCode)) {
      linkProfile(d.id, d.profileId || d.profileCode)
        .then(() => { if (driverCardId === d.id) renderDriverCard(); })
        .catch(() => {});
    }
  });
}
function initSync() {
  if (!syncOn() || !syncKey()) return;
  loadFirebase().then(() => {
    try {
      if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
      if (Sync.db) { try { Sync.db.off(); } catch (e) {} }
      Sync.db = firebase.database().ref('tracks/' + syncKey());
      firebase.database().ref('.info/connected').on('value', snap => { Sync.connected = !!snap.val(); renderHeader(); }, () => {});
      SYNC_FIELDS.forEach(f => { _syncLast[f] = JSON.stringify(syncGet(f) === undefined ? null : syncGet(f)); });
      Sync.db.on('value', snap => {
        const v = snap.val();
        if (!v || Sync.activating) { Sync.activating = false; syncPushFull(); return; }  // empty room or admin re-activating: push local state, don't pull stale Firebase data
        syncApplySnapshot(v);
      });
    } catch (e) { console.warn('RaceDay sync init:', e && e.message || e); }
  }).catch(e => console.warn('RaceDay sync:', e && e.message || e));
}
function syncApplySnapshot(v) {
  if (!v) return;
  const wasViewer = deviceRole() === 'viewer';
  const prevFin = wasViewer ? JSON.stringify(S.classes.map(c => featureFinish(c.id))) : null;
  const prevTrackName = S.track && S.track.name;
  const prevTrackLogo = S.track && S.track.logo;
  Sync.applying = true;
  SYNC_FIELDS.forEach(f => {
    const raw = syncGetIn(v, f);
    if (raw == null) return;
    try { const parsed = JSON.parse(raw); syncSet(f, parsed); _syncLast[f] = raw; } catch (e) {}
  });
  Sync.applying = false;
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}  // intentional: bypasses save() to prevent sync echo loop
  renderHeader(); render(curPage); if (TV.on) tvRender();
  if (wasViewer && prevFin !== null && JSON.stringify(S.classes.map(c => featureFinish(c.id))) !== prevFin) {
    showViewerToast();
  }
  // Only alert when a DISTINCT existing identity was silently replaced — skip a fresh
  // device's first join (prevTrackName empty), which is normal, not a surprise overwrite.
  if (prevTrackName && (prevTrackName !== S.track.name || prevTrackLogo !== S.track.logo)) {
    showTrackSyncToast();
  }
}
function syncPush() {
  if (deviceRole() === 'viewer' || operatorWatching()) return;   // spectators + watching operators never write to the shared room
  if (!syncOn() || !Sync.db || Sync.applying) return;
  clearTimeout(Sync.timer);
  Sync.timer = setTimeout(() => {
    const upd = {};
    SYNC_FIELDS.forEach(f => {
      const j = JSON.stringify(syncGet(f) === undefined ? null : syncGet(f));
      if (j !== _syncLast[f]) { upd[f] = j; _syncLast[f] = j; }
    });
    if (Object.keys(upd).length && Sync.db) Sync.db.update(upd).catch(e => console.warn('RaceDay sync:', e && e.message || e));
  }, 400);
}
function syncPushFull() {
  if (deviceRole() === 'viewer' || operatorWatching() || !Sync.db) return;   // spectators + watching operators never seed/write the room
  const upd = {};
  SYNC_FIELDS.forEach(f => { const j = JSON.stringify(syncGet(f) === undefined ? null : syncGet(f)); upd[f] = j; _syncLast[f] = j; });
  Sync.db.update(upd).catch(e => console.warn('RaceDay sync:', e && e.message || e));
}
function syncActivate() {
  if (!FIREBASE_CONFIG.apiKey) { alert('Live sync is not set up on this build yet — the app owner adds the Firebase settings once to turn it on.'); return; }
  // Keep an existing code as-is (devices/QR posters already use it); only suggest a
  // fresh code for a brand-new setup, with a random suffix so two tracks can't collide
  // in the same cloud room (e.g. two "Victory" tracks both landing in tracks/VICTORY).
  const existing = normKey(S.sync.key || '');
  const rand = Math.random().toString(36).replace(/[^a-z0-9]/g, '').slice(0, 3).toUpperCase();
  const seed = existing || (normKey((S.license && S.license.name) || 'TRACK') + rand);
  const k = prompt('Choose a sync code for this track. Every device for this track uses the SAME code — keep it unique so no other track lands in the same room:', seed);
  if (!k) return;
  S.sync.key = normKey(k);
  S.sync.enabled = true;
  setDeviceRole('admin');
  Sync.activating = true;   // admin owns the room: push local state, ignore whatever Firebase has
  save();
  initSync();
  renderSyncCard();
}
function syncJoin() {
  if (!FIREBASE_CONFIG.apiKey) { alert('Live sync is not set up on this build yet.'); return; }
  const k = prompt('Enter the track sync code shown on the main (admin) device:');
  if (!k) return;
  // Joining pulls the cloud copy over this device — warn if real local data is at stake.
  if (S.raceDay.entries && S.raceDay.entries.length && !confirm('Joining code "' + normKey(k) + '" will replace this device\'s current entries and results with the cloud copy. Continue?')) return;
  S.sync.key = normKey(k);
  S.sync.enabled = true;
  save();
  initSync();
  renderSyncCard();
}
function syncMakeSource() {
  if (!syncOn() || !Sync.db) { alert('Turn on Multi-device sync first.'); return; }
  if (deviceRole() === 'viewer') { alert('Spectator devices can\'t change the shared race.'); return; }
  if (!confirm('Push THIS device\'s race data to the cloud, replacing what every other synced device is showing?\n\nUse this when another device pulled old data from a reused code — this device becomes the source of truth.')) return;
  syncPushFull();
  flashMsg('This device is now the source of truth ✓');
}
function syncDisable() {
  if (!confirm('Turn off live sync on this device? It will go back to working on its own. The track\'s synced data stays in the cloud.')) return;
  if (Sync.db) { try { Sync.db.off(); } catch (e) {} Sync.db = null; }
  Sync.connected = false;
  S.sync.enabled = false;
  save();
  renderSyncCard();
}

/* ============================================================================
   §1e  ENGINE — snapshots, archive, CSV, backup & cloud backup (verbatim)
   ========================================================================= */
function buildSnapshot() {
  const snap = {
    date: S.raceDay.date, savedAt: Date.now(), classes: [],
    published: false, publishedAt: 0,   // set by shareResultsWithDriven() once sent
    // raw driver/class pairs so a later race day can re-enter the same field
    pairs: S.raceDay.entries.map(e => ({ driverId: e.driverId, classId: e.classId, className: (classById(e.classId) || {}).name }))
  };
  S.classes.forEach(cls => {
    const standings = calcStandings(cls.id);
    if (!standings.length) return;
    const fd = featureData(cls.id);
    const dp = dayPoints(cls.id);
    snap.classes.push({
      name: cls.name,
      standings: standings.map((s, i) => ({ pos: i + 1, name: s.name, num: s.num, pill: s.pill, f1: s.f1 != null ? s.f1 : '', f2: s.f2 != null ? s.f2 : '', pts: s.scored ? s.pts : '' })),
      feature: featureGridOrder(fd, cls.id).map(s => ({ name: s.name, num: s.num })),
      featureFinish: featureFinish(cls.id).map(f => ({ driverId: f.id, name: f.name, num: f.num, fin: f.fin })),
      pointsRace: isPointsRace(cls.id),
      // dayPoints drops noPoints drivers from dp, so filtering on dp[r.id] != null keeps
      // them out of the archived points entirely (they never score history). A genuine
      // last-place scorer keeps pts 0 (beyond), since 0 != null.
      points: dp ? classRacers(cls.id).filter(r => dp[r.id] != null).map(r => ({ driverId: r.id, name: r.name, num: r.num, pts: dp[r.id] })) : null
    });
  });
  return snap;
}
function archiveDay() {
  const snap = buildSnapshot();
  if (!snap.classes.length) return true;   // nothing to archive
  // Warn when a points class's feature isn't fully entered — those points silently never
  // count in the series. Same completeness rule as the points toggle: any stored feature
  // value (a DNF/DNS/DQ string too) counts as entered.
  const incomplete = [];
  S.classes.forEach(cls => {
    if (!isPointsRace(cls.id)) return;
    const fd = featureData(cls.id);
    const field = [...fd.locked, ...fd.transferred];
    if (!field.length) return;
    const res = getRes(cls.id);
    const entered = field.filter(r => res['ft_' + r.id] != null).length;
    if (entered < field.length) incomplete.push(cls.name + (entered ? ' (' + entered + ' of ' + field.length + ' finishes)' : ' (no feature finishes)'));
  });
  if (incomplete.length && !confirm('⚠ Feature not fully entered:\n' + incomplete.join('\n') + '\n\nPoints for those classes won\'t count in the series.\n\nOK = archive anyway · Cancel = go back and finish results')) return false;
  S.history.unshift(snap);
  if (S.history.length > 60) S.history.length = 60;
  scheduleUsageBeacon();
  return true;
}
function shareableCount(snap) {
  let n = 0;
  (snap.classes || []).forEach(cls => (cls.featureFinish || []).forEach(f => { const d = driverById(f.driverId); if (d && d.profileId) n++; }));
  return n;
}
function shareResultsWithDriven(idx) {
  const snap = S.history[idx];
  if (!snap) return;
  const trackId = S.track.id, trackName = S.track.name || '';
  const rows = [];
  snap.classes.forEach(cls => {
    const clsKey = fbKey(cls.name);
    (cls.featureFinish || []).forEach(f => {
      const d = driverById(f.driverId);
      if (!d || !d.profileId) return;
      const pointsRow = (cls.points || []).find(p => p.driverId === f.driverId);
      const payload = { profileId: d.profileId, name: f.name, num: f.num || '', position: f.fin, trackName: trackName };
      if (pointsRow) payload.points = pointsRow.pts;
      rows.push({ profileId: d.profileId, path: 'results/' + trackId + '/' + snap.date + '/' + clsKey + '/' + f.driverId, payload });
    });
  });
  if (!rows.length) { alert('No drivers with a linked Driven profile in this race day — nothing to share.'); return; }
  // Demo sessions never touch the real Firebase project — the fake profileIds here
  // don't correspond to anything real, and a demo visitor clicking this for real would
  // otherwise write junk to production under a made-up track/profile every time.
  if (S.demo) {
    snap.published = true; snap.publishedAt = Date.now();
    save();
    renderResultsShareBanner();
    alert('✅ Results shared — ' + rows.length + ' driver' + (rows.length === 1 ? '' : 's') + ' will see tonight\'s results in Driven.');
    return;
  }
  ensureFirebase().then(() => {
    const db = firebase.database();
    return Promise.all(rows.map(r => db.ref(r.path).set(r.payload)
      .then(() => db.ref('profileTracks/' + r.profileId + '/' + trackId).set({ trackName: trackName, lastSeen: Date.now() }))));
  }).then(() => {
    snap.published = true; snap.publishedAt = Date.now();
    save();
    renderResultsShareBanner();
    alert('✅ Results shared — ' + rows.length + ' driver' + (rows.length === 1 ? '' : 's') + ' will see tonight\'s results in Driven.');
  }).catch(() => {
    alert("Couldn't reach Driven — check your connection and try again. Nothing was lost; you can share from Race day history anytime.");
  });
}
function csvCell(v) { v = String(v == null ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
function csvRows(rows) { return rows.map(r => r.map(csvCell).join(',')).join('\n'); }
function downloadFile(name, content, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], { type }));
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function snapCSV(hd) {
  const rows = [['Class', 'Pos', 'Driver', 'Vehicle #', 'Pill', 'Heat 1', 'Heat 2', 'Total']];
  hd.classes.forEach(c => c.standings.forEach(s => rows.push([c.name, s.pos, s.name, s.num, s.pill, s.f1, s.f2, s.pts])));
  return csvRows(rows);
}
function exportResultsCSV() {
  const snap = buildSnapshot();
  if (!snap.classes.length) { alert('No entries to export yet.'); return; }
  downloadFile('raceday-results-' + snap.date + '.csv', snapCSV(snap), 'text/csv');
}
function exportEntriesCSV() {
  if (!S.raceDay.entries.length) { alert('No entries to export yet.'); return; }
  const rows = [['Driver', 'Vehicle #', 'Class', 'Pill']];
  [...S.raceDay.entries]
    .map(e => {
      const d = driverById(e.driverId) || { name: '?', num: '?' };
      const c = classById(e.classId) || { name: '?' };
      return [d.name, d.num, c.name, e.pill];
    })
    .sort((a, b) => a[2].localeCompare(b[2]) || a[3] - b[3])
    .forEach(r => rows.push(r));
  downloadFile('raceday-entries-' + S.raceDay.date + '.csv', csvRows(rows), 'text/csv');
}
function exportBackup() {
  downloadFile('raceday-backup-' + today() + '.json', JSON.stringify(S, null, 2), 'application/json');
  S.lastBackupAt = Date.now();
  save();
  renderBackupBanner();
}
const CLOUD_BACKUP_FIELDS = ['track', 'provider', 'classes', 'classLib', 'roster', 'raceDay', 'history', 'settings', 'nextId', 'schemaVersion'];
function cloudBackupPayload() {
  const out = {};
  CLOUD_BACKUP_FIELDS.forEach(f => { if (S[f] !== undefined) out[f] = S[f]; });
  // settings carries the consent toggles but not the consent records; strip the cloud
  // flag itself so a restore never silently re-enables uploading on another device.
  if (out.settings) { out.settings = Object.assign({}, out.settings); delete out.settings.cloudBackup; }
  return out;
}
function cloudBackupOn() { return !!(S.settings && S.settings.cloudBackup); }
function backupToCloud(reason) {
  if (!cloudBackupOn() || S.demo || !FIREBASE_CONFIG.apiKey) return Promise.resolve(false);
  if (deviceRole() === 'viewer') return Promise.resolve(false);   // spectator devices never upload
  if (!S.track.id) { S.track.id = genTrackId(); save(); }
  const rec = {
    at: Date.now(),
    trackName: (S.track.name || '').slice(0, 60),
    schemaVersion: S.schemaVersion || 0,
    data: JSON.stringify(cloudBackupPayload())
  };
  if (rec.data.length > 5000000) { console.warn('RaceDay cloud backup: payload too large, skipped'); return Promise.resolve(false); }
  return ensureFirebase().then(() => {
    const base = 'trackBackups/' + S.track.id;
    // The vault is write-only, so the client can't list keys to prune — an owner-side
    // scheduled function (pruneOldBackups in functions/index.js) does that instead, and
    // needs a cheap way to enumerate track ids without downloading every track's backup
    // data just to find them. backupTracks is that index: booleans only, trivial to
    // read in full at any scale. `latest` is overwritten every time (bounded); `daily`
    // adds one dated record per backup, which is what the prune job trims.
    return Promise.all([
      firebase.database().ref(base + '/latest').set(rec),
      firebase.database().ref(base + '/daily/' + today()).set(rec),
      firebase.database().ref('backupTracks/' + S.track.id).set(true)
    ]);
  }).then(() => {
    S.lastCloudBackupAt = rec.at;
    save();
    renderCloudBackupCard();
    return true;
  }).catch(e => { console.warn('RaceDay cloud backup:', e && e.message || e); return false; });
}
function toggleCloudBackup(el) {
  if (!adminOk()) { el.checked = cloudBackupOn(); return; }
  if (el.checked) {
    if (!confirm('Back this track up to RaceDay\'s servers?\n\nWhat gets sent: your classes, driver book (names, car numbers, and any photos), lineups, results, and season history.\n\nWhat is NEVER sent: your admin PIN, your license code, and the sign-up consent records.\n\nYou can turn this off at any time.')) { el.checked = false; return; }
  }
  S.settings.cloudBackup = el.checked;
  logAudit(el.checked ? 'Enabled cloud backup' : 'Disabled cloud backup', S.track.name || '', '', '');
  save();
  renderCloudBackupCard();
  if (el.checked) backupToCloud('enabled');
}
function backupToCloudNow() {
  if (!adminOk()) return;
  if (!cloudBackupOn()) { alert('Turn on "Back up this track to RaceDay\'s servers" first.'); return; }
  const btn = document.getElementById('cloudBackupBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Backing up…'; }
  backupToCloud('manual').then(ok => {
    if (btn) { btn.disabled = false; btn.textContent = '☁ Back up now'; }
    if (!ok) alert('Couldn\'t reach the backup server just now. Your data is safe on this device — it will back up automatically next time you start a new race day while online.');
    renderCloudBackupCard();
  });
}
function importBackup(input) {
  const f = input.files && input.files[0];
  input.value = '';
  if (!f) return;
  const fr = new FileReader();
  fr.onload = () => {
    let s;
    try { s = JSON.parse(fr.result); } catch (e) { alert("That file isn't a RaceDay backup."); return; }
    applyRestoredState(s, 'this backup');
  };
  fr.readAsText(f);
}
function applyRestoredState(s, label) {
  if (!s || !s.raceDay || !s.classes) { alert("That file isn't a RaceDay backup."); return false; }
  if (!confirm('Restore ' + label + '? The race data (drivers, classes, lineups, results, history) will be replaced.\n\nThis device keeps its OWN license and trial — a backup never transfers a license.')) return false;
  // License, trial days, and packet usage belong to THIS device, not the backup file.
  // A backup shared between people must never carry one track's license onto another's
  // device, so we preserve the importing device's own identity (mirrors resetAll's keep).
  // PINs come along the same way: a cloud payload has none, so keep the device's own.
  const keep = { license: S.license, trialDays: S.trialDays, licUse: S.licUse,
                 adminPin: S.adminPin, operatorPin: S.operatorPin };
  S = migrate(s);
  S.license = keep.license;
  S.trialDays = keep.trialDays;
  S.licUse = keep.licUse;
  // Falsy, not null: migrate() backfills a missing PIN to '', and '' means "Admin is open
  // to everyone" (adminOk). A cloud payload never carries PINs, so a == null check here
  // would silently strip the device's admin PIN on every cloud restore.
  if (!S.adminPin) S.adminPin = keep.adminPin;
  if (!S.operatorPin) S.operatorPin = keep.operatorPin;
  save();
  renderHeader();
  resetReg();
  renderLicCard(); renderLicBanner();
  render(curPage);
  return true;
}
function restoreFromCloudCode() {
  if (!adminOk()) return;
  const inp = document.getElementById('cloudRestoreCode');
  const code = ((inp && inp.value) || '').trim().toUpperCase();
  if (!code) { alert('Enter the restore code you were given.'); return; }
  if (!/^[A-Z0-9-]{4,40}$/.test(code)) { alert('That doesn\'t look like a restore code.'); return; }
  if (!FIREBASE_CONFIG.apiKey) { alert('Cloud restore is not set up on this build.'); return; }
  const btn = document.getElementById('cloudRestoreBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Checking…'; }
  const done = () => { if (btn) { btn.disabled = false; btn.textContent = 'Restore'; } };
  ensureFirebase()
    .then(() => firebase.database().ref('restores/' + code).once('value'))
    .then(snap => {
      done();
      const rec = snap.val();
      if (!rec) { alert('No backup found for that code. Check it with whoever gave it to you — codes are one per restore and can expire.'); return; }
      let s = null;
      try { s = typeof rec.data === 'string' ? JSON.parse(rec.data) : rec.data; } catch (e) { s = null; }
      if (!s) { alert('That backup couldn\'t be read.'); return; }
      const when = rec.at ? new Date(rec.at).toLocaleDateString() : 'an earlier date';
      if (applyRestoredState(s, 'the backup of ' + (rec.trackName || 'this track') + ' from ' + when)) {
        if (inp) inp.value = '';
        alert('Restored. Check your classes, driver book, and history look right before running a night.');
      }
    })
    .catch(e => { done(); alert('Couldn\'t reach the restore server. Check your connection and try again.'); console.warn('RaceDay cloud restore:', e && e.message || e); });
}
function downloadCSV(name, rows) {
  const csv = rows.map(r => r.map(csvCell).join(',')).join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function exportConsentsCSV() {
  const rows = [['Date', 'Time', 'Driver', 'Number', 'Role', 'IP', 'Accepted', 'Terms version', 'App version']];
  (S.consents || []).forEach(c => rows.push([c.date, c.time, c.driver, c.num, c.role, c.ip, c.accepted ? 'yes' : 'no', c.legalVersion || '', c.version || '']));
  downloadCSV('raceday-acceptances-' + today() + '.csv', rows);
}
function exportAuditCSV() {
  const rows = [['Date', 'Time', 'User', 'Action', 'Target', 'Original value', 'New value']];
  (S.audit || []).forEach(a => rows.push([a.date, a.time, a.user, a.action, a.target, a.oldValue, a.newValue]));
  downloadCSV('raceday-audit-' + today() + '.csv', rows);

/* ============================================================================
   §1f  ENGINE — roles, URL links, operator mode, race-day lifecycle (verbatim)
   ========================================================================= */
function newRaceDay() {
  if (!adminOk()) return;
  if (S.raceDay.entries.length || Object.keys(S.raceDay.heatResults).length) {
    if (!confirm("Start a new race day? Today's entries and results are archived to Race day history, then the board is cleared. The driver book and classes are kept.")) return;
    if (confirm('Back up first? This downloads a file with the whole season — driver book, history, and points. Recommended at the end of each night.\n\nOK = download a backup now · Cancel = skip and continue.')) {
      exportBackup();
    }
  }
  const histLenBefore = S.history.length;
  if (!archiveDay()) return;   // cancelled at the incomplete-points warning — keep the board
  const justArchived = S.history.length > histLenBefore ? 0 : -1;   // unshift() puts it at index 0
  logAudit('Started new race day', S.raceDay.date, today(), 'Race day');
  resOverride = {};
  S.raceDay = { date: today(), entries: [], heatResults: {}, pointsRace: {}, resultGov: {}, resultVersions: {} };
  save();
  resetReg();
  render(curPage);
  // Fire-and-forget, after the board is already cleared and saved — a backup failure
  // (offline is normal at a track) must never interrupt or undo starting the night.
  backupToCloud('archive');
  if (justArchived === 0) maybePromptShareResults(0);
}
function maybePromptShareResults(idx) {
  const snap = S.history[idx];
  if (!snap) return;
  const n = shareableCount(snap);
  if (!n) return;
  if (confirm('Share tonight\'s results with Driven? ' + n + ' driver' + (n === 1 ? '' : 's') + ' with a linked profile will see today\'s results.\n\nOK = share now · Cancel = remind me later')) {

function handleUrlParams() {
  try {
    const q = new URLSearchParams(location.search);
    let role = q.get('role');
    const sk = q.get('sync');
    const dm = q.get('demo');
    // Demo mode only ever fires for a genuinely fresh, standalone admin device with no
    // real join link in the same URL — a real ?sync=/?role= link always wins, so a demo
    // link can never accidentally hijack someone actually joining a track. Own
    // idempotency flag (not rd_url_applied, which is keyed to exact location.search)
    // so relaunching from a saved/home-screen URL doesn't reseed the demo every time.
    const freshDevice = !S.track.name
      && !(S.roster && S.roster.length)
      && !(S.raceDay && S.raceDay.entries && S.raceDay.entries.length)
      && !(S.history && S.history.length);
    if (dm && !role && !sk && freshDevice && deviceRole() === 'admin' && !(S.sync && S.sync.enabled)) {
      let demoApplied = null;
      try { demoApplied = localStorage.getItem('rd_demo_applied'); } catch (e) {}
      if (location.search !== demoApplied) {
        seedFullDemoNight();
        try { localStorage.setItem('rd_demo_applied', location.search); } catch (e) {}
      }
      history.replaceState({}, '', location.pathname);
      return;
    }
    if (!role && !sk) return;
    // Operator role requires the build-time OPERATOR_KEY as a URL param (?opk=...) — a
    // guessed/leaked ?role=operator link with no matching key is inert, same deterrent
    // model as the license salt. Falling through with role=null lets sync (if present)
    // still apply below without granting the operator role itself.
    if (role === 'operator' && q.get('opk') !== OPERATOR_KEY) role = null;
    let applied = null;
    try { applied = localStorage.getItem('rd_url_applied'); } catch (e) {}
    if (location.search === applied) { history.replaceState({}, '', location.pathname); return; }
    // A privileged role (anything but the public viewer) requested BY URL on a device
    // that is currently the public spectator (viewer) must be authenticated first — the
    // spectator link is public (printed on the QR poster) and differs from a staff link
    // only by the role= value, so without this a fan could edit their own link to
    // role=scoring/admin and become a WRITING member of the live race. Staff devices
    // are provisioned from a fresh/default ('admin') local role, so they never hit this
    // challenge — only a device that already scanned the spectator QR does. If the
    // challenge fails, we do NOT mark the link consumed, so a legit admin can retry.
    if (role && role !== 'viewer' && deviceRole() === 'viewer') {
      if (S.adminPin) {
        const t = prompt('This link makes this device a "' + role + '" station (it can change the live race). Enter the admin PIN to allow it:');
        if (t === null || pinHash(t) !== S.adminPin) { if (t !== null) alert('Wrong PIN — this device stays a spectator view.'); history.replaceState({}, '', location.pathname); return; }
      } else if (!confirm('This link makes this device a "' + role + '" station that can change the live race. The track hasn\'t set an admin PIN, so anyone with this link can do this. Continue?')) {
        history.replaceState({}, '', location.pathname); return;
      }
    }
    if (sk) {
      const incoming = normKey(sk);
      // "Real local setup" = anything the track configured on THIS device that a blind
      // cloud pull would wipe: entries, the driver book, or a named track. Checking only
      // entries missed the case where classes/roster/track were set up but sign-up hadn't
      // started yet — that state was being silently overwritten with no warning.
      const hasLocal = (S.raceDay.entries && S.raceDay.entries.length > 0)
        || (S.roster && S.roster.length > 0)
        || !!(S.track && S.track.name);
      const diff = incoming !== normKey(S.sync.key || '');
      // A QR / share link silently REPLACES this device's race with the cloud copy.
      // Warn before clobbering real local data (the demo-test / stale-pull footgun).
      if (hasLocal && diff && !confirm('This link connects this device to the shared race for code "' + incoming + '".\n\nThis device\'s current entries, driver book, classes and results will be REPLACED by the cloud copy. Continue?')) {
        history.replaceState({}, '', location.pathname);
        return;
      }
      S.sync.key = incoming; S.sync.enabled = true;

    // Mark this exact link consumed only AFTER it fully applied, so an iOS home-screen
    // relaunch from the saved URL won't re-apply it — but a link the user cancelled at
    // any prompt above is NOT recorded, leaving it retryable.
    try { localStorage.setItem('rd_url_applied', location.search); } catch (e) {}

const NAV = [

/* Pages this device's role is allowed to see, in NAV order. */
function allowedPages() {
  const allow = ROLE_PAGES[deviceRole()] || ROLE_PAGES.admin;

/* ---------------------------------------------------------------- navigation */
function nav(p) {
  const ok = allowedPages().map(n => n.id);

  curPage = p;
  document.querySelectorAll('.view').forEach(v => v.classList.remove('on'));

  if (el) el.classList.add('on');

  render(p);
  renderRaceControl();

}

function render(p) {
  if (p === 'signup')  return renderSignup();
  if (p === 'grid')    return renderGrid();
  if (p === 'results') return renderResults();
  if (p === 'points')  return renderPoints();
  if (p === 'admin')   return renderAdmin();

/* ------------------------------------------------------------- Race Control */
/* The phase is derived from state that already exists — no new stored fields.  */
const PHASES = [
  { key:'signup',  lbl:'Sign-up' },
  { key:'heats',   lbl:'Heats' },
  { key:'mains',   lbl:'B-mains' },
  { key:'feature', lbl:'Features' },
  { key:'archive', lbl:'Archive' }
];

/* Per-class progress, used by both the spine and the "what's left" counts. */
function classProgress(clsId) {
  const cls = classById(clsId);
  const racers = classRacers(clsId);
  if (!racers.length) return null;
  const heatsDone = classHeats(cls) === 0 ? true : classComplete(clsId);
  const fd = heatsDone ? featureData(clsId) : null;
  const res = getRes(clsId);
  /* fd.mains is [{label, drivers, key, feeds, made}] — key is the index bmKey() wants. */
  let mainsDone = true;
  if (fd && fd.mains && fd.mains.length) {
    mainsDone = fd.mains.every(m => m.drivers.every(d => res[bmKey(m.key, d.id)] != null));
  }
  const feat = heatsDone ? featureFinish(clsId) : {};
  const featStarters = fd ? featureGridOrder(fd, clsId).length : 0;
  const featDone = featStarters > 0 && Object.keys(feat).length >= featStarters;
  return { cls: cls, racers: racers, heatsDone: heatsDone, mainsDone: mainsDone,
           hasMains: !!(fd && fd.mains && fd.mains.length), featDone: featDone, featStarters: featStarters };
}

function nightPhase() {
  const withEntries = S.classes.filter(c => classRacers(c.id).length);
  if (!S.classes.length) return { key:'signup', note:'Add your race classes in Admin before sign-ups open.', cta:null };
  if (!withEntries.length) return { key:'signup', note:'No drivers signed up yet.', cta:{ label:'Open sign-up', fn:"nav('signup')" } };

  const prog = withEntries.map(c => classProgress(c.id)).filter(Boolean);
  const heatsLeft = prog.filter(p => !p.heatsDone).length;
  if (heatsLeft) return { key:'heats',
    note: heatsLeft + ' of ' + prog.length + ' ' + (prog.length === 1 ? 'class' : 'classes') + ' still need heat finishes.',
    cta:{ label:'Enter results', fn:"nav('results')" } };

  const mainsLeft = prog.filter(p => p.hasMains && !p.mainsDone).length;
  if (mainsLeft) return { key:'mains', note: mainsLeft + ' B-main ' + (mainsLeft === 1 ? 'class' : 'classes') + ' left to score.',
    cta:{ label:'Enter results', fn:"nav('results')" } };

  const featLeft = prog.filter(p => !p.featDone).length;
  if (featLeft) return { key:'feature', note: featLeft + ' feature ' + (featLeft === 1 ? 'race' : 'races') + ' left to score.',
    cta:{ label:'Enter results', fn:"nav('results')" } };

  return { key:'archive', note:'Every feature is scored — the night is complete.',
    cta:{ label:'🏁 Archive & start next race day', fn:'newRaceDay()' } };
}

function renderRaceControl() {
  const bar = document.getElementById('raceControl');
  const role = deviceRole();
  /* Spectators and TV don't run the night; the spine is operator furniture. */
  if (role === 'viewer' || role === 'tv' || curPage === 'help' || curPage === 'doc') { bar.style.display = 'none'; return; }
  bar.style.display = '';

  const ph = nightPhase();
  const at = PHASES.findIndex(p => p.key === ph.key);
  document.getElementById('rcSteps').innerHTML = PHASES.map((p, i) =>
    '<div class="rc-step ' + (i < at ? 'done' : i === at ? 'now' : '') + '">'
    + '<div class="bar"></div><div class="lbl">' + esc(p.lbl) + '</div></div>').join('');

  document.getElementById('rcNext').innerHTML =
    '<span class="txt"><b>' + esc(PHASES[at] ? PHASES[at].lbl : '') + '</b> · ' + esc(ph.note) + '</span>'
    + (ph.cta ? '<button class="btn btn-sm btn-primary" onclick="' + ph.cta.fn + '">' + esc(ph.cta.label) + '</button>' : '');
}

function backupBannerHtml() {
  if (deviceRole() !== 'admin' || S.demo) return '';
  if (!S.history || S.history.length < 2) return '';
  const days = S.lastBackupAt ? Math.floor((Date.now() - S.lastBackupAt) / 86400000) : 999;
  if (days < 30) return '';
  return '<div class="banner note note-warn">'

}

/* ============================================================================
   §1h  ENGINE — scoring, qualifying times, grid style (verbatim)
   ========================================================================= */
function setGridStyle(s) { S.settings.gridStyle = s; save(); renderGrid(); }
function setViewClass(id) { UI.viewClsId = parseInt(id, 10) || null; renderGrid(); }
function setViewStage(s) { UI.viewStage = s; renderGrid(); }
let _qtClsId = null;
function qtEntry(clsId, driverId) { return S.raceDay.entries.find(e => e.classId === clsId && e.driverId === driverId); }
function qtCollect() {
  const rows = [];
  document.querySelectorAll('#qtBody input[data-id]').forEach(inp => {
    const raw = inp.value.trim();
    rows.push({ id: parseInt(inp.getAttribute('data-id'), 10), raw, t: raw ? impParseLapTime(raw) : Infinity });
  });
  return rows;
}
function qtOrder() {
  const rows = qtCollect();
  const pillOf = {}; classRacers(_qtClsId).forEach(r => pillOf[r.id] = r.pill);
  const timed = rows.filter(r => r.t !== Infinity).sort((a, b) => a.t - b.t);
  const untimed = rows.filter(r => r.t === Infinity).sort((a, b) => pillOf[a.id] - pillOf[b.id]);
  return [...timed, ...untimed];
}
function saveQualTimes() {
  if (!adminOk()) return;
  qtCollect().forEach(r => {
    const e = qtEntry(_qtClsId, r.id); if (!e) return;
    if (r.raw && r.t !== Infinity) e.qualTime = r.raw; else delete e.qualTime;
  });
  save();
  renderGrid();
  if (typeof flashMsg === 'function') flashMsg('Qualifying times saved.');
  renderQtBody();
}
function applyQualGrid() {
  if (!adminOk()) return;
  const order = qtOrder();
  const timed = order.filter(r => r.t !== Infinity).length;
  if (!timed) { alert('Enter at least one qualifying time first.'); return; }
  if (!confirm('Set the ' + classById(_qtClsId).name + ' starting grid from these times?\n\nFastest goes to pole — this replaces the current order.')) return;
  order.forEach((r, i) => {
    const e = qtEntry(_qtClsId, r.id); if (!e) return;
    e.pill = i + 1;
    delete e.heat;   // grid purely from qualifying order, like the timing import
    if (r.raw && r.t !== Infinity) e.qualTime = r.raw; else delete e.qualTime;
  });
  logAudit('Grid set from qualifying times', '', timed + ' timed', classById(_qtClsId).name);
  save();
  renderGrid();
  if (typeof flashMsg === 'function') flashMsg('Grid set from qualifying times ✓');
  closeQualTimes();
}
function saveResult(clsId, rk, val) {
  const res = getRes(clsId);
  if (resLocked(clsId)) {
    alert('Results for ' + classById(clsId).name + ' are locked.\n\nAn admin can tap “Override” on the Results page to edit, or “Unlock”.');
    renderClassResults(clsId);   // revert the field to the stored value
    return;
  }
  const old = res[rk];
  if (val === '' || val == null) delete res[rk];
  else if (val === 'DNF' || val === 'DNS' || val === 'DQ') res[rk] = val;
  else { const n = parseInt(val); if (n > 0) res[rk] = n; else delete res[rk]; }
  const now = res[rk];
  if (String(old == null ? '' : old) !== String(now == null ? '' : now)) {
    logAudit(resOverride[resKey(clsId)] ? 'Result edit (override)' : 'Result edit',
      old == null ? '(blank)' : old, now == null ? '(blank)' : now,
      classById(clsId).name + ' · ' + rk);
  }
  save();
  renderClassResults(clsId);
}
function togglePointsRace(clsId, on) { S.raceDay.pointsRace[clsId] = !!on; save(); renderClassResults(clsId); }
function impNormName(s) {
  return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '')
    .toLowerCase().replace(/[.,'`’‘´"“”\-]/g, '').replace(/\s+/g, ' ').trim();
}
function impParseLapTime(s) {
  // Strip best-lap / flag markers (e.g. 00.12.210*) and normalize European comma
  // decimals (22,031 → 22.031) before parsing.
  s = String(s || '').trim().replace(/[*#!†]/g, '').replace(/,/g, '.').trim();
  if (!s || /^(dnf|dns|dq|dsq|ret|nc)$/i.test(s)) return Infinity;
  // Colon forms: hh:mm:ss.mmm or mm:ss.mmm
  const h = s.match(/^(\d+):(\d{1,2}):(\d{1,2}(?:\.\d+)?)$/);
  if (h) return parseInt(h[1]) * 3600 + parseInt(h[2]) * 60 + parseFloat(h[3]);
  const m = s.match(/^(\d+):(\d+(?:\.\d+)?)$/);
  if (m) return parseInt(m[1]) * 60 + parseFloat(m[2]);
  // Dot-separated timing forms: hh.mm.ss.mmm or mm.ss.mmm (last group = fraction of a second)
  const d3 = s.match(/^(\d+)\.(\d{1,2})\.(\d{1,2})\.(\d{1,3})$/);
  if (d3) return parseInt(d3[1]) * 3600 + parseInt(d3[2]) * 60 + parseInt(d3[3]) + parseFloat('0.' + d3[4]);
  const d2 = s.match(/^(\d+)\.(\d{1,2})\.(\d{1,3})$/);
  if (d2) return parseInt(d2[1]) * 60 + parseInt(d2[2]) + parseFloat('0.' + d2[3]);
  const n = parseFloat(s);
  return isNaN(n) ? Infinity : n;
}
function impTimeUnparsed(s) {
  s = String(s || '').trim();
  if (!s || /^(dnf|dns|dq|dsq|ret|nc)$/i.test(s)) return false;
  return impParseLapTime(s) === Infinity;
}
function findRosterMatch(name, num) {
  const byName = S.roster.filter(d => d.name.toLowerCase() === String(name).toLowerCase());
  if (!byName.length) return undefined;
  if (num == null || num === '') return byName[0];
  const exact = byName.find(d => String(d.num).toLowerCase() === String(num).toLowerCase());
  if (exact) return exact;
  const racingToday = byName.some(d => S.raceDay.entries.some(e => e.driverId === d.id));
  return racingToday ? undefined : byName[0];
}
/* ============================================================================
   §3  SIGN-UP
   v1 walked every driver through three screens: name/number → classes → pills.
   v2 is one screen. A returning driver taps their name (which fills the number
   and pre-ticks the classes they ran last time) and hits DRAW — three taps.
   Every safeguard from v1 survives: the identity-merge confirm, the per-class
   number-clash checks, the pill-exhaustion check, the consent record, and the
   license gate.
   ========================================================================= */

let signupDone = null;      /* {driver, drawn} while the pill reveal is showing */

function renderSignup() {

    + '<div class="card">'
    +   '<div class="field"><label for="dName">Driver name</label>'

    +   '<div class="field"><label for="dNum">Vehicle number</label>'
    +     '<input id="dNum" class="input-lg" type="text" placeholder="e.g. 47 or 12A" maxlength="5" '
    +     'autocomplete="off" autocapitalize="characters" oninput="signupTyped()"></div>'
    +   '<div class="field"><label>Classes tonight</label><div class="chips" id="chips"></div></div>'
    +   '<details style="margin-bottom:14px"><summary class="tiny" style="cursor:pointer;padding:6px 0">＋ Driven link code (optional)</summary>'
    +     '<div style="margin-top:8px"><input id="dProfCode" type="text" placeholder="e.g. K7Q2M4XN" maxlength="24" '
    +     'autocomplete="off" autocapitalize="characters">'
    +     '<p class="tiny" style="margin-top:5px">From your <a href="' + DRIVEN_URL + '" target="_blank" rel="noopener">Driven app</a> — pulls your card and career stats onto the lineup.</p></div></details>'
    +   '<div id="consentRow" style="display:none;margin:4px 0 12px">'
    +     '<label class="check"><input type="checkbox" id="consentChk" onchange="document.getElementById(\'e2\').style.display=\'none\'">'
    +     '<span>I agree to the <a onclick="openDoc(\'terms\')">Terms of Service</a> and <a onclick="openDoc(\'privacy\')">Privacy Policy</a>, and confirm my information is correct.</span></label></div>'
    +   '<div id="e1" class="note note-err" style="display:none;margin-bottom:10px"></div>'
    +   '<div id="e2" class="note note-err" style="display:none;margin-bottom:10px"></div>'
    +   '<button class="btn btn-go btn-block" id="drawBtn" onclick="register()"' + (blocked ? ' disabled' : '') + '>🎱 Draw my pills</button>'
    + '</div>'
    + rosterPickMarkup();
