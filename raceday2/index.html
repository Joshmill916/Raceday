/* v1's applyRole hand-toggled a dozen element display styles. In v2 the nav is
   derived from ROLE_PAGES every render, so this only has to handle the modes
   that change the shape of the app: kiosk, TV, and the operator bar. */
function applyRole() {
  const role = deviceRole();
  const allowed = ROLE_PAGES[role] || ROLE_PAGES.admin;
  const kiosk = role === 'register' && S.settings && S.settings.kioskReg;
  document.body.classList.toggle('kiosk', !!kiosk);
  document.body.classList.toggle('op-watch', operatorWatching());
  renderOpBar();
  renderHeader();
  renderNav();
  if (allowed.indexOf(curPage) < 0) nav(allowed[0]);
  else renderRaceControl();
  if (role === 'tv' && !TV.on && typeof openTV === 'function') openTV();
}

/* Operator bar — the owner's monitoring device: watch read-only, or take control. */
function renderOpBar() {
  let bar = document.getElementById('opBar');
  if (deviceRole() !== 'operator') { if (bar) bar.remove(); return; }
  if (!bar) {
    bar = document.createElement('div');
    bar.id = 'opBar';
    bar.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:90;display:flex;align-items:center;gap:12px;'
      + 'flex-wrap:wrap;padding:11px 16px calc(11px + env(safe-area-inset-bottom));background:var(--asphalt-3);'
      + 'border-top:2px solid var(--plate);font-size:13.5px';
    document.body.appendChild(bar);
  }
  const watching = operatorWatching();
  bar.innerHTML = '<span class="badge ' + (watching ? 'badge-dim' : 'badge-plate') + '">'
      + (watching ? '👁 Watching' : '✎ Controlling') + '</span>'
    + '<span class="muted">' + esc(S.track.name || 'Track') + ' · ' + esc(syncKey() || 'no code') + '</span>'
    + '<span style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap">'
    + (watching
        ? '<button class="btn btn-sm btn-primary" onclick="opTakeControl()">Take control</button>'
        : '<button class="btn btn-sm" onclick="opBackToWatch()">Back to watching</button>')
    + '<button class="btn btn-sm btn-ghost" onclick="opStop()">Exit</button></span>';
}

/* ---------------------------------------------------------------- recovery */
/* localStorage held something we could not parse. Never overwrite it silently:
   offer the raw bytes as a download first, and make "start fresh" deliberate. */
function checkLoadFailure() {
  if (!LOAD_FAILURE) return;
  openSheet('Saved data could not be read',
    '<div class="note note-err" style="margin-bottom:14px">This device has ' + LOAD_FAILURE.raw.length
      + ' characters of saved RaceDay data that could not be opened. It has <b>not</b> been deleted.</div>'
      + '<p class="sub">Download it first — the app owner may be able to recover the season from it. '
      + 'Starting fresh permanently overwrites it.</p>',
    '<button class="btn btn-primary" onclick="downloadRecoveryFile()">⬇ Download the unreadable data</button>'
      + '<button class="btn btn-danger" onclick="confirmStartFresh()">Start fresh</button>',
    { cls:'sheet' });
}
function downloadRecoveryFile() {
  if (!LOAD_FAILURE) return;
  downloadFile('raceday-unreadable-' + Date.now() + '.json', LOAD_FAILURE.raw, 'application/json');
}
function confirmStartFresh() {
  if (!confirm('Start fresh on this device? The saved data that could not be read will be permanently overwritten. Make sure you already downloaded it if you might need it.')) return;
  LOAD_FAILURE = null;
  save();                 /* persists the already-active defaults() S over the bad key */
  closeSheet();
  renderAll();
}

/* -------------------------------------------------------------------- boot */
/* Order matters and mirrors v1: URL params (which may set role + sync) before
   anything reads the role, sync last because it is async. */
window.addEventListener('storage', e => {
  if (e.key !== KEY) return;
  S = load();
  renderAll();
  checkLoadFailure();
  if (TV.on) tvRender();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && sheetOpen()) closeSheet();
});

applyTheme();
handleUrlParams();
applyRole();
nav(curPage);
renderAll();
initSync();

/* Pick up any Driven cards linked while offline (no-op when none are pending). */
if (navigator.onLine && (S.roster || []).some(d => d.profile && d.profile.pendingFetch)) retryPendingProfiles();

/* First-run setup ONLY for a genuinely new, standalone admin device — never for a
   device JOINING an existing track. initSync() above is async, so on ANY fresh device
   S.track.name is still empty right here regardless of role while the real cloud data
   is in flight; without this guard a spectator's phone that just scanned the QR code
   (role viewer, sync enabled) would be handed the full setup wizard — track name,
   classes, and a NEW ADMIN PIN — all editable and all synced live into the shared room.
   Also never fires on LOAD_FAILURE: S.track.name is empty on the defaults() fallback
   exactly like a fresh install, but this device is not fresh, and offering "set up a new
   track" there would bury the fact that real data exists. */
if (!LOAD_FAILURE && !S.track.name && deviceRole() === 'admin' && !(S.sync && S.sync.enabled)) openSetupWizard();
checkLoadFailure();

</script>
</body>
</html>
