<script>
/* Short link for LinkedIn posts and the Page button: victoryraceday.com/li/
   Facebook's and LinkedIn's in-app browsers hide where a visitor came from, so every visit
   used to show as "direct". Visiting this path first records it in Cloudflare Web Analytics
   (Paths), then forwards — so the source shows up. Opted-out devices (/me/) just forward. */
(function () {
  var done = false, go = function () { if (done) return; done = true; location.replace('/' + location.search + location.hash); };
  var off = false;
  try { off = localStorage.getItem('rd_dont_count') === '1'; } catch (e) {}
  if (off) { go(); return; }
  var s = document.createElement('script');
  s.defer = true;
  s.src = 'https://static.cloudflareinsights.com/beacon.min.js';
  s.setAttribute('data-cf-beacon', '{"token": "07e858325a984890a4f60c1cec1942bc"}');
  s.onload = function () { setTimeout(go, 400); };
  s.onerror = go;
  document.body.appendChild(s);
  setTimeout(go, 1500);
})();
</script>
