<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Driver Profile — Driven</title>
<meta name="description" content="A driver's racing profile on Driven — results posted by the tracks themselves.">
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="512x512" href="../driven/icon-driven.png">
<link rel="apple-touch-icon" href="../driven/icon-driven.png">
<meta name="theme-color" content="#0b0c10">
<style>
  /* Public driver page — what a fan or sponsor sees from a shared link
     (victoryraceday.com/d/?CODE). Read-only: everything comes from the driver's
     PUBLISHED card (profiles/<id>/card) and track-published results, fetched over the
     Firebase REST API (no SDK, no account). Broadcast look, tokens from driven/index.html. */
  :root {
    --ink-0: #0b0c10; --ink-1: #12141a; --ink-2: #1a1d25; --ink-3: #242834;
    --line-d: rgba(255,255,255,.08); --td: #f5f6f8; --td-mute: #8f939d;
    --brand: #1f6fd6; --plate: #ffc400;
    --display: 'Saira Condensed', 'Arial Narrow', sans-serif;
    --body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--body); background: var(--ink-0); color: var(--td); min-height: 100vh; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 0 40px; }
  .top { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; }
  .back { display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px 7px 8px; border-radius: 99px; background: var(--ink-2); border: 1px solid rgba(255,255,255,.14); color: var(--td); text-decoration: none; font: 700 14px var(--display); letter-spacing: .1em; text-transform: uppercase; }
  .back img { width: 24px; height: 24px; border-radius: 6px; }
  .brand { font: 800 18px var(--display); letter-spacing: .16em; text-transform: uppercase; color: var(--td); text-decoration: none; border-bottom: 3px solid var(--brand); padding-bottom: 2px; }
  .cap { font: 700 11.5px var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--td-mute); }
  .sec { margin: 22px 16px 0; }
  .sec > .cap { margin-bottom: 8px; display: block; }

  /* Hero */
  .banner { position: relative; height: 190px; overflow: hidden; background: var(--ink-2) center/cover no-repeat; }
  .banner.gen { background: linear-gradient(115deg, var(--ink-2) 0 50%, var(--team) 50% 57%, var(--ink-2) 57% 59%, var(--team2, var(--team)) 59% 62.5%, var(--ink-2) 62.5% 64%, var(--team3, var(--team)) 64% 65.5%, var(--ink-1) 65.5%); }
  .banner .bignum { position: absolute; right: 10px; bottom: -28px; font: italic 800 190px/1 var(--display); color: transparent; -webkit-text-stroke: 2px rgba(255,255,255,.18); letter-spacing: -.03em; }
  .banner .checker { position: absolute; left: 0; right: 0; bottom: 0; height: 8px; background: repeating-conic-gradient(#0b0c10 0% 25%, #e9eaee 0% 50%) 0 0/16px 16px; }
  .banner::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 45%, rgba(11,12,16,.75)); }
  .who { position: relative; display: flex; align-items: flex-end; gap: 14px; padding: 0 16px; margin-top: -44px; z-index: 1; }
  .avatar { width: 92px; height: 92px; border-radius: 50%; flex: none; object-fit: cover; border: 4px solid var(--team); box-shadow: 0 0 0 3px var(--team2, var(--team)); background: var(--ink-3); display: flex; align-items: center; justify-content: center; font: 800 34px var(--display); color: #fff; }
  .name { font: 800 32px/0.95 var(--display); text-transform: uppercase; letter-spacing: .01em; }
  .badge { display: inline-block; margin-left: 6px; padding: 2px 7px; border-radius: 5px; background: var(--team); color: #fff; font: 800 12px var(--display); letter-spacing: .12em; vertical-align: 5px; }
  .meta { margin-top: 6px; }
  .actions { display: flex; gap: 8px; padding: 14px 16px 0; }
  .btn { flex: 1; text-align: center; padding: 11px; border-radius: 10px; font: 700 14px var(--display); letter-spacing: .1em; text-transform: uppercase; border: 1px solid rgba(255,255,255,.22); background: transparent; color: var(--td); cursor: pointer; text-decoration: none; }
  .btn.primary { background: var(--team); border-color: var(--team); color: #fff; }

  /* Latest result */
  .latest { margin: 16px 16px 0; background: var(--ink-1); border-left: 4px solid var(--team2, var(--plate)); padding: 12px 14px; }
  .latest .row { display: flex; align-items: center; gap: 14px; margin-top: 4px; }
  .latest .p { font: 800 46px/1 var(--display); color: var(--plate); }
  .latest .t { font-size: 15px; font-weight: 600; }
  .latest .s { font-size: 13px; color: var(--td-mute); margin-top: 2px; }

  /* Stat tiles */
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 12px 16px 0; }
  .tile { background: var(--ink-1); border-radius: 12px; padding: 12px 4px 10px; text-align: center; }
  .tile b { display: block; font: 800 28px/1 var(--display); font-variant-numeric: tabular-nums; margin-bottom: 4px; }

  /* Standings, form, badges */
  .stand { display: flex; align-items: center; gap: 12px; background: var(--ink-1); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; }
  .stand .rk { font: 800 30px/1 var(--display); min-width: 52px; color: var(--td); }
  .stand .t { font-weight: 600; font-size: 14.5px; }
  .stand .s { font-size: 12.5px; color: var(--td-mute); margin-top: 2px; }
  .form { background: var(--ink-1); border-radius: 12px; padding: 12px 14px 8px; }
  .form svg { display: block; width: 100%; height: 64px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { background: var(--ink-2); border: 1px solid var(--line-d); border-radius: 99px; padding: 7px 12px; font-size: 13px; font-weight: 600; }
  .chip i { font-style: normal; color: var(--plate); margin-right: 5px; }

  /* Results */
  .list { background: var(--ink-1); border-radius: 12px; overflow: hidden; }
  .res { display: grid; grid-template-columns: 50px 1fr auto; gap: 10px; align-items: center; padding: 11px 14px; border-top: 1px solid var(--line-d); }
  .res:first-child { border-top: none; }
  .pos { font: 800 22px var(--display); text-align: center; }
  .pos.p1 { color: var(--plate); }
  .res .t { font-weight: 600; font-size: 14px; }
  .res .s { font-size: 12.5px; color: var(--td-mute); margin-top: 2px; }
  .res .pts { font: 700 14px var(--display); color: var(--td-mute); letter-spacing: .04em; }
  .empty { color: var(--td-mute); font-size: 14px; padding: 16px 14px; line-height: 1.5; }
  .verified { font-size: 12px; color: var(--td-mute); margin: 8px 2px 0; }

  /* About + sponsors */
  .about { background: var(--ink-1); border-radius: 12px; padding: 14px; font-size: 14.5px; line-height: 1.6; }
  .about .cap { display: block; margin: 12px 0 4px; }
  .about .cap:first-child { margin-top: 0; }
  .sponsors { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .sponsor { background: var(--td); color: var(--ink-1); border-radius: 10px; padding: 16px 10px; text-align: center; font: 800 15px var(--display); letter-spacing: .06em; text-transform: uppercase; }

  .msg { text-align: center; padding: 80px 20px; color: var(--td-mute); }
  .msg h1 { font: 800 30px var(--display); text-transform: uppercase; color: var(--td); margin-bottom: 8px; }
  .foot { text-align: center; margin: 30px 16px 0; font-size: 13px; color: var(--td-mute); line-height: 1.7; }
  .foot a { color: #6aa5f0; font-weight: 600; text-decoration: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" id="backBtn" href="../driven/"><img src="../driven/icon-driven.png" alt="">‹ <span id="backLbl">Driven</span></a>
    <span class="cap">Driver profile</span>
  </div>
  <div id="app"><div class="msg">Loading profile…</div></div>
  <div class="foot">
    Results on Driven are posted by the tracks themselves — drivers can't type them in.<br>
    <a href="../driven/">Make your own driver profile — free</a> · <a href="../">RaceDay for tracks</a>
  </div>
</div>
<script>
var DB = 'https://raceday-d32dd-default-rtdb.firebaseio.com';
// Must match driven/index.html + raceday/index.html EXACTLY (see CLAUDE.md "Premium").
var PREM_SALT = 'rd-prem-7t4mq2xz-2026';
function pHash(str) {
  function fnv(s, seed) {
    var h = seed >>> 0;
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
    return ('0000000' + h.toString(36).toUpperCase()).slice(-7);
  }
  return fnv(str, 2166136261) + fnv(str + '#2', 2166136261);
}
function premCheck(profileId, code) {
  var parts = String(code || '').trim().toUpperCase().split('-');
  if (parts.length !== 3 || parts[0] !== 'PREM') return false;
  if (parts[1] !== profileId.slice(5, 13).toUpperCase()) return false;
  return parts[2] === pHash(profileId + '|PREM|' + PREM_SALT).slice(0, 8);
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function imgOK(src) { return typeof src === 'string' && /^data:image\/(png|jpe?g);base64,[A-Za-z0-9+/=]+$/.test(src); }
function str(v, max) { return typeof v === 'string' ? v.slice(0, max) : ''; }
// A REST read that resolves null on any failure (missing node, rules denial, offline) —
// every section is optional, so one unavailable path never blanks the page.
function get(path) {
  return fetch(DB + '/' + path + '.json').then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
}
function codeFromUrl() {
  var raw = (location.search.replace(/^\?/, '').split('&')[0] || location.hash.replace(/^#/, '') || '');
  if (raw.indexOf('=') >= 0) raw = raw.split('=')[1] || '';
  return decodeURIComponent(raw).toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 20);
}
function show(html) { document.getElementById('app').innerHTML = html; }
function notFound(text) { show('<div class="msg"><h1>Driver not found</h1>' + esc(text) + '</div>'); }
function fmtDate(d) {
  var t = Date.parse(d + 'T12:00:00');
  return isNaN(t) ? d : new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
}
function ord(n) { var s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }

// Track-published results: profileTracks/<id> lists the driver's tracks, then each
// results/<trackId>/<date>/<class>/<driverKey> tree is read whole. The driver's own rows
// become their results; everyone's rows at that track feed the season standings.
function loadResults(profileId) {
  return get('profileTracks/' + profileId).then(function (tracks) {
    if (!tracks || typeof tracks !== 'object') return { mine: [], standings: [] };
    return Promise.all(Object.keys(tracks).map(function (trackId) {
      return get('results/' + encodeURIComponent(trackId)).then(function (byDate) {
        var fallback = str(tracks[trackId] && tracks[trackId].trackName, 60) || 'RaceDay track';
        var mine = [], totals = {};   // totals[season|class][driverKey] = points
        Object.keys(byDate || {}).forEach(function (date) {
          var season = date.slice(0, 4);
          var byClass = byDate[date] || {};
          Object.keys(byClass).forEach(function (cls) {
            var byDriver = byClass[cls] || {};
            Object.keys(byDriver).forEach(function (k) {
              var row = byDriver[k];
              if (!row || typeof row.position !== 'number') return;
              var key = row.profileId || k, sc = season + '|' + cls;
              if (typeof row.points === 'number') {
                totals[sc] = totals[sc] || {};
                totals[sc][key] = (totals[sc][key] || 0) + row.points;
              }
              if (row.profileId === profileId) {
                mine.push({ date: date, cls: cls, pos: row.position, pts: typeof row.points === 'number' ? row.points : null,
                            track: str(row.trackName, 60) || fallback });
              }
            });
          });
        });
        var standings = Object.keys(totals).map(function (sc) {
          var t = totals[sc]; if (!(profileId in t)) return null;
          var ranked = Object.keys(t).sort(function (a, b) { return t[b] - t[a]; });
          return { season: sc.split('|')[0], cls: sc.slice(5), track: fallback, rank: ranked.indexOf(profileId) + 1, of: ranked.length, pts: t[profileId] };
        }).filter(Boolean);
        return { mine: mine, standings: standings };
      });
    })).then(function (parts) {
      var mine = [].concat.apply([], parts.map(function (p) { return p.mine; }));
      var standings = [].concat.apply([], parts.map(function (p) { return p.standings; }));
      mine.sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
      standings.sort(function (a, b) { return a.season < b.season ? 1 : a.season > b.season ? -1 : a.rank - b.rank; });
      return { mine: mine, standings: standings };
    });
  });
}

// Milestones drivers want to show off — computed from verified results only.
function milestones(results) {
  var out = [], chrono = results.slice().reverse();
  var wins = results.filter(function (r) { return r.pos === 1; }).length;
  var podiums = results.filter(function (r) { return r.pos <= 3; }).length;
  var tracks = {}; results.forEach(function (r) { tracks[r.track] = 1; });
  var streak = 0, best = 0; chrono.forEach(function (r) { streak = r.pos === 1 ? streak + 1 : 0; best = Math.max(best, streak); });
  if (wins >= 1) out.push('First win');
  if (best >= 3) out.push('Hat trick');
  [100, 50, 25, 10].some(function (n) { if (wins >= n) { out.push(n + ' wins'); return true; } });
  [100, 50, 25, 10].some(function (n) { if (podiums >= n) { out.push(n + ' podiums'); return true; } });
  [250, 100, 50, 25, 10].some(function (n) { if (results.length >= n) { out.push(n + ' starts'); return true; } });
  if (Object.keys(tracks).length >= 2) out.push(Object.keys(tracks).length + ' tracks');
  return out;
}

// Finishing positions over the last 12 results, oldest → newest; higher on the chart = better.
function formChart(results) {
  var pts = results.slice(0, 12).reverse();
  if (pts.length < 2) return '';
  var worst = Math.max.apply(null, pts.map(function (r) { return r.pos; }).concat([5]));
  var W = 300, H = 64, pad = 6;
  var xy = pts.map(function (r, i) {
    return [pad + i * (W - pad * 2) / (pts.length - 1), pad + (r.pos - 1) * (H - pad * 2) / (worst - 1)];
  });
  var last = xy[xy.length - 1];
  return '<div class="form"><svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">'
    + '<polyline points="' + xy.map(function (p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ')
    + '" fill="none" stroke="#ffc400" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>'
    + '<circle cx="' + last[0].toFixed(1) + '" cy="' + last[1].toFixed(1) + '" r="4" fill="#ffc400"/></svg>'
    + '<div class="cap" style="display:flex;justify-content:space-between;margin-top:4px"><span>' + esc(fmtDate(pts[0].date)) + '</span><span>Latest: ' + ord(pts[pts.length - 1].pos) + '</span></div></div>';
}

function render(profileId, card, isPro, data) {
  var results = data.mine, standings = data.standings;
  var name = str(card.name, 40), num = str(card.num, 8), home = str(card.hometown, 60), aka = str(card.aliases, 60);
  var team = /^#[0-9a-fA-F]{6}$/.test(card.teamColor || '') ? card.teamColor : '#1f6fd6';
  var initials = name.split(/\s+/).map(function (w) { return w[0] || ''; }).slice(0, 2).join('').toUpperCase();
  var sponsors = str(card.sponsors, 160).split(' · ').filter(Boolean);
  var crew = str(card.crew, 160).split(',').map(function (s) { return s.trim(); }).filter(Boolean);
  var bio = str(card.bio, 300), highlights = str(card.highlights, 300);
  var meta = [num ? '#' + esc(num) : '', home ? esc(home) : '', aka ? 'AKA ' + esc(aka) : ''].filter(Boolean).join(' · ');
  document.title = name + (num ? ' #' + num : '') + ' — Driven';
  document.documentElement.style.setProperty('--team', team);
  // Pro accent colors; without them the page keeps the single-color look.
  ['teamColor2', 'teamColor3'].forEach(function (k, i) {
    var c = isPro && /^#[0-9a-fA-F]{6}$/.test(card[k] || '') ? card[k] : team;
    document.documentElement.style.setProperty(i ? '--team3' : '--team2', c);
  });

  var wins = results.filter(function (r) { return r.pos === 1; }).length;
  var top5 = results.filter(function (r) { return r.pos <= 5; }).length;
  var avg = results.length ? (results.reduce(function (s, r) { return s + r.pos; }, 0) / results.length) : 0;

  // Hero: the driver's header photo (Pro), else a generated team-color banner.
  var banner = isPro && imgOK(card.header);
  var h = '<div class="banner' + (banner ? '' : ' gen') + '"' + (banner ? ' style="background-image:url(\'' + card.header + '\')"' : '') + '>'
    + (!banner && num ? '<div class="bignum">' + esc(num) + '</div>' : '') + '<div class="checker"></div></div>'
    + '<div class="who">'
    + (imgOK(card.photo) ? '<img class="avatar" src="' + card.photo + '" alt="">' : '<div class="avatar">' + esc(num || initials) + '</div>')
    + '<div style="padding-bottom:6px;min-width:0"><div class="name">' + esc(name) + (isPro ? '<span class="badge">PRO</span>' : '') + '</div>'
    + '<div class="cap meta">' + meta + '</div></div></div>'
    + '<div class="actions"><button class="btn primary" onclick="shareLink()">Share profile</button></div>';

  if (results.length) {
    var r0 = results[0];
    h += '<div class="latest"><span class="cap">Latest result · verified by the track</span>'
      + '<div class="row"><div class="p">' + (r0.pos === 1 ? 'WIN' : 'P' + r0.pos) + '</div>'
      + '<div><div class="t">' + esc(r0.cls) + ' · ' + esc(r0.track) + '</div>'
      + '<div class="s">' + esc(fmtDate(r0.date)) + (r0.pts != null ? ' · +' + r0.pts + ' pts' : '') + '</div></div></div></div>';
  }

  h += '<div class="tiles">'
    + '<div class="tile"><b>' + results.length + '</b><span class="cap">Starts</span></div>'
    + '<div class="tile"><b>' + wins + '</b><span class="cap">Wins</span></div>'
    + '<div class="tile"><b>' + top5 + '</b><span class="cap">Top 5</span></div>'
    + '<div class="tile"><b>' + (results.length ? avg.toFixed(1) : '—') + '</b><span class="cap">Avg finish</span></div>'
    + '</div>';

  if (isPro && standings.length) {
    h += '<div class="sec"><span class="cap">Points standings</span>' + standings.slice(0, 4).map(function (s) {
      return '<div class="stand"><div class="rk">#' + s.rank + '</div><div><div class="t">' + esc(s.cls) + '</div>'
        + '<div class="s">' + esc(s.track) + ' · ' + esc(s.season) + ' season · ' + s.pts + ' pts · of ' + s.of + ' drivers</div></div></div>';
    }).join('') + '</div>';
  }
  if (isPro && results.length >= 2) h += '<div class="sec"><span class="cap">Season form</span>' + formChart(results) + '</div>';
  var ms = isPro ? milestones(results) : [];
  if (ms.length) h += '<div class="sec"><span class="cap">Milestones</span><div class="chips">' + ms.map(function (m) { return '<span class="chip"><i>★</i>' + esc(m) + '</span>'; }).join('') + '</div></div>';

  h += '<div class="sec"><span class="cap">Results</span><div class="list">';
  if (!results.length) {
    h += '<div class="empty">No results posted yet. They appear here automatically when a RaceDay track publishes a race night.</div>';
  } else {
    h += results.slice(0, 50).map(function (r) {
      return '<div class="res"><div class="pos' + (r.pos === 1 ? ' p1' : '') + '">' + ord(r.pos) + '</div>'
        + '<div><div class="t">' + esc(r.cls) + '</div><div class="s">' + esc(r.track) + ' · ' + esc(fmtDate(r.date)) + '</div></div>'
        + '<div class="pts">' + (r.pts != null ? r.pts + ' pts' : '') + '</div></div>';
    }).join('');
  }
  h += '</div>' + (results.length ? '<div class="verified">✓ Every result was posted by the track\'s official RaceDay scoring.</div>' : '') + '</div>';

  if (bio || highlights || crew.length) {
    h += '<div class="sec"><span class="cap">About</span><div class="about">'
      + (bio ? '<div>' + esc(bio) + '</div>' : '')
      + (highlights ? '<span class="cap">Highlights</span><div>' + esc(highlights) + '</div>' : '')
      + (crew.length ? '<span class="cap">Crew</span><div>' + crew.map(esc).join(' · ') + '</div>' : '')
      + '</div></div>';
  }
  if (sponsors.length) {
    h += '<div class="sec"><span class="cap">Sponsors</span><div class="sponsors">'
      + sponsors.map(function (s) { return '<div class="sponsor">' + esc(s) + '</div>'; }).join('') + '</div></div>';
  }
  show(h);
}

function shareLink() {
  var url = location.href.split('#')[0];
  if (navigator.share) { navigator.share({ title: document.title, url: url }).catch(function () {}); return; }
  if (navigator.clipboard) navigator.clipboard.writeText(url).then(function () { alert('Link copied.'); }).catch(function () { prompt('Copy this link:', url); });
  else prompt('Copy this link:', url);
}

(function backLabel() {
  var mine = false;
  try { mine = !!localStorage.getItem('profiles_v1'); } catch (_) {}
  document.getElementById('backLbl').textContent = mine ? 'Back to my Driven' : 'Get Driven — free';
})();

(function init() {
  var code = codeFromUrl();
  if (!code) { notFound('This link is missing the driver code.'); return; }
  get('profiles_short/' + code).then(function (profileId) {
    if (typeof profileId !== 'string' || !/^prof_[a-z0-9]{6,20}$/i.test(profileId)) { notFound('No driver uses the code ' + code + '.'); return; }
    return Promise.all([get('profiles/' + profileId + '/card'), get('profiles/' + profileId + '/entitlement'), loadResults(profileId)])
      .then(function (r) {
        var card = r[0], ent = r[1], data = r[2] || { mine: [], standings: [] };
        if (!card || !card.name) { notFound("This driver hasn't published a profile yet."); return; }
        // Pro = a valid owner code on the card (recomputed here, never trusted as a flag)
        // OR an active server-written subscription entitlement.
        var isPro = premCheck(profileId, card.premiumCode)
          || !!(ent && ent.tier === 'pro' && (ent.status === 'active' || ent.status === 'trialing'));
        render(profileId, card, isPro, data);
      });
  }).catch(function () { show('<div class="msg"><h1>Couldn\'t load</h1>Check your connection and try again.</div>'); });
})();
</script>
</body>
</html>
